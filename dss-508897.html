<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DSS Studio OS — a Telaia demo for Daria Sheina Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1EFE9;--card:#FFFFFF;--ink:#1C1C1A;--mute:#6E6A62;--line:#E2DFD6;--cedar:#8A7430;--cedar2:#EDE6CF;--moss:#494B21;--moss2:#E2E3D2;--red:#B4412F;--red2:#F3DAD4;--amber:#B97F14;--amber2:#F5E6C6;--sans:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100svh}
.side{background:#000;color:#EDEAE3;padding:20px 14px;position:sticky;top:0;height:100svh;overflow:auto}
.logo{font-weight:600;letter-spacing:.55em;font-size:15px;padding:4px 8px 2px}
.logosub{font-size:11px;color:#A7A296;padding:0 8px 18px;letter-spacing:.04em}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#8E897E;margin:16px 8px 6px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:#EDEAE3;padding:7px 10px;border-radius:6px;font-size:13.5px}
.navbtn:hover{background:#2C2B28}.navbtn.on{background:#EDEAE3;color:var(--ink)}
.badge{font:500 11px var(--mono);background:var(--red);color:#fff;border-radius:9px;padding:1px 7px}
.burger{display:none}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.crumb{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:22px;font-weight:600;margin:2px 0 0;letter-spacing:-.01em}
.demoflag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap}
.wbody{padding:16px 26px 40px}
.lede{color:var(--mute);margin:0 0 13px;max-width:780px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;min-width:0}
.hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hd b{font-weight:600}.hd span{font-size:12px;color:var(--mute)}
.bd{padding:13px 14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
.grid>*,.split>*,.g4>*,.g3>*{min-width:0}
.split>.card{margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font:500 24px var(--mono);margin-top:4px;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--mute)}
.stat.bad .v{color:var(--red)}.stat.warn .v{color:var(--amber)}.stat.good .v{color:var(--moss)}
.scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{text-align:left;font-weight:500;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.dt tr:last-child td{border-bottom:0}
.dt tr.click{cursor:pointer}.dt tr.click:hover td{background:#FAF8F4}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.sub{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:#EEEBE5;white-space:nowrap}
.pill.red{background:var(--red2);color:var(--red)}.pill.amber{background:var(--amber2);color:#7A5409}.pill.moss{background:var(--moss2);color:var(--moss)}.pill.cedar{background:var(--cedar2);color:var(--cedar)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.moretog{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#FAF8F4;padding:8px;font-size:12.5px;color:var(--mute);border-radius:0 0 10px 10px}
.illus{font-size:10.5px;color:var(--cedar);border:1px dashed var(--cedar);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.real{font-size:10.5px;color:var(--moss);border:1px solid var(--moss);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
/* charts */
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 74px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:14px;background:#F0EDE7;border-radius:3px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hb .vv{font:12px var(--mono);text-align:right}
.dv{display:grid;grid-template-columns:minmax(120px,190px) 1fr 80px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.dv .tr{height:14px;position:relative}
.dv .tr:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mute)}
.dv .fl{position:absolute;top:0;bottom:0;border-radius:2px}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:14px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.cols .b{width:100%;border-radius:3px 3px 0 0;position:relative}
.cols .b i{position:absolute;top:-15px;left:0;right:0;text-align:center;font:10.5px var(--mono);font-style:normal;color:var(--mute)}
.cols .xl{font-size:10.5px;color:var(--mute);margin-top:4px;white-space:nowrap}
.sb{display:flex;height:16px;gap:2px;border-radius:3px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.meter{height:8px;background:#F0EDE7;border-radius:4px;position:relative;margin-top:4px;overflow:visible}
.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pipe .st{border:1px solid var(--line);border-radius:8px;padding:9px;background:#FAF8F4;min-width:0}
.pipe .st b{display:block;font:500 20px var(--mono)}
.pipe .st span{font-size:11.5px;color:var(--mute)}
.pipe .st em{display:block;font-style:normal;font-size:11.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* queue */
.q{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.q:last-child{border-bottom:0}
.q .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.q .t{flex:1;min-width:0}.q .t b{font-weight:600}
.q .a{flex:none}
/* inspector */
.insp{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .22s;z-index:70;overflow:auto}
.insp.open{transform:none}
.insp .ih{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.insp .ib{padding:14px 16px}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;width:32px;height:32px;font-size:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;white-space:nowrap;flex:none}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:12.5px;color:var(--mute);border-left:3px solid var(--cedar2);padding:4px 10px;margin:10px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:90;pointer-events:none}
.toast.on{opacity:1}
.phasebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#000;color:#EBE9E2;border-radius:10px;padding:9px 14px;margin-bottom:13px;font-size:13px}
.phasebar b{font-weight:600}.phasebar .when{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#C9C4B4}
.fb{margin-top:18px;background:var(--card);border:1px dashed var(--cedar);border-radius:10px;padding:12px 14px}
.fb .q{font-weight:600;margin-bottom:8px}.fb .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fb .opt{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px}
.fb .opt.on{background:var(--moss);border-color:var(--moss);color:#fff}
.fb textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;resize:vertical}
.syncline{margin:-6px 0 12px;font-size:12.5px;color:var(--mute)}.syncst[data-s=ok]{color:var(--moss)}.syncst[data-s=err]{color:var(--red)}
.who .bd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.who label{font-weight:600}.who input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;background:#fff}
.fb .saved{font-size:11.5px;color:var(--mute);margin-top:4px}
.phcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.phcards>*{min-width:0}
.phcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.phcard .n{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cedar)}
.phcard h3{margin:4px 0 6px;font-size:17px;font-weight:600}.phcard ul{margin:8px 0 10px;padding-left:18px;font-size:13px}.phcard li{margin:3px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tiles>*{min-width:0}
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.post .img{height:120px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11.5px;font-family:var(--mono)}
.post .bd{padding:10px 12px;font-size:13px}
@media (max-width:900px){.phcards,.tiles{grid-template-columns:1fr}}

.sys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sys .card{margin:0}
.portal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.portal .ph{background:var(--ink);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;font-size:13px}
.portal .pb{padding:14px}
.dec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
/* responsive — injected last */
@media (max-width:1000px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;height:auto;z-index:60;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:none}
 .logosub{display:none}.logo{padding:4px 0}
 .burger{display:block;background:none;border:1px solid #55524B;color:#EDEAE3;border-radius:6px;padding:5px 10px}
 #nav{display:none;position:fixed;top:50px;left:0;right:0;bottom:0;background:var(--ink);padding:10px 14px 30px;overflow:auto}
 #nav.open{display:block}
 .top{position:static;padding:14px 16px}
 .wbody{padding:14px 16px 40px}
 .g4{grid-template-columns:repeat(2,1fr)}
 .g3{grid-template-columns:repeat(2,1fr)}
 .g3>*:nth-child(3):last-child{grid-column:1/-1}
 .split{grid-template-columns:1fr}
 .sys{grid-template-columns:1fr 1fr}
 .pipe{grid-template-columns:repeat(3,1fr)}
 .insp{top:50px}
}
@media (max-width:560px){
 .demoflag{display:none}
 h1{font-size:19px}
 .scroll table.dt{min-width:600px}
 .scroll .dt th:first-child,.scroll .dt td:first-child{position:sticky;left:0;background:#fff;z-index:1}
 .hb{grid-template-columns:96px 1fr 62px}
 .dv{grid-template-columns:100px 1fr 66px}
 .sys{grid-template-columns:1fr}
 .pipe{grid-template-columns:repeat(2,1fr)}
 .kv{grid-template-columns:110px 1fr}
 .stat .v{font-size:20px}
 .q{flex-wrap:wrap}.q .a{margin-left:21px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div><div class="logo">D S S</div><div class="logosub">Studio OS · powered by Telaia</div></div>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <nav id="nav"></nav>
 </aside>
 <main class="main">
  <div class="top"><div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div><div class="demoflag">Demo · figures illustrative</div></div>
  <div class="wbody" id="view"></div>
 </main>
</div>
<aside class="insp" id="insp"><div class="ih"><div id="ihead"></div><button class="x" id="inspclose" aria-label="Close">×</button></div><div class="ib" id="ibody"></div></aside>
<div class="toast" id="toast"></div>
<script>
// ---------- DATA ----------
// TODAY fixed for the demo
const TODAY=new Date('2026-11-13T09:00:00');
const fmt=n=>'$'+Math.round(n).toLocaleString('en-CA');
const k=n=>'$'+(n>=1000?(Math.round(n/100)/10)+'k':Math.round(n));
const RATE=135; // blended billing rate (illustrative)
const PH=['Pre-design','Schematic','Design dev.','Permit / CDs','Tender','Construction'];
// phases: [fee, spentHrs, pctComplete]
const projects=[
 {id:'CW',name:'Calm Waters Retail',loc:'Tofino, BC',type:'Retail + office',client:'Tla-o-qui-aht First Nation',real:true,started:2021,
  stage:2,phases:[[14000,104,1],[38000,290,1],[52000,330,.70],[61000,0,0],[9000,0,0],[44000,0,0]],
  note:'Retail and office space for the Nation and its administration (from dariasheina.com). Phase fees, hours and progress are illustrative.'},
 {id:'IC',name:'Ireland Canada Place',loc:'Vancouver, BC',type:'Public space',client:'ICP Society',real:true,started:2022,
  stage:2,phases:[[9000,61,1],[26000,188,1],[31000,110,.55],[22000,0,0],[5000,0,0],[18000,0,0]],
  note:'A permanent tribute to Irish immigrants and their descendants (from dariasheina.com). Figures illustrative.'},
 {id:'FP',name:'East 33rd Fourplex',loc:'Vancouver, BC',type:'Multiplex · 4 units',client:'Private developer',real:false,started:2025,
  stage:3,phases:[[6000,40,1],[18000,140,1],[24000,170,1],[34000,262,.82],[6000,0,0],[26000,0,0]],
  note:'Illustrative missing-middle project, standing in for the multiplex work the studio describes.'},
 {id:'LS',name:'Lakewood Sixplex',loc:'Vancouver, BC',type:'Multiplex · 6 units',client:'Private developer',real:false,started:2026,
  stage:1,phases:[[8000,52,1],[24000,100,.60],[30000,0,0],[42000,0,0],[7000,0,0],[32000,0,0]],
  note:'Illustrative second multiplex at schematic design.'},
 {id:'RR',name:'Renfrew Ridge',loc:'Renfrew-Collingwood, Vancouver',type:'Duplex · 3 storeys',client:'Vanway Properties',real:true,started:2023,
  stage:5,phases:[[5000,34,1],[16000,121,1],[20000,150,1],[28000,214,1],[4000,28,1],[22000,172,.96]],
  note:'Completed 2026 per dariasheina.com. Shown in closeout; fees illustrative.'},
 {id:'NE',name:'The Nest',loc:'Keats Island, BC',type:'Off-grid prefab retreat · 1,063 sf',client:'Private client',real:true,started:2023,
  stage:6,phases:[[6000,40,1],[22000,160,1],[24000,175,1],[26000,190,1],[3000,20,1],[19000,138,1]],
  note:'Completed 2025. Prefabricated mass timber by BC Passive House, flown in by helicopter, assembled in two days (Dezeen, Western Living). Fees illustrative.'},
];
projects.forEach(p=>{
 p.fee=p.phases.reduce((s,x)=>s+x[0],0);
 p.earned=p.phases.reduce((s,x)=>s+x[0]*x[2],0);
 p.spent=p.phases.reduce((s,x)=>s+x[1]*RATE,0);
 p.stageName=p.stage>=6?'Warranty':PH[p.stage];
});
const P=id=>projects.find(p=>p.id===id);
const day=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const dstr=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const team=[
 {r:'Principal (Daria)',cap:40,h:{CW:9,IC:6,FP:7,LS:5,RR:2,admin:12}},
 {r:'Project architect',cap:40,h:{CW:18,FP:16,RR:3,admin:2}},
 {r:'Designer',cap:40,h:{IC:14,LS:17,CW:6,admin:1}},
 {r:'Contract drafter',cap:24,h:{FP:15,CW:6}},
];
const permits=[
 {id:'PM-1',p:'FP',body:'City of Vancouver',item:'Building permit — respond to plan-review comments (round 2)',due:4,status:'Comments received'},
 {id:'PM-2',p:'LS',body:'City of Vancouver',item:'Multiplex pre-application enquiry',due:18,status:'Drafting'},
 {id:'PM-3',p:'CW',body:'District of Tofino',item:'Development permit — submission package',due:34,status:'Drafting'},
 {id:'PM-4',p:'IC',body:'City of Vancouver',item:'Site / public-realm review meeting',due:41,status:'Awaiting date'},
 {id:'PM-5',p:'RR',body:'City of Vancouver',item:'Occupancy — final inspection sign-off',due:-6,status:'Issued'},
 {id:'PM-6',p:'FP',body:'City of Vancouver',item:'Arborist report re-issue (tree protection)',due:9,status:'With consultant'},
];
const consultants=[
 {p:'NE',role:'Structural',firm:'Equilibrium Consulting',real:true},
 {p:'NE',role:'Prefabrication',firm:'BC Passive House',real:true},
 {p:'NE',role:'Contractor',firm:'Lincoln Construction',real:true},
 {p:'NE',role:'Energy advisor',firm:'Shape Energy',real:true},
 {p:'NE',role:'Windows + doors',firm:'Innotech Windows + Doors',real:true},
 {p:'FP',role:'Structural',firm:'Structural engineer (TBC)',real:false,ins:-3},
 {p:'FP',role:'Arborist',firm:'Arborist (TBC)',real:false,ins:120},
 {p:'FP',role:'General contractor',firm:'GC (TBC)',real:false,ins:200},
 {p:'CW',role:'Structural',firm:'Structural engineer (TBC)',real:false,ins:61},
 {p:'CW',role:'Mechanical / electrical',firm:'M+E engineer (TBC)',real:false,ins:12},
 {p:'IC',role:'Landscape',firm:'Landscape architect (TBC)',real:false,ins:180},
];
let rfis=[
 {id:'RFI-014',p:'FP',from:'GC (TBC)',q:'Stair 2 guard height at landing — confirm detail A5.03 vs code note',age:9,st:'open'},
 {id:'RFI-015',p:'FP',from:'Structural (TBC)',q:'Beam B4 bearing at party wall — revise or add post?',age:6,st:'open'},
 {id:'RFI-016',p:'RR',from:'Owner',q:'Deficiency list item 7 — exterior paint touch-up scope',age:3,st:'open'},
 {id:'RFI-012',p:'FP',from:'Arborist (TBC)',q:'Excavation limit near city tree — confirm footing offset',age:15,st:'answered'},
];
const decisions=[
 {p:'IC',what:'Concept option B — memorial wall material',asked:23,who:'ICP Society board',st:'waiting'},
 {p:'CW',what:'Storefront glazing extent — DD set',asked:6,who:'Nation administration',st:'waiting'},
 {p:'FP',what:'Exterior cladding colour (Unit 1–4)',asked:2,who:'Developer',st:'waiting'},
 {p:'LS',what:'Unit mix — 2×3-bed vs 3×2-bed',asked:11,who:'Developer',st:'waiting'},
 {p:'RR',what:'Landscape planting substitution',asked:30,who:'Vanway Properties',st:'approved'},
];
let invoices=[
 {id:'INV-1187',p:'FP',ph:'Permit / CDs · 70%',amt:9500,age:47,st:'sent'},
 {id:'INV-1192',p:'IC',ph:'Design dev. · 40%',amt:6200,age:33,st:'sent'},
 {id:'INV-1195',p:'CW',ph:'Design dev. · 60%',amt:10400,age:19,st:'sent'},
 {id:'INV-1196',p:'RR',ph:'Construction · final',amt:4400,age:12,st:'sent'},
 {id:'INV-1198',p:'LS',ph:'Schematic · 50%',amt:6000,age:4,st:'sent'},
 {id:'INV-1180',p:'NE',ph:'Construction · final',amt:3800,age:61,st:'paid'},
];
const inqMonths=['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
const inqCounts=[29,21,13,10,9,11,8,7,10,9,12,6];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TRUNC={};
function cut(key,rows,n){if(TRUNC[key]==='all'||rows.length<=n)return{rows,hidden:0};return{rows:rows.slice(0,n),hidden:rows.length-n}}
function moreBtn(key,h){return h?`<button class="moretog" onclick="TRUNC['${key}']='all';render()">Show ${h} more</button>`:''}
function hbars(rows,max){max=max||Math.max(...rows.map(r=>r.v),1);return rows.map(r=>`<div class="hb" ${r.click?`style="cursor:pointer" onclick="${r.click}"`:''}><div class="lbl" title="${esc(r.l)}">${esc(r.l)}${r.sub?`<div class="sub">${esc(r.sub)}</div>`:''}</div><div class="tr"><div class="fl" style="width:${Math.min(100,r.v/max*100)}%;background:${r.c||'var(--ink)'}"></div></div><div class="vv">${r.t||r.v}</div></div>`).join('')}
function diverge(rows){const m=Math.max(...rows.map(r=>Math.abs(r.v)),1);return rows.map(r=>{const w=Math.abs(r.v)/m*50;const left=r.v<0?50-w:50;return `<div class="dv" ${r.click?`style="cursor:pointer" onclick="${r.click}"`:''}><div class="lbl">${esc(r.l)}${r.sub?`<div class="sub">${esc(r.sub)}</div>`:''}</div><div class="tr"><div class="fl" style="left:${left}%;width:${w}%;background:${r.v<0?'var(--red)':'var(--moss)'}"></div></div><div class="num" style="color:${r.v<0?'var(--red)':'var(--moss)'}">${r.v<0?'−':'+'}${k(Math.abs(r.v))}</div></div>`}).join('')}
function cols(items){const m=Math.max(...items.map(i=>i.v),1);return `<div class="cols">${items.map(i=>`<div class="c"><div class="b" style="height:${i.v/m*88}%;background:${i.c||'var(--ink)'}"><i>${i.v}</i></div><div class="xl">${i.x}</div></div>`).join('')}</div>`}
function splitBar(segs){const t=segs.reduce((s,x)=>s+x.v,0)||1;return `<div class="sb">${segs.filter(s=>s.v).map(s=>`<div style="flex:${s.v/t};background:${s.c}" title="${s.l}"></div>`).join('')}</div><div class="legend">${segs.map(s=>`<span><i style="background:${s.c}"></i>${s.l} · ${s.t||s.v}</span>`).join('')}</div>`}
function meter(v,cap){const pct=v/cap*100;return `<div class="meter"><b style="width:${Math.min(100,pct)}%;background:${pct>100?'var(--red)':pct>90?'var(--amber)':'var(--moss)'}"></b>${pct>100?'<u style="left:100%"></u>':''}</div><div class="sub">${Math.round(pct)}%${pct>100?' — over by '+Math.round(pct-100)+'%':''}</div>`}
function dayBars(items,win){ // items with .due relative days; window 0..win
 const out=items.filter(i=>i.due<0||i.due>win);const inn=items.filter(i=>i.due>=0&&i.due<=win);
 const weeks=[];for(let w=0;w<Math.ceil(win/7);w++){const its=inn.filter(i=>Math.floor(i.due/7)===w);weeks.push({x:w===0?'This wk':'+'+w+' wk',v:its.length,c:w===0?'var(--red)':w===1?'var(--amber)':'var(--cedar)'})}
 return cols(weeks)+(out.length?`<div class="sub" style="margin-top:6px">Outside this ${win}-day window: ${out.map(o=>esc(o.label)).join(' · ')}</div>`:'')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}

 let body='';
 if(t==='spaces'){const lim=plState.limit;body=`<div class="split"><div class="card"><div class="hd"><b>Floor area by unit</b><span>traced from outlines</span></div><div class="bd">${hbars(PL.units.map(u=>({l:'Unit '+u,v:PL.unitArea(u),t:PL.unitArea(u).toLocaleString()+' sf',c:u==='C'||u==='D'?'var(--amber)':'var(--moss)'})))}</div></div>
  <div class="card"><div class="hd"><b>Total floor area vs your limit</b><span>enter the site's allowable area</span></div><div class="bd"><div style="font:500 22px var(--mono)">${PL.total.toLocaleString()} sf</div>${lim?meter(PL.total,lim):'<div class="sub">Set a limit to check headroom.</div>'}<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><input id="plim" type="number" placeholder="e.g. 5200" value="${lim||''}" style="width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:13px var(--mono)"><button class="btn ghost" onclick="plState.limit=+document.getElementById('plim').value||null;render()">Check</button></div><div class="sub" style="margin-top:6px">Gross vs net rules vary by zone. This compares the traced net area only.</div></div></div></div>
  <div class="card"><div class="hd"><b>Room schedule</b><span>Unit ${plState.unit}</span></div><div class="tabs" style="padding:10px 14px 0">${PL.units.map(u=>`<button class="tab ${plState.unit===u?'on':''}" onclick="plState.unit='${u}';render()">Unit ${u}</button>`).join('')}</div><div class="scroll"><table class="dt"><thead><tr><th>Room</th><th>Level</th><th class="num">Size</th><th class="num">Area</th></tr></thead><tbody>${PL.rooms.filter(r=>r.u===plState.unit).map(r=>`<tr><td>${esc(r.n)}</td><td>L${r.l}</td><td class="num">${r.w}′ × ${r.h}′</td><td class="num">${r.a} sf</td></tr>`).join('')}</tbody></table></div></div>`}
 if(t==='quantities'){const q=[['Net floor area',PL.total.toLocaleString()+' sf'],['Interior wall length',PL.wallLf.toLocaleString()+' lf'],['Doors',PL.doors+' pc'],['Windows',PL.windows+' pc'],['Bathrooms + powder',PL.baths],['Kitchens',PL.units.length]];
  body=`<div class="g3">${q.slice(0,3).map(([a,b])=>`<div class="stat"><div class="k">${a}</div><div class="v">${b}</div></div>`).join('')}</div><div class="g3">${q.slice(3).map(([a,b])=>`<div class="stat"><div class="k">${a}</div><div class="v">${b}</div></div>`).join('')}</div>
  <div class="card"><div class="hd"><b>Area by room type</b><span>all units</span></div><div class="bd">${splitBar([['living','Living + kitchen','var(--cedar)'],['bed','Bedrooms','var(--moss)'],['bath','Baths','#8FA4AE'],['circ','Circulation + storage','#C9C3B8']].map(([ty,l,c])=>{const v=PL.rooms.filter(r=>r.t===ty).reduce((s,r)=>s+r.a,0);return{l,v,t:v.toLocaleString()+' sf',c}}))}</div></div>`}
 if(t==='estimate'){const lines=PL.rates.map(([n,u,q,r])=>({n,u,q:Math.round(q()),r,tot:Math.round(q())*r}));const tot=lines.reduce((s,l)=>s+l.tot,0);
  body=`<div class="split"><div class="card"><div class="hd"><b>Order-of-magnitude estimate</b><span>${k(tot)} · from your rate catalogue</span></div><div class="bd">${hbars(lines.sort((a,b)=>b.tot-a.tot).map(l=>({l:l.n,v:l.tot,t:k(l.tot),c:'var(--cedar)'})))}</div></div>
  <div class="card"><div class="hd"><b>Not priced from this set</b><span>and why</span></div><div class="bd">${PL.cantQ.map(([a,b])=>`<div style="margin:6px 0"><b>${a}</b><div class="sub">${b}</div></div>`).join('')}</div></div></div>
  <div class="card"><div class="scroll"><table class="dt"><thead><tr><th>Line</th><th class="num">Qty</th><th>Unit</th><th class="num">Rate</th><th class="num">Total</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${l.n}</td><td class="num">${l.q.toLocaleString()}</td><td>${l.u}</td><td class="num">${fmt(l.r)}</td><td class="num">${fmt(l.tot)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="note">Rates are placeholders. The studio keeps its own catalogue, and quantities update each time a new revision is read.</div>`}
 if(t==='review')body=`<div class="card"><div class="hd"><b>What the reader caught</b><span>fix these before the City does</span></div>${PL.flags.map(f=>`<div class="q"><div class="dot" style="background:var(--${f.sev})"></div><div class="t"><b>${f.t}</b><div class="sub">${f.d}</div></div><div class="a"><span class="pill">${f.sh}</span></div></div>`).join('')}</div>`;
 if(t==='compare')body=`<div class="card"><div class="hd"><b>What changed since Rev 2</b><span>area in sf · counts in pieces</span></div><div class="bd">${PL.diff.map(d=>`<div class="dv"><div class="lbl">${d.l}</div><div class="tr">${d.v?`<div class="fl" style="left:${d.v<0?50-Math.abs(d.v)/42*45:50}%;width:${Math.abs(d.v)/42*45}%;background:${d.v<0?'var(--red)':'var(--moss)'}"></div>`:''}</div><div class="num">${d.v>0?'+':d.v<0?'−':''}${Math.abs(d.v)}${d.u?' '+d.u:' sf'}</div></div>`).join('')}</div></div>
  <div class="card"><div class="bd sub" style="font-size:13px">Rev 3 swapped Bedroom 3 for a Den in Units C + D and added two doors and four windows. Every change is linked to its sheet, so the permit response letter writes itself.</div></div>`;
 if(t==='sheets')body=`<div class="card"><div class="scroll"><table class="dt"><thead><tr><th>Sheet</th><th>Title</th><th>Rev</th><th>Flags</th></tr></thead><tbody>${PL.sheets.map(([n,ti,r])=>{const f=PL.flags.filter(x=>x.sh===n).length;return `<tr><td class="num" style="text-align:left">${n}</td><td>${ti}</td><td>${r}</td><td>${f?`<span class="pill amber">${f}</span>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;
 if(t==='viewer')body=`<div class="card"><div class="hd"><b>Traced plan · Unit ${plState.unit} · Level ${plState.level}</b><span>tap a room</span></div><div class="tabs" style="padding:10px 14px 0">${PL.units.map(u=>`<button class="tab ${plState.unit===u?'on':''}" onclick="plState.unit='${u}';render()">Unit ${u}</button>`).join('')}${[1,2].map(l=>`<button class="tab ${plState.level===l?'on':''}" onclick="plState.level=${l};render()">Level ${l}</button>`).join('')}</div><div class="bd">${plSvg()}</div></div>`;
 return head+body+`<div class="note">The plan set, rooms and quantities are illustrative. Upload one of the studio's real sets and the reader fills this in from it.</div>`};

// ---------- INSPECTOR ----------
function openProj(id){const p=P(id);$('#ihead').innerHTML=`<div class="crumb">${p.type}</div><b style="font-size:17px">${p.name}</b>${tag(p.real)}<div class="sub">${esc(p.loc)} · ${esc(p.client)}</div>`;
 $('#ibody').innerHTML=`<dl class="kv"><dt>Stage</dt><dd>${p.stageName}</dd><dt>Started</dt><dd>${p.started}</dd><dt>Total fee</dt><dd>${fmt(p.fee)}</dd><dt>Earned / spent</dt><dd>${fmt(p.earned)} / ${fmt(p.spent)}</dd></dl>
 <div class="note">${esc(p.note)}</div>
 <b>Fee by phase</b>${p.phases.map((ph,i)=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${PH[i]} · ${Math.round(ph[2]*100)}% done</span><span class="num">${k(ph[0])}</span></div>${ph[1]?meter(ph[1]*RATE,ph[0]):'<div class="sub">not started</div>'}</div>`).join('')}
 ${(()=>{const c=consultants.filter(c=>c.p===id);return c.length?`<b style="display:block;margin-top:14px">Team</b>`+c.map(c=>`<div class="sub" style="margin:4px 0">${c.role} — ${esc(c.firm)}</div>`).join(''):''})()}
 ${(()=>{const r=rfis.filter(r=>r.p===id&&r.st==='open');return r.length?`<b style="display:block;margin-top:14px">Open RFIs</b>`+r.map(r=>`<div class="sub" style="margin:4px 0">${r.id} · ${r.age}d — ${esc(r.q)}</div>`).join(''):''})()}
 ${(()=>{const d=decisions.filter(d=>d.p===id&&d.st==='waiting');return d.length?`<b style="display:block;margin-top:14px">Waiting on client</b>`+d.map(d=>`<div class="sub" style="margin:4px 0">${esc(d.what)} · ${d.asked}d</div>`).join(''):''})()}`;
 $('#insp').classList.add('open')}
$('#inspclose').onclick=()=>$('#insp').classList.remove('open');
// ---------- ACTIONS ----------
function answerRfi(id){rfis.find(r=>r.id===id).st='answered';toast(id+' marked answered. The contractor is notified');render()}
function awardStart(id){const a=awards.find(x=>x.id===id);if(a.st==='drafting'){a.st='entered';toast('Marked as entered')}else{a.st='drafting';toast('Entry started · reminder set before the deadline')}render()}
function pitch(id){const m=media.find(x=>x.id===id);m.last=0;toast('Pitch drafted for '+m.out+' · ready for your edits')}
function approvePost(id){const d=drafts.find(x=>x.id===id);d.st='approved';toast('Approved · scheduled for the next open slot');render()}
function clientApprove(id){const x=sels.find(y=>y.id===id);x.st='approved';toast('Client approved '+x.what);render()}
function addToProj(id){const l=lib.find(x=>x.id===id);toast(l.item+' added to East 33rd Fourplex selections')}
function fbHTML(id,label){const f=FB[id]||{};return `<div class="fb"><div class="q">Your feedback on “${esc(label)}”</div><div class="opts">${['Essential','Nice to have','Not needed'].map(o=>`<button class="opt ${f.r===o?'on':''}" onclick="rate('${id}','${o}')">${o}</button>`).join('')}</div><textarea placeholder="What's missing, or what would make this more useful?" oninput="note('${id}',this.value)">${f.n?esc(f.n):''}</textarea><div class="saved"><span class="syncst" data-s="${syncState}">${syncLabel()}</span> · see all on <a href="#feedback" onclick="go('feedback');return false">Your feedback</a></div></div>`}
function rate(id,o){FB[id]=FB[id]||{};FB[id].r=FB[id].r===o?null:o;saveFB();render()}
function note(id,v){FB[id]=FB[id]||{};FB[id].n=v;saveFB()}
function fbText(){let t='Studio OS: feedback from Daria\n';NAV.filter(([g])=>PHASES[g]).forEach(([g,i])=>{t+='\n'+g+'\n';i.forEach(([id,l])=>{const f=FB[id]||{};t+='- '+l+': '+(f.r||'not rated')+(f.n?' — '+f.n:'')+'\n'})});return t}
function copyFB(){const t=fbText();const out=document.getElementById('fbout');try{navigator.clipboard.writeText(t).then(()=>toast('Copied · paste it into an email'),()=>{out.style.display='block';out.value=t;out.select();toast('Select all and copy')})}catch(e){out.style.display='block';out.value=t;out.select();toast('Select all and copy')}}
let _clr=0;function confirmClear(){if(Date.now()-_clr<3000){FB={};saveFB();toast('Feedback cleared');return true}_clr=Date.now();toast('Press Clear again to confirm');return false}
function doneDeal(id){const d=deals.find(x=>x.id===id);d.due=7;d.next='Next touchpoint';toast('Marked done · next follow-up in 7 days');render()}
function addOpp(id){const o=opps.find(x=>x.id===id);o.st='added';deals.push({id:'D-'+(deals.length+1),who:o.who+', '+o.where,what:o.what,stage:'Conversation',fee:70000,prob:.15,next:'Intro email',due:2});toast('Added to pipeline with an intro email to draft');render()}
function checkIn(id){const n=net.find(x=>x.id===id);n.last=0;toast('Check-in logged for '+n.who);render()}
function replyInq(id){const i=inquiries.find(x=>x.id===id);i.st='replied';toast('Reply sent to '+i.who+' from your template');render()}
function chase(id){invoices.find(x=>x.id===id).st='reminded';toast('Reminder sent for '+id);render()}
// ---------- SHELL ----------
function navHTML(){const q=needs().length;return NAV.map(([g,items])=>`<div class="navgrp">${g}</div>`+items.map(([id,l])=>`<button class="navbtn ${cur===id?'on':''}" onclick="go('${id}')"><span>${l}</span>${id==='today'&&q?`<span class="badge">${q}</span>`:''}</button>`).join('')).join('')}
function go(id){cur=id;TRUNC={};history.replaceState(null,'','#'+id);$('#nav').classList.remove('open');document.body.style.overflow='';$('#insp').classList.remove('open');render();window.scrollTo(0,0)}
function render(){const label=NAV.flatMap(([g,i])=>i.map(x=>[g,...x])).find(x=>x[1]===cur)||['Start','welcome','Welcome'];$('#crumb').textContent=label[0];$('#title').textContent=label[2];const ph=PHASES[label[0]];$('#view').innerHTML=(ph?`<div class="phasebar"><b>${label[0]}</b><span>${label[2]}</span><span class="when">${ph.when}</span></div>`:'')+V[cur]()+(ph?fbHTML(cur,label[2]):'');$('#nav').innerHTML=navHTML()}
$('#burger').onclick=()=>{const n=$('#nav');n.classList.toggle('open');document.body.style.overflow=n.classList.contains('open')?'hidden':''};
if(!V[cur])cur='welcome';
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==cur){cur=h;TRUNC={};render()}});
render();
</script>
</body>
</html>
