<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mosaic Avenue Construction — Tender OS</title>
<meta name="description" content="A working demonstration of the two-agent tendering workflow:
invite, chase, level, recommend — with every decision still made by a person.">
<style>/* ── Mosaic Avenue Construction · brand tokens ─────────────────── */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  --ink:#141B45;        /* deep navy — rail, headings */
  --navy:#1E2761;       /* primary action */
  --pale:#CADCFC;       /* pale blue — chart fill */
  --palebg:#EEF3FD;
  --paleline:#D5E0F5;
  --gold:#C97B1E;       /* Mosaic ochre — accent, human steps */
  --teal:#14504D;       /* agent steps */
  --bg:#F5F7FB;
  --paper:#FFFFFF;
  --line:#E2E7F1;
  --line2:#EDF0F7;
  --hov:#F7F9FD;
  --mut:#7B84A0;
  --mut2:#4B5474;
  --red:#B4402C;
  --amber:#E0A33C;
  --amberd:#8A5A10;
  --green:#1E7A57;
}

/* ── Mosaic tender OS · base layer ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.5;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
table{border-collapse:collapse;width:100%}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--navy)}
::selection{background:var(--pale);color:var(--ink)}

/* ── shell ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.side{background:var(--ink);color:#E7EAF4;display:flex;flex-direction:column;min-height:0}
.brandbar{padding:16px 16px 13px;border-bottom:1px solid rgba(255,255,255,.09);flex:none}
.logo{display:flex;align-items:center;gap:9px}
.logomark{width:26px;height:26px;flex:none}
.logotext{font-family:var(--display);font-size:14.5px;font-weight:600;letter-spacing:.005em;color:#fff;line-height:1.15}
.logosub{font-size:10.5px;color:#8C96B8;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.railscroll{flex:1 1 auto;overflow-y:auto;padding:9px 9px 4px;min-height:0;scrollbar-width:thin}
.railscroll::-webkit-scrollbar{width:6px}
.railscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.navgrp{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#727CA0;
  padding:12px 8px 5px;font-weight:600}
.navgrp:first-child{padding-top:3px}
.nb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;
  border-radius:7px;color:#C3CADF;font-size:13px;position:relative;transition:background .12s,color .12s}
.nb:hover{background:rgba(255,255,255,.06);color:#fff}
.nb.on{background:var(--navy);color:#fff;font-weight:500}
.nb.on::before{content:'';position:absolute;left:-9px;top:6px;bottom:6px;width:3px;
  background:var(--gold);border-radius:0 2px 2px 0}
.nb .ni{width:15px;height:15px;flex:none;opacity:.85}
.nb.on .ni{opacity:1}
.nb .nct{margin-left:auto;font-size:10.5px;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.12);padding:1px 5px;border-radius:9px;color:#DDE3F2}
.nb .nct.hot{background:var(--red);color:#fff}
.railfoot{flex:none;padding:9px;border-top:1px solid rgba(255,255,255,.09)}
.who{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;font-size:12px}
.who:hover{background:rgba(255,255,255,.06)}
.av{width:25px;height:25px;border-radius:50%;background:var(--gold);color:#2A1B05;flex:none;
  display:grid;place-items:center;font-size:10.5px;font-weight:700}
.whon{color:#fff;font-size:12.5px;line-height:1.25}
.whor{color:#8C96B8;font-size:10.5px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{flex:none;background:var(--paper);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:14px}
.topt{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.015em}
.topc{font-size:11.5px;color:var(--mut);margin-top:1px}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.pjsel{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:12.5px}
.pjsel .tok{font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;
  padding:1.5px 5px;border-radius:4px;letter-spacing:.01em}
.pjsel select{border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;outline:none;max-width:190px}
.ibtn{width:31px;height:31px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  display:grid;place-items:center;color:var(--mut)}
.ibtn:hover{background:var(--bg);color:var(--ink)}

.wrap{flex:1 1 auto;overflow-y:auto;min-height:0}
.wbody{padding:16px 22px 26px;max-width:1360px}

/* ── context bar ───────────────────────────────────────────────── */
.ctxbar{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;margin-bottom:13px;scrollbar-width:none}
.ctxbar::-webkit-scrollbar{display:none}
.inst{flex:1 1 0;min-width:158px;background:var(--paper);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px}
.inst .il{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600}
.inst .iv{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.02em;
  margin-top:4px;line-height:1;font-variant-numeric:tabular-nums}
.inst .is{font-size:11.5px;color:var(--mut);margin-top:5px;line-height:1.35}
.inst.warn .iv{color:var(--amberd)} .inst.bad .iv{color:var(--red)} .inst.good .iv{color:var(--green)}

/* ── cards ─────────────────────────────────────────────────────── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  margin-bottom:12px;overflow:hidden}
.wbody>.card:last-child{margin-bottom:0}
.hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.hd h3{font-size:13.5px;font-weight:600}
.hd .sub{font-size:11.5px;color:var(--mut)}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:7px}
.bd{padding:13px 14px}
.bd.tight{padding:0}
.lede{font-size:13.5px;color:var(--mut2);line-height:1.55;margin-bottom:13px;max-width:78ch}
.lede b{color:var(--ink);font-weight:600}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split64{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;align-items:start}
.split46{display:grid;grid-template-columns:1fr 1.55fr;gap:12px;align-items:start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.grid>*,.split>*,.split64>*,.split46>*{min-width:0}

/* ── tables ────────────────────────────────────────────────────── */
.scroll{overflow-x:auto;scrollbar-width:thin}
table.dt{font-size:13px;min-width:560px}
table.dt th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);font-weight:600;padding:8px 11px;border-bottom:1px solid var(--line);
  background:var(--bg);white-space:nowrap;position:sticky;top:0;z-index:2}
table.dt td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr.clik{cursor:pointer}
table.dt tbody tr.clik:hover{background:var(--hov)}
table.dt tbody tr.sel{background:var(--palebg)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.mono{font-family:var(--mono);font-size:11.5px}
.tname{font-weight:500}
.tsub{font-size:11px;color:var(--mut);margin-top:1px}
.moretog{display:block;width:100%;padding:9px;font-size:12px;color:var(--navy);
  background:var(--bg);border-top:1px solid var(--line);font-weight:500}
.moretog:hover{background:var(--palebg)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:12.5px}

/* ── chips / badges ────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:20px;white-space:nowrap;line-height:1.5}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.t-grey{background:#EDEFF4;color:#5A6076} .t-blue{background:#E4EAF7;color:#2E3A73}
.t-green{background:#DCEFE6;color:#166B4C} .t-amber{background:#FBEDD6;color:#8A5A10}
.t-red{background:#FBE4E1;color:#A32E1E} .t-teal{background:#DCEBEA;color:#14504D}
.t-gold{background:#F7E9D2;color:#6B4A15} .t-plum{background:#EFE4F0;color:#66346B}

.tabbar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);margin-bottom:14px}
.tabbar::-webkit-scrollbar{display:none}
.tb{padding:8px 13px;font-size:13px;color:var(--mut);white-space:nowrap;flex:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tb .tbn{font-size:10.5px;color:var(--mut);margin-left:5px;font-variant-numeric:tabular-nums}

.pills{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:4px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;
  color:var(--mut2);background:var(--paper);white-space:nowrap;flex:none}
.pill:hover{border-color:var(--mut)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;
  font-size:12.5px;font-weight:600;background:var(--navy);color:#fff;white-space:nowrap}
.btn:hover{background:var(--ink)}
.btn.gh{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.gh:hover{background:var(--bg)}
.btn.gold{background:var(--gold);color:#2A1B05}
.btn.gold:hover{filter:brightness(.94)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── human-in-the-loop marker ──────────────────────────────────── */
.hstep{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:#6B4A15;background:#F7E9D2;
  border:1px solid #E4CDA6;padding:2px 7px;border-radius:5px;white-space:nowrap}
.astep{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:#14504D;background:#DCEBEA;
  border:1px solid #B9D5D3;padding:2px 7px;border-radius:5px;white-space:nowrap}

/* ── notes / callouts ──────────────────────────────────────────── */
.note{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55;
  background:var(--palebg);border:1px solid var(--paleline);color:var(--mut2)}
.note b{color:var(--ink)}
.note.gold{background:#FDF6EA;border-color:#EAD9BC}
.note.red{background:#FDEDEA;border-color:#F2CFC8}
.note.teal{background:#E9F3F2;border-color:#C6DEDC}
.notet{font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);margin-bottom:5px}

/* ── key-value ─────────────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--mut);white-space:nowrap}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:500}

/* ── charts ────────────────────────────────────────────────────── */
.chart{position:relative}
.daybars{display:flex;align-items:flex-end;gap:3px;height:104px;padding-top:15px}
.daybars .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:3px;height:100%;position:relative}
.daybars .bar{width:100%;border-radius:3px 3px 0 0;background:var(--pale);min-height:2px;transition:height .3s}
.daybars .bar.hot{background:var(--red)} .daybars .bar.warm{background:var(--amber)}
.daybars .bar.ok{background:var(--navy)} .daybars .bar.dim{background:#D7DCE8}
.daybars .cv{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums;position:absolute;
  top:0;left:0;right:0;text-align:center}
.daybars .cl{font-size:9.5px;color:var(--mut);white-space:nowrap}
.axl{display:flex;gap:3px;margin-top:5px}
.axl>span{flex:1 1 0;min-width:0;text-align:center;font-size:9.5px;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hbars{display:flex;flex-direction:column;gap:9px}
.hbrow{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbrow .hl{min-width:0;overflow:hidden}
.hbrow .hl .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hbrow .hl .hs{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtrack{background:var(--bg);border-radius:5px;height:19px;position:relative;overflow:hidden}
.hbfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--navy);transition:width .35s}
.hbfill.gold{background:var(--gold)} .hbfill.red{background:var(--red)}
.hbfill.green{background:var(--green)} .hbfill.teal{background:var(--teal)}
.hbfill.pale{background:var(--pale)}
.hbv{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.sbar{display:flex;height:24px;border-radius:6px;overflow:hidden;gap:2px;background:transparent}
.sbar>span{min-width:3px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;transition:flex-basis .35s}
.slegend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:11.5px;color:var(--mut2)}
.slegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}

.pipe{display:flex;gap:5px;align-items:stretch}
.pstage{flex:1 1 0;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;position:relative}
.pstage.done{background:#F0F6F3;border-color:#CFE4DA}
.pstage.now{background:var(--palebg);border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.pstage .pn{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.pstage .pv{font-family:var(--display);font-size:19px;font-weight:600;margin-top:3px;line-height:1}
.pstage .ps{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.3}

.meter{height:9px;border-radius:5px;background:var(--bg);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--navy)}
.meter i.over{background:var(--red)}
.mrk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* ── matrix ────────────────────────────────────────────────────── */
table.mx{font-size:12.5px;min-width:760px}
table.mx th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);
  background:var(--bg);position:sticky;top:0;z-index:2}
table.mx th.b{text-align:center;min-width:112px}
table.mx td{padding:0;border-bottom:1px solid var(--line2)}
table.mx td.sc{padding:8px 11px;vertical-align:top}
table.mx td.c{text-align:center;vertical-align:middle;padding:6px 5px}
table.mx tbody tr:hover{background:var(--hov)}
table.mx tbody tr.gaprow{background:#FDEDEA}
table.mx tbody tr.gaprow:hover{background:#FBE4E1}
.mcell{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;
  font-size:11px;font-weight:700;font-family:var(--mono)}
.m-in{background:#DCEFE6;color:#166B4C} .m-ex{background:#FBEDD6;color:#8A5A10}
.m-na{background:#FBE4E1;color:#A32E1E} .m-al{background:#E4EAF7;color:#2E3A73}
.scit{font-weight:500;line-height:1.35}
.scref{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:2px}
.stkc{position:sticky;left:0;background:var(--paper);z-index:1}
table.mx tbody tr:hover .stkc{background:var(--hov)}
table.mx tbody tr.gaprow .stkc{background:#FDEDEA}
th.stkc{background:var(--bg);z-index:3}

/* ── inbox / thread ────────────────────────────────────────────── */
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.mailh{padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.msubj{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:600}
.mailb{padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--mut2)}
.mailb p{margin:0 0 9px} .mailb p:last-child{margin-bottom:0}
.mailb .sig{color:var(--mut);font-size:11.5px}
.mailf{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;background:var(--bg)}
.attach{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut2);
  background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 8px}

.tl{position:relative;padding-left:19px}
.tl::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:13px}
.tli:last-child{padding-bottom:0}
.tli::before{content:'';position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--paper);border:2px solid var(--pale)}
.tli.a::before{border-color:var(--teal)} .tli.h::before{border-color:var(--gold)}
.tli.r::before{border-color:var(--red)}
.tlt{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tld{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.tlw{font-size:10.5px;color:var(--mut);font-family:var(--mono)}

/* ── inspector drawer ──────────────────────────────────────────── */
.insp{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--paper);
  border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(20,27,69,.13);z-index:70;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.insp.open{transform:translateX(0)}
.insph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;flex:none}
.insph h4{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.25}
.insph .isub{font-size:11.5px;color:var(--mut);margin-top:3px}
#inspclose{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--mut);flex:none}
#inspclose:hover{background:var(--bg);color:var(--ink)}
.inspb{flex:1 1 auto;overflow-y:auto;padding:13px 14px;min-height:0}
.inspb .card{box-shadow:none}
.scrim{position:fixed;inset:0;background:rgba(20,27,69,.24);z-index:69;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}

/* ── tour ──────────────────────────────────────────────────────── */
.tourbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:#fff;border-radius:13px;padding:12px 15px;width:min(560px,calc(100vw - 26px));
  box-shadow:0 14px 42px rgba(20,27,69,.34);display:none}
.tourbar.on{display:block}
.tourn{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.tourt{font-size:14px;font-weight:600;margin-top:4px;line-height:1.35}
.tourd{font-size:12.5px;color:#BFC7DE;margin-top:5px;line-height:1.5}
.tourf{display:flex;align-items:center;gap:8px;margin-top:11px}
.tourp{flex:1 1 auto;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.tourp i{display:block;height:100%;background:var(--gold);transition:width .25s}
.tbtn{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.12);color:#fff}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn.pri{background:var(--gold);color:#2A1B05}
.tbtn.pri:hover{filter:brightness(.94)}
.spot{position:fixed;border-radius:11px;box-shadow:0 0 0 3px var(--gold),0 0 0 9999px rgba(20,27,69,.42);
  z-index:88;pointer-events:none;transition:all .25s ease;display:none}
.spot.on{display:block}

/* ── misc ──────────────────────────────────────────────────────── */
.rowflex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.hint{font-size:11.5px;color:var(--mut);line-height:1.45}
.dband{background:var(--ink);color:#C3CADF;font-size:11.5px;padding:7px 22px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:none}
.dband b{color:#fff;font-weight:600}
.dband .btn{margin-left:auto}
.nav-toggle{display:none}

/* ── closing timeline ──────────────────────────────────────────── */
.gantt{display:flex;flex-direction:column;gap:9px}
.gr{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;align-items:center;font-size:12.5px}
.gr .gl{min-width:0}
.gr .gl .hn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gl .hs{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;height:22px;background:var(--bg);border-radius:5px;overflow:hidden}
.gt{position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:0}
.gbar{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--navy);
  transition:width .35s;z-index:1}
.gbar.hot{background:var(--red)} .gbar.warm{background:var(--amber)} .gbar.ok{background:var(--navy)}
.gcap{position:absolute;top:50%;transform:translate(7px,-50%);font-size:10.5px;
  font-family:var(--mono);color:var(--mut2);white-space:nowrap;z-index:2}
.gaxis{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;margin-top:3px}
.gaxis .gtrack{background:none;height:14px;overflow:visible}
.gx{position:absolute;top:0;font-size:9.5px;color:var(--mut);transform:translateX(-2px);white-space:nowrap}
.bd.wideL .hbrow{grid-template-columns:minmax(150px,240px) 1fr auto}
.pjsel .tok{white-space:nowrap}
table.mx td.sc{padding:7px 11px}

/* ── responsive layer · injected LAST ──────────────────────────── */
@media (max-width:1180px){
  .app{grid-template-columns:206px 1fr}
  .split64,.split46{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}
  .side{flex-direction:row;align-items:center;padding:0 12px;height:52px;
    background:var(--ink);backdrop-filter:none;position:sticky;top:0;z-index:80;overflow:visible}
  .brandbar{border:0;padding:0;flex:1 1 auto;min-width:0}
  .logosub{display:none}
  .railscroll{position:fixed;left:0;right:0;top:52px;bottom:0;background:var(--ink);
    padding:12px;overflow-y:auto;display:none;z-index:79}
  .railscroll.open{display:block}
  .railfoot{border:0;padding:0;flex:none;order:3}
  .who{padding:3px} .whon,.whor{display:none}
  .nav-toggle{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;
    color:#fff;order:2;flex:none;background:rgba(255,255,255,.1)}
  .top{padding:9px 14px;flex-wrap:wrap;gap:9px}
  .topr{width:100%;margin-left:0}
  .pjsel{flex:1 1 auto} .pjsel select{max-width:none;width:100%}
  .wbody{padding:13px 14px 22px}
  .grid.g3,.grid.g2,.split{grid-template-columns:1fr}
  .insp{top:52px;width:100%;max-width:none}
  .dband{padding:7px 14px}
  .pipe{overflow-x:auto;scrollbar-width:none} .pstage{min-width:118px;flex:none}
}
@media (max-width:1000px){
  .hd{flex-wrap:wrap}
  .hd .rt{flex-wrap:wrap;margin-left:0;width:100%}
  .hd .rt:first-child{width:auto}
  .btn{white-space:normal;text-align:left}
}
@media (max-width:640px){
  .inst{min-width:142px;padding:9px 11px}
  .inst .iv{font-size:20px}
  .g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}
  .g3>*:nth-child(3):last-child,.g5>*:nth-child(5):last-child{grid-column:1/-1}
  .hbrow,.bd.wideL .hbrow{grid-template-columns:minmax(86px,124px) 1fr auto;font-size:12px}
  .gr,.gaxis{grid-template-columns:minmax(86px,124px) 1fr;gap:9px}
  .gcap{display:none}
  .top{padding:8px 12px} .topt{font-size:15.5px}
  .wbody{padding:12px 12px 20px}
  .tourbar{bottom:10px;padding:11px 13px}
  .card{border-radius:10px}
  table.dt{font-size:12.5px}
  table.dt th{padding:7px 9px} table.dt td{padding:8px 9px}
  .scroll table.dt th:first-child,.scroll table.dt td:first-child{position:sticky;left:0;
    background:var(--paper);z-index:1}
  .scroll table.dt th:first-child{background:var(--bg);z-index:3}
  .scroll table.dt th:first-child::after,.scroll table.dt td:first-child::after{
    content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--line)}
  table.dt tbody tr.sel td:first-child{background:var(--palebg)}
}

/* dayBars: one column per day across a window. Items outside the window
   are counted and named, never clamped into the edge column.          */
function dayBars(items, opts){
  opts=opts||{};
  var from=opts.from!=null?opts.from:-2, to=opts.to!=null?opts.to:12;
  var cols=[],i;
  for(i=from;i<=to;i++) cols.push({d:i,n:0,items:[]});
  var out=[];
  items.forEach(function(it){
    var k=it.d-from;
    if(it.d<from||it.d>to){out.push(it);return;}
    cols[k].n++; cols[k].items.push(it);});
  var max=Math.max(1,Math.max.apply(null,cols.map(function(c){return c.n;})));
  var h='<div class="daybars">';
  cols.forEach(function(c){
    var cls=c.d<0?'dim':(c.d<=1?'hot':(c.d<=3?'warm':'ok'));
    var pct=c.n?Math.max(8,Math.round(c.n/max*100)):0;
    h+='<div class="col" title="'+esc(c.items.map(function(x){return x.label;}).join(', ')||'nothing')+'">'+
       (c.n?'<span class="cv">'+c.n+'</span>':'')+
       '<div class="bar '+cls+'" style="height:'+pct+'%"></div></div>';});
  h+='</div><div class="axl">';
  cols.forEach(function(c){
    var lbl = c.d===0?'today':(c.d<0? c.d+'d' : '+'+c.d);
    h+='<span>'+(Math.abs(c.d)%2===0||c.d===0?lbl:'')+'</span>';});
  h+='</div>';
  if(out.length) h+='<div class="hint" style="margin-top:7px">Outside this window: '+
    out.length+' — '+esc(out.map(function(x){return x.label;}).join(', '))+'</div>';
  return h;}

function gantt(rows,span){
  span=span||Math.max(7,Math.max.apply(null,rows.map(function(r){return r.d;}))+1);
  var ticks=[0,7,14,21,28].filter(function(t){return t<=span;});
  var h='<div class="gantt">';
  rows.forEach(function(r){
    var pct=Math.max(2.5,Math.min(100,r.d/span*100));
    var cls=r.d<=1?'hot':(r.d<=3?'warm':'ok');
    h+='<div class="gr"'+(r.key?' data-insp="'+esc(r.key)+'" style="cursor:pointer"':'')+'>'+

function stackBars(rows,max){
  max=max||Math.max.apply(null,rows.map(function(r){return r.a+r.b;}));
  var h='<div class="hbars">';
  rows.forEach(function(r){
    h+='<div class="hbrow"'+(r.key?' data-insp="'+esc(r.key)+'" style="cursor:pointer"':'')+'>'+
      '<div class="hl"><div class="hn">'+esc(r.n)+'</div>'+
      (r.s?'<div class="hs">'+esc(r.s)+'</div>':'')+'</div>'+
      '<div class="hbtrack"><i class="hbfill '+(r.c||'')+'" style="width:'+(r.a/max*100)+'%"></i>'+
      (r.b?'<i class="hbfill red" style="left:'+(r.a/max*100)+'%;width:'+(r.b/max*100)+'%;'+
        'border-radius:0 5px 5px 0" title="added back"></i>':'')+'</div>'+
      '<span class="hbv">'+esc(r.lbl)+'</span></div>';});
  return h+'</div>';}

function splitBar(segs){
  var tot=segs.reduce(function(a,s){return a+s.n;},0)||1;
  var h='<div class="sbar">';
  segs.forEach(function(s){ if(!s.n) return;
    h+='<span style="flex:0 0 '+(s.n/tot*100)+'%;background:'+s.c+
       '" title="'+esc(s.l+': '+s.n)+'">'+(s.n/tot>0.07?s.n:'')+'</span>';});
  h+='</div><div class="slegend">';
  segs.forEach(function(s){ h+='<span><i style="background:'+s.c+'"></i>'+esc(s.l)+' · '+s.n+'</span>';});
  return h+'</div>';}

function hbars(rows,opts){
  opts=opts||{};
  var max=opts.max||Math.max.apply(null,rows.map(function(r){return Math.abs(r.v);}))||1;
  var h='<div class="hbars">';
  rows.forEach(function(r){
    h+='<div class="hbrow"'+(r.key?' data-insp="'+esc(r.key)+'" style="cursor:pointer"':'')+'>'+
       '<div class="hl"><div class="hn">'+esc(r.n)+'</div>'+
       (r.s?'<div class="hs">'+esc(r.s)+'</div>':'')+'</div>'+
       '<div class="hbtrack"><i class="hbfill '+(r.c||'')+'" style="width:'+
       Math.max(1.5,Math.abs(r.v)/max*100)+'%"></i></div>'+
       '<span class="hbv">'+esc(r.lbl)+'</span></div>';});
  return h+'</div>';}

function pipeline(stages){
  var h='<div class="pipe">';
  stages.forEach(function(s){
    h+='<div class="pstage '+(s.cls||'')+'"><div class="pn">'+esc(s.n)+'</div>'+

    Math.min(100,pct)+'%"></i>'+(over?'<span class="mrk" style="left:100%"></span>':'')+'</div>';}

var KINDTAG={chase:['Follow-up','blue'],invite:['Invitation','teal'],

          esc(o.firms.slice(0,3).join(', '))+(o.firms.length>3?' +'+(o.firms.length-3)+' more':'')

/* ═══ 4 · CHASE & ESCALATION ══════════════════════════════════════ */
CRUMB.chase=function(){return 'the cadence is '+cadenceText()+' before close, '+
  'the same on every package, every project';};

SC.chase=function(){
  var ps=pkgs().filter(function(p){return p.status!=='awarded';});
  var rows=[];
  ps.forEach(function(p){ p.bidders.forEach(function(b){
    var sent=b.touches.filter(function(t){return t.kind==='chase';}).length;
    var esc_=b.touches.filter(function(t){return t.kind==='escalate';}).length;
    rows.push({p:p,b:b,sent:sent,esc:esc_});});});
  var chased=rows.reduce(function(a,r){return a+r.sent;},0);
  var quiet=rows.filter(function(r){return r.b.state==='silent'||r.b.state==='invited';});
  var escd=rows.filter(function(r){return r.esc;});
  var h='';

  h+='<div class="ctxbar">'+
    inst('Follow-ups sent', chased, 'across '+ps.length+' '+plural(ps.length,'package')+
         ' — none of them remembered by a person')+
    inst('Still quiet', quiet.length, 'invited, no reply of any kind', quiet.length?'warn':'good')+
    inst('Escalated to you', escd.length, 'two follow-ups, no answer — handed over',
         escd.length?'bad':'')+
    inst('Closed off by the agent', '0', 'and it never will be — silence is yours to judge','good')+
  '</div>';

  /* cadence visual for the nearest closing package */
  var near=ps.filter(function(p){return p.dleft>=0;}).sort(function(a,b){return a.dleft-b.dleft;})[0];
  if(near){
    var st=D.cadence.map(function(n){
      var done=near.dleft<n;
      return {n:n+' '+plural(n,'day')+' out', v:done?'sent':(near.dleft===n?'today':'queued'),
        s:fdate(new Date(dt(near.close)-n*864e5).toISOString().slice(0,10)),
        cls:done?'done':(near.dleft===n?'now':'')};});
    h+='<div class="card"><div class="hd"><h3>The cadence on '+esc(near.short)+'</h3>'+
      '<span class="sub">closes '+fdate(near.close)+' · '+nd(near.dleft)+' out</span>'+
      '<span class="rt">'+ASTEP+'</span></div><div class="bd">'+pipeline(st)+
      '<div class="hint" style="margin-top:10px">Every trade that has not returned a price gets '+
      'each of these. A trade that replies drops out of the cadence the moment it is classified — '+
      'nobody who has already said no-bid gets chased again.</div></div></div>';}

  /* quiet list */
  var key='chase:quiet';
  var qs=cut(quiet,8,key);
  h+='<div class="card"><div class="hd"><h3>Trades that have not replied</h3>'+
    '<span class="sub">what the agent did, and where it stopped</span></div><div class="bd tight">'+
    (quiet.length?'<div class="scroll"><table class="dt"><thead><tr><th>Trade</th><th>Package</th>'+
    '<th>Package opened</th><th class="num">Follow-ups</th><th>Where it sits</th></tr></thead><tbody>'+
    qs.map(function(r){
      return '<tr class="clik" data-insp="bidder:'+r.p.id+':'+r.b.code+'">'+
        '<td><div class="tname">'+esc(r.b.firm)+'</div><div class="tsub">'+esc(r.b.contact)+'</div></td>'+
        '<td>'+esc(r.p.short)+'</td>'+
        '<td class="mono">'+(r.b.opened?fshort(r.b.opened):'never')+'</td>'+
        '<td class="num">'+r.sent+'</td>'+
        '<td>'+(r.esc?tag('Escalated to Aaron','red'):tag('Inside the cadence','blue'))+'</td></tr>';}).join('')+
    '</tbody></table></div>'+moreBtn(key,quiet.length,8)
    :'<div class="empty">Every invited trade on this project has replied.</div>')+'</div></div>';

  h+='<div class="split"><div class="card"><div class="hd"><h3>What the agent never does</h3>'+
    '<span class="rt">'+ASTEP+'</span></div><div class="bd">'+
    ['Negotiate price or scope with a contractor',
     'Commit Mosaic to anything',
     'Send anything in Phase 1 without your release',
     'Decide a trade is out — silence escalates, it never closes'].map(function(x){
      return '<div class="tlt" style="padding:6px 0;border-bottom:1px solid var(--line2)">'+
        '<span style="color:var(--red);font-weight:700">×</span> '+esc(x)+'</div>';}).join('')+
    '</div></div>'+
    '<div class="card"><div class="hd"><h3>What it does instead</h3><span class="rt">'+ASTEP+
    '</span></div><div class="bd">'+
    ['Reads every reply and classifies it: bidding, no-bid, question, or quote received',
     'Follows up on the same schedule whether or not anyone remembers',
     'Routes a scope question to the CM and issues the answer to every bidder',
     'Files the returned quote and ticks the trade off the log'].map(function(x){
      return '<div class="tlt" style="padding:6px 0;border-bottom:1px solid var(--line2)">'+
        '<span style="color:var(--green);font-weight:700">✓</span> '+esc(x)+'</div>';}).join('')+
    '</div></div></div>';
  return h;};

  h+='<div class="card addreg"><div class="hd"><h3>Addenda register</h3>'+

    (ad.length?'<div class="scroll"><table class="dt"><thead><tr><th>No.</th><th>Package</th>'+

          (a.q.length>72?'…':'')+'</div></td>'+
        '<td><div class="tsub" style="margin:0">'+esc(a.firm)+'</div></td>'+
        '<td class="num">'+a.to+'</td><td>'+tag(a.turn,'green')+'</td></tr>';}).join('')+

        '</td><td>'+tag(s[0],s[1])+'</td>'+

        '<td class="mono">'+(r.insExp?(r.insDays<=30?'<span style="color:var(--amberd)">'+
          fshort(r.insExp)+' · '+nd(r.insDays)+'</span>':fshort(r.insExp)):

  h+='<div class="split"><div class="note gold"><div class="notet">What the agent does with a flag</div>'+

/* ═══ INSPECTOR ═══════════════════════════════════════════════════ */
function openIns(title,sub,html){
  $('#inspT').innerHTML=title; $('#inspS').innerHTML=sub; $('#inspB').innerHTML=html;
  $('#insp').classList.add('open'); $('#scrim').classList.add('on'); S.ins=1;}
function closeIns(){var i=$('#insp'); if(!i)return;
  i.classList.remove('open'); $('#scrim').classList.remove('on'); S.ins=null;}
function closeNav(){var r=$('#rail'); if(r) r.classList.remove('open');
  document.body.style.overflow=''; S.navopen=false;}

var TKIND={invite:'Invitation',open:'Opened',chase:'Follow-up',quote:'Quote received',
  bidding:'Classified',question:'Question',nobid:'No-bid',withdrew:'Withdrawn',escalate:'Escalated'};

function inspect(key){
  var a=key.split(':');
  if(a[0]==='pkg'){go('log',{pkg:a[1]});return;}

  if(a[0]==='bidder'){
    var p=pkg(a[1]), b=p.bidders.filter(function(x){return x.code===a[2];})[0];
    var pq=D.prequal.filter(function(x){return x.code===b.code;})[0];
    var h='<dl class="kv" style="margin-bottom:13px">'+
      '<dt>Contact</dt><dd>'+esc(b.contact)+'</dd>'+
      '<dt>Email</dt><dd class="mono">'+esc(b.email)+'</dd>'+
      '<dt>Based in</dt><dd>'+esc(b.city)+'</dd>'+
      '<dt>Package</dt><dd>'+esc(p.short)+'</dd>'+
      '<dt>Status</dt><dd>'+bstate(b)+'</dd>'+
      (b.quote?'<dt>Quoted</dt><dd><b>'+money(b.quote)+'</b></dd>':'')+
      (b.note?'<dt>Note</dt><dd>'+esc(b.note)+'</dd>':'')+'</dl>';
    if(pq) h+='<div class="note '+(pq.state==='ok'?'teal':'red')+'" style="margin-bottom:13px">'+
      '<div class="notet">Prequalification — '+esc(pq.state)+'</div>'+
      'WorkSafeBC clearance '+(pq.wsbc==='expired'?'lapsed '+fdate(pq.wsbcExp):'to '+fdate(pq.wsbcExp))+
      ' · insurance '+(pq.insExp?fdate(pq.insExp)+' at '+moneyk(pq.lim):'none on file')+
      (pq.note?'<div style="margin-top:6px">'+esc(pq.note)+'</div>':'')+'</div>';
    h+='<div class="hd" style="border:0;padding:0 0 8px"><h3>Every touch</h3></div><div class="tl">'+
      b.touches.slice().reverse().map(function(t){
        var cl=t.kind==='escalate'||t.kind==='withdrew'?'r':(t.kind==='question'?'h':'a');
        return '<div class="tli '+cl+'"><div class="tlt">'+esc(TKIND[t.kind]||t.kind)+'</div>'+
          '<div class="tld">'+esc(t.text)+'</div><div class="tlw">'+fdate(t.day)+'</div></div>';}).join('')+
      '</div>';
    openIns(esc(b.firm), esc(p.project)+' · '+esc(p.short), h); return;}

  if(a[0]==='pq'){
    var r=D.prequal.filter(function(x){return x.code===a[1];})[0];

        fdate(r.wsbcExp)+'</span>':'clear to '+fdate(r.wsbcExp))+'</dd>'+
      '<dt>Insurance</dt><dd>'+(r.insExp?fdate(r.insExp)+(r.insDays<=30?
        ' — '+nd(r.insDays)+' away':''):'<span style="color:var(--red)">none on file</span>')+'</dd>'+
      '<dt>Limit</dt><dd>'+(r.lim?money(r.lim):'—')+' against a $5,000,000 threshold</dd>'+
      '<dt>Bonded</dt><dd>'+(r.bond==='yes'?'yes':'no')+'</dd>'+
      '<dt>Invited to</dt><dd>'+esc(mine.map(function(x){return x.short;}).join(', ')||'—')+'</dd></dl>'+
      (r.note?'<div class="note red">'+esc(r.note)+'</div>':
        '<div class="note teal">Nothing on this record blocks an award.</div>')); return;}

  if(a[0]==='add'){
    var ad=D.addenda.filter(function(x){return x.no===a[1];})[0], p2=pkg(ad.pkg);
    openIns(esc(ad.no), esc(p2.short)+' · issued '+fdate(ad.issued)+' to '+ad.to+' bidders',
      '<div class="mail"><div class="mailh"><span class="msubj">['+esc(ad.proj)+'] '+esc(p2.short)+
      ' — '+esc(ad.no)+'</span></div><div class="mailb">'+
      '<p><b>Question, from a bidder:</b><br>'+esc(ad.q)+'</p>'+
      '<p><b>Answer, from the construction manager:</b><br>'+esc(ad.a)+'</p>'+
      '<p class="sig">Issued to all '+ad.to+' invited trades, not only to '+esc(ad.firm)+'. '+
      'Acknowledgement recorded against each bid.</p></div></div>'+
      '<dl class="kv" style="margin-top:13px"><dt>Asked</dt><dd>'+fdate(ad.asked)+' by '+
      esc(ad.firm)+'</dd><dt>Answered by</dt><dd>'+esc(ad.cm)+'</dd>'+
      '<dt>Turnaround</dt><dd>'+esc(ad.turn)+'</dd></dl>'); return;}

  if(a[0]==='lev'){
    var L=D.levelled.filter(function(x){return x.code===a[1];})[0];
    openIns(esc(firm(L.code).name),'Levelled from '+money(L.base)+' to '+money(L.adj),
      '<dl class="kv" style="margin-bottom:13px"><dt>As quoted</dt><dd>'+money(L.base)+'</dd>'+
      '<dt>Added back</dt><dd>'+(L.carry?money(L.carry):'nothing')+'</dd>'+
      '<dt>Levelled</dt><dd><b>'+money(L.adj)+'</b></dd>'+
      '<dt>Included</dt><dd>'+L.nin+' of '+D.scope09.length+' scope items'+
        (L.nal?' (plus '+L.nal+' carried as an allowance)':'')+'</dd>'+
      '<dt>Excluded</dt><dd>'+L.nex+'</dd><dt>Not addressed</dt><dd>'+L.nna+'</dd></dl>'+
      (L.items.length?'<div class="hd" style="border:0;padding:0 0 8px"><h3>What was added back</h3></div>'+
      '<div class="scroll"><table class="dt" style="min-width:0"><tbody>'+
      L.items.map(function(x){return '<tr><td><div class="tname">'+esc(x.title)+'</div>'+
        '<div class="tsub">'+esc(x.ref)+' · '+(x.st==='EX'?'excluded':'not addressed')+'</div></td>'+
        '<td class="num">'+money(x.carry)+'</td></tr>';}).join('')+'</tbody></table></div>'
      :'<div class="note teal">Nothing to add back — every scope item is priced or carried.</div>'));
    return;}

  if(a[0]==='gap'){
    var g=D.gaps.filter(function(x){return x.ref===a[1];})[0];
    openIns(esc(g.title), esc(g.ref)+' · priced by '+g.priced+' of '+g.of+' bidders',
      (g.note?'<div class="note gold" style="margin-bottom:13px">'+esc(g.note)+'</div>':'')+
      '<div class="scroll"><table class="dt" style="min-width:0"><thead><tr><th>Bidder</th>'+
      '<th>How they treated it</th></tr></thead><tbody>'+
      D.levelled.map(function(r){var m=MXN[g.sts[r.code]];
        return '<tr><td>'+esc(firm(r.code).name)+'</td><td><span class="mcell '+m[1]+
        '" style="margin-right:6px">'+m[0]+'</span>'+esc(m[2])+'</td></tr>';}).join('')+
      '</tbody></table></div>'+
      '<div class="note" style="margin-top:13px"><div class="notet">Carry</div>'+
      money(g.carry)+' — Mosaic&rsquo;s own estimate to buy this scope elsewhere. '+
      'The agent does not fill the gap with an assumption; it reports it and prices the exposure.'+
      '</div>'); return;}

  if(a[0]==='skill'){
    var s=D.skills.filter(function(x){return x.name===a[1];})[0];
    openIns('<span class="mono">'+esc(s.name)+'</span>', esc(s.layer)+' skill · v'+esc(s.v),
      '<dl class="kv" style="margin-bottom:13px"><dt>Owner</dt><dd>'+esc(s.owner)+'</dd>'+
      '<dt>Updated</dt><dd>'+fdate(s.upd)+'</dd><dt>Length</dt><dd>'+s.lines+' lines</dd></dl>'+
      '<div class="note">'+esc(s.holds)+'</div>'+
      '<div class="note gold" style="margin-top:11px"><div class="notet">Why it is a file</div>'+
      'Because a file has a version, a date and one person answerable for it. '+
      'A habit has none of those, and it leaves with whoever held it.</div>'); return;}}

var TI=-1;
function tourGo(i){
  if(i<0||i>=TOUR.length){tourEnd();return;}
  TI=i; var s=TOUR[i];
  if(s.proj&&s.proj!==S.proj) S.proj=s.proj;
  if(s.pkg) S.pkg=s.pkg;
  if(s.tab!=null) S.tab[s.sc]=s.tab;
  S.sc=s.sc; S.more={}; closeIns(); closeNav(); render();
  var b=$('#tour'); b.classList.add('on');
  b.innerHTML='<div class="tourn">Step '+(i+1)+' of '+TOUR.length+'</div>'+
    '<div class="tourt">'+esc(s.t)+'</div><div class="tourd">'+esc(s.d)+'</div>'+
    '<div class="tourf"><button class="tbtn" data-tour="x">Close</button>'+
    '<div class="tourp"><i style="width:'+((i+1)/TOUR.length*100)+'%"></i></div>'+
    '<button class="tbtn" data-tour="p"'+(i===0?' disabled':'')+'>Back</button>'+
    '<button class="tbtn pri" data-tour="n">'+(i===TOUR.length-1?'Finish':'Next')+'</button></div>';
  setTimeout(function(){spotlight(s.target);},60);}
function spotlight(sel){
  var sp=$('#spot');
  if(!sel){sp.classList.remove('on');return;}
  var el=$(sel,$('#body')); if(!el){sp.classList.remove('on');return;}
  el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(function(){
    var r=el.getBoundingClientRect();
    if(r.height<2||r.width<2){sp.classList.remove('on');return;}
    var pad=6;
    sp.style.left=(r.left-pad)+'px'; sp.style.top=(r.top-pad)+'px';
    sp.style.width=(r.width+pad*2)+'px'; sp.style.height=(r.height+pad*2)+'px';
    sp.classList.add('on');},340);}
function tourEnd(){TI=-1;$('#tour').classList.remove('on');$('#spot').classList.remove('on');}

/* ═══ EVENTS ══════════════════════════════════════════════════════ */
function boot(){
  document.getElementById('app-root').innerHTML=shell();
  render();

  document.addEventListener('click',function(e){
    var t=e.target;
    function up(attr){var n=t; while(n&&n!==document){ if(n.getAttribute&&n.getAttribute(attr)!=null) return n; n=n.parentNode;} return null;}
    var n;
    if((n=up('data-tour'))){var k=n.getAttribute('data-tour');
      if(k==='x') tourEnd(); else if(k==='n') tourGo(TI+1); else tourGo(TI-1); return;}
    if(t.id==='inspclose'||t.id==='scrim'){closeIns();return;}
    if(t.id==='navtog'||(t.parentNode&&t.parentNode.id==='navtog')){
      var r=$('#rail'); S.navopen=!S.navopen; r.classList.toggle('open',S.navopen);
      document.body.style.overflow=S.navopen?'hidden':''; return;}
    if(t.id==='tourbtn'||t.id==='tourbtn2'||(t.parentNode&&(t.parentNode.id==='tourbtn'||t.parentNode.id==='tourbtn2'))){
      tourGo(0); return;}
    if((n=up('data-rel'))){S.released[n.getAttribute('data-rel')]=1; render(); return;}
    if((n=up('data-more'))){S.more[n.getAttribute('data-more')]=1; render(); return;}
    if((n=up('data-proj'))){
      S.proj=n.getAttribute('data-proj'); S.more={}; S.sel=null;
      var g=n.getAttribute('data-go'); if(g){S.sc=g;}
      var l=pkgs(); if(l.length) S.pkg=l[0].id;
      closeIns(); render(); return;}
    if((n=up('data-insp'))){inspect(n.getAttribute('data-insp')); return;}
    if((n=up('data-pkg'))){S.pkg=n.getAttribute('data-pkg'); S.more={}; render(); return;}
    if((n=up('data-tab'))){S.tab[S.sc]=n.getAttribute('data-tab'); S.more={}; render(); return;}
    if((n=up('data-go'))){
      var tb=n.getAttribute('data-tab'); var pk=n.getAttribute('data-pkg');
      go(n.getAttribute('data-go'),{tab:tb,pkg:pk}); return;}
  });

  document.addEventListener('change',function(e){
    if(e.target.id==='psel'){
      S.proj=e.target.value; S.more={}; S.sel=null;
      var l=pkgs(); if(l.length) S.pkg=l[0].id;
      closeIns(); render();}});

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ if(S.ins) closeIns(); else if(TI>=0) tourEnd(); }
    if(TI>=0&&e.key==='ArrowRight') tourGo(TI+1);
    if(TI>=0&&e.key==='ArrowLeft')  tourGo(TI-1);});

  window.addEventListener('resize',function(){ if(TI>=0) spotlight(TOUR[TI].target); });

  if(/[?&]tour=1/.test(location.search)) setTimeout(function(){tourGo(0);},420);
}
if(document.readyState!=='loading') boot();
else document.addEventListener('DOMContentLoaded',boot);
</script>
