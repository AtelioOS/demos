/* ── IMSS ── */
SC.imss = () => {
  if(tab.imss === "recon") return imssRecon();
  if(tab.imss === "trab")  return imssTrab();
  const ms = filtMovs().slice().sort((a,b)=>(a.filed?1:0)-(b.filed?1:0) || a.due-b.due);
  const open = openMovs();
  const risk = riskMovs();
  const strip = dayBars(open.map(m=>({d:m.due})), {label:"movimientos", riskAt:2});
  const byType = ["alta","baja","modificacion","reingreso"].map((t,i)=>({
    l:MOV_L[t], v:open.filter(m=>m.t===t).length, c:PAL[i]}));
  const c = cut(ms, 12);
  return `
  <p class="lede">Cada alta, baja, modificación de salario y reingreso tiene <b>cinco días hábiles</b>
  para presentarse por IDSE. El reloj empieza el día del hecho, no el día que Vencom se entera.</p>
  ${tabs("imss",[["movs","Movimientos afiliatorios"],["trab","Por trabajador"],["recon","Conciliación SUA ↔ EMA"]])}

  <div class="split64" style="margin-bottom:4px">
    <div class="card"><div class="hd"><h3>Cuándo vencen los ${int(open.length)} abiertos</h3>
      <span class="sub">una columna por día</span></div>
      <div class="bd">${strip}</div></div>
    <div class="card"><div class="hd"><h3>De qué tipo son</h3></div><div class="bd">
      ${splitBar(byType)}
      <div class="chartnote">Las <b>modificaciones de salario</b> son las que más se atrasan:
      nadie avisa de un aumento con la misma urgencia con la que avisa de una baja.</div>
    </div></div>
  </div>

  ${risk.length?`<div class="note bad"><b>${int(risk.length)} movimiento(s) dentro del plazo crítico.</b>
    ${esc(risk.map(m=>cn(m.c)+" · "+m.emp.split(" ")[0]+" "+m.emp.split(" ")[1]).join(" · "))}</div>`:""}

  ${chips("movs",[["abiertos","Abiertos"],["riesgo","En riesgo"],["todos","Todos"],["alta","Altas"],["baja","Bajas"],["modificacion","Modificaciones"],["reingreso","Reingresos"]])}
  <div class="card"><div class="bd flush"><div class="scroll"><table class="dt">
    <thead><tr><th>Trabajador</th><th>Cliente</th><th>Tipo</th>
      <th class="num">Vence</th><th>Estado</th><th>Responsable</th></tr></thead>
    <tbody>${c.rows.map(m=>{
      const r = !m.filed && m.due<=2;
      return `<tr class="clk ${sel&&sel.t==="mov"&&sel.id===m.id?"sel":""}" data-mov="${m.id}">
        <td>${esc(m.emp)}</td>
        <td class="tiny muted">${esc(cn(m.c))}</td>

        <td>${m.filed?`<span class="tag ok">presentado</span>`:`<span class="tag ${r?"bad":"warn"}">pendiente</span>`}</td>

    </tbody></table></div>${moreBtn(c.hidden)}</div></div>

  no hacen falta en la lista para decidir qué atender primero.</div>`;
};

function imssRecon(){
  const rs = D.recon.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const withDiff = rs.filter(r=>r.diffs.length);
  const dv = withDiff.map(r=>({l:cn(r.c), v:r.delta, t:mx(r.delta),
    attr:`data-recon="${r.c}"`, on: sel && sel.t==="recon" && sel.id===r.c}));
  return `

/* ── FPL · PROYECCIONES ─────────────────────────────────────────────────
   Lo que hoy tarda una semana. El actuario configura el método una vez —la
   aportación y el crecimiento— y de ahí cada cliente se proyecta solo. La
   barra de cobertura es la que el cliente entiende sin que se la expliquen. */
const PROY = id => (D.proy||[]).find(p=>p.c===id);
/* ¿Cuánto habría que aportar para cubrir el pasivo en cinco años? Se resuelve
   numéricamente: no hay fórmula cerrada porque los activos capitalizan. */
function aportPara100(p){
  const a0 = p.anios[0].act, o0 = p.anios[0].obl, P = p.params;
  const obl5 = o0 * Math.pow(1 + P.incObl/100, 5);
  let lo = 0, hi = 40;
  for(let k=0; k<40; k++){
    const mid = (lo+hi)/2;
    let act = a0, nom = p.nomAnual;
    for(let y=1; y<=5; y++){ act = act*(1+P.rend/100) + nom*mid/100; nom *= (1+P.incNom/100); }
    if(act < obl5) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}
function fplProy(){
  const id = fichaId(), c = cO(id), p = PROY(id);
  const head = `<p class="lede">El cliente manda su <b>nómina ciega</b>, el actuario deja configurado el
  método una sola vez, y la proyección sale <b>en el momento</b> — no en una semana. Es la diferencia entre
  volver con una presentación y cerrar en la misma visita.</p>
  ${tabs("fpl", FPLTABS)}
  ${cliPicker(id)}`;
  if(!p) return head + `<div class="note">Este cliente no tiene estudio actuarial contratado, así que no
    hay obligación laboral que proyectar.</div>`;
  /* La compuerta no es un letrero: si la nómina ciega no llegó, esta pantalla
     no enseña números, porque cualquier número sería inventado. */
  const gate = (D0.incorp||[]).find(x=>x.n === c.n);
  if(gate && !incGate(gate)) return head + `
    <div class="gateblk"><span class="badge">Falta información</span>
      <div><b>No se puede proyectar todavía.</b> ${esc(gate.bloqueo || "Falta documentación")}.

    <div class="note info">Ve a <b>Incorporación</b> para ver qué falta y en qué etapa está el expediente.</div>`;
  const A = p.anios, y0 = A[0], y2 = A[2], y5 = A[5];

      <span class="sub">${esc(c.n)} · seis ejercicios</span></div><div class="bd">
      ${groupBars(A.map(a=>a.y===0?"Hoy":"A"+a.y),

      el rendimiento y con lo que se aporte. La distancia entre las dos barras <b>es el déficit</b>.</div>

const prosLeads = () => P_().leads;
const contactedL = () => prosLeads().filter(l=>l.contactedDay!==null);
const repliedL = () => prosLeads().filter(l=>l.replyDay!==null);
const deliveredL = () => prosLeads().filter(l=>l.delivered);
const slaMiss = () => P_().handoffs.filter(h=>!h.sla);
const INTENT_L = {"interesado":"Interesado","pide-precio":"Pide precio","pide-junta":"Pide junta",
                  "pregunta":"Pregunta","más-tarde":"Más tarde","no-interesado":"No le interesa"};
const INTENT_C = {"interesado":"ok","pide-precio":"warn","pide-junta":"warn",
                  "pregunta":"info","más-tarde":"","no-interesado":"bad"};

/* Prospección no la opera Vencom: la opera Telaia y Vencom la revisa.
   Eso no es un detalle de permisos, es el modelo comercial — por eso el aviso
   va en TODAS las pestañas y no sólo en la primera. */
const PROS_BANNER = isPros ? "" : `<div class="ronly">
    <span class="badge">Sólo lectura</span>
    <div><b>Este módulo lo opera Telaia, no Vencom.</b> Aquí queda registrado todo lo que hace el
    motor de prospección —qué empresas encontró, a quién escribió, qué contestaron y qué se entregó
    al equipo comercial— para que Vencom lo revise y lo audite cuando quiera.
    Vencom no ejecuta búsquedas ni envía correos desde esta pantalla.</div>
  </div>`;

SC.prospeccion = () => {
  const t = tab.prospeccion;
  const head = `${PROS_BANNER}${tabs("prospeccion", PTABS)}`;
  if(t==="fuentes")      return pFuentes(head);
  if(t==="cola")         return pCola(head);
  if(t==="secuencias")   return pSecuencias(head);
  if(t==="respuestas")   return pRespuestas(head);
  if(t==="entregas")     return pEntregas(head);
  if(t==="valor")        return pValor(head);
  if(t==="cumplimiento") return pCumplimiento(head);
  return pEmbudo(head);
};

function pEmbudo(head){
  const P = P_(), f = P.funnel, top = f.encontrados;
  const rows = [["Empresas halladas",f.encontrados],["Con dato de contacto",f.contactables],
    ["Calificadas por ajuste",f.calificados],["Contactadas",f.contactados],
    ["Respondieron",f.respondieron],["Entregadas a un ejecutivo",f.entregados],
    ["Reuniones",f.reuniones],["Propuestas",f.propuestas],["Clientes firmados",f.ganados]];
  return `
  <p class="lede">Telaia opera un motor que <b>trae clientes nuevos para Vencom</b>: busca empresas que se
  parecen a las que Vencom ya administra bien, se queda con las que tienen contacto real, y escribe con un
  motivo concreto — la cuota que sube, la tasa que cambió, el registro que vence. Lo que ves aquí es
  <b>el registro de ese trabajo</b>, abierto para que Vencom lo revise.</p>
  ${head}
  ${(() => { const fg = (P.fugas||[]).filter(f=>f.perdidos>0)
      .slice().sort((a,b)=>b.perdidos-a.perdidos);
    if(!fg.length) return "";
    const peor = fg[0];
    return `<div class="card"><div class="hd"><h3>Dónde se cae el proceso</h3>
      <span class="sub">de dónde a dónde se pierde cada prospecto</span></div><div class="bd">
      ${hbars(fg.map(f=>({l:f.l, sub:f.por, v:f.perdidos, t:int(f.perdidos)+" · "+pct(f.tasa,0),
        c: f.l.indexOf("ejecutivo")>=0 ? "var(--danger)" : "var(--c1)"})))}
      <div class="chartnote">La fuga cara no es la más grande: es
      <b>«el ejecutivo no lo atendió»</b>. Esos ya habían contestado — se perdieron del lado de Vencom,
      no del mercado. La más grande, «${esc(peor.l.toLowerCase())}», se arregla cambiando la fuente,
      no trabajando más.</div>
    </div></div>`;
  })()}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="tile"><span class="klabel">Clientes firmados</span><span class="stat">${P.won.length}</span>
      <span class="foot">en los últimos 90 días</span></div>
    <div class="tile"><span class="klabel">Valor anualizado</span><span class="stat sm">${mx(wonValue())}</span>
      <span class="foot">${int(P.won.reduce((a,w)=>a+w.emp,0))} trabajadores nuevos</span></div>
    <div class="tile"><span class="klabel">Costo de datos y modelo</span><span class="stat sm">${usd(prosCost())}</span>
      <span class="foot">90 días, las tres fuentes</span></div>
    <div class="tile"><span class="klabel">Costo por cliente firmado</span><span class="stat sm">${usd(prosCost()/P.won.length)}</span>
      <span class="foot">sin contar el tiempo comercial</span></div>
  </div>
  <div class="split7">
    <div><div class="card"><div class="hd"><h3>De la búsqueda al contrato</h3>
      <span class="sub">90 días</span></div><div class="bd">
      <div class="funnel">${rows.map(([l,v],i)=>`
        <div class="fstep"><div>${esc(l)}</div>
          <div class="fbar"><i style="width:${Math.max(0.6,v/top*100).toFixed(2)}%;background:${PAL[i%6]}"></i></div>
          <div class="fnum">${int(v)}<em>${pct(v/top*100, v/top<0.01?2:0)}</em></div></div>`).join("")}
      </div>
      <div class="note" style="margin-top:12px">La caída más fuerte es de <b>halladas</b> a <b>con contacto</b>.
      Ese salto no es del mensaje, es de la fuente — está desglosado en la pestaña de fuentes.</div>
    </div></div></div>
    <div>
      <div class="card"><div class="hd"><h3>Lo que abre la conversación</h3></div><div class="bd">
        ${hbars(Object.entries(prosLeads().reduce((a,l)=>{a[l.hook]=(a[l.hook]||0)+1;return a;},{}))
          .sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:k,v,t:int(v)})))}
        <div class="tiny muted" style="margin-top:9px">No es un asunto genérico: es el cambio normativo que
        le pega a esa empresa por su estado, su tamaño y su giro.</div>
      </div></div>
      <div class="card"><div class="hd"><h3>Dónde está atorado</h3></div><div class="bd">
        <dl class="kv">
          <dt>Sin dato de contacto</dt><dd>${int(f.encontrados-f.contactables)} empresas</dd>
          <dt>Abajo del piso de ajuste</dt><dd>${int(prosLeads().filter(l=>!l.delivered).length)} en la muestra</dd>
          <dt>Contactadas sin respuesta</dt><dd>${int(contactedL().length-repliedL().length)}</dd>
          <dt>Esperando a un ejecutivo</dt><dd>${int(P.handoffs.filter(h=>h.state==="pendiente").length)}</dd>

      </div></div>
    </div>
  </div>`;
}

function pFuentes(head){

  const byS = k => P.runs.filter(r=>r.src===k);
  const tot = k => byS(k).reduce((a,r)=>({q:a.q+r.queries,c:a.c+r.cand,d:a.d+r.dup,
                                          n:a.n+r.created,$:a.$+r.cost}),{q:0,c:0,d:0,n:0,$:0});
  return `
  <p class="lede">Tres fuentes, el mismo mercado, resultados muy distintos. La que <b>encuentra más
  empresas no es la que trae más clientes</b> — y esa comparación sólo existe si las tres corren en paralelo
  y se mide hasta el contrato, no hasta el clic.</p>

    <span class="sub">90 días</span></div><div class="bd flush"><div class="scroll"><table class="dt">
    <thead><tr><th>Fuente</th><th class="num">Halladas</th><th class="num">Con contacto</th>
      <th class="num">Rendimiento</th><th class="num">Calificadas</th><th class="num">Entregadas</th>
      <th class="num">Costo</th><th class="num">Costo por calificada</th><th class="num">Firmados</th></tr></thead>
    <tbody>${P.adapters.map(a=>{
      const del = deliveredL().filter(l=>l.src===a.k).length;
      const won = P.won.filter(w=>w.src===a.k).length;
      return `<tr class="clk ${sel&&sel.t==="src"&&sel.id===a.k?"sel":""}" data-src="${a.k}">
        <td><b>${esc(a.n)}</b><div class="tiny muted" style="max-width:330px;white-space:normal">${esc(a.note)}</div></td>
        <td class="num mono">${int(a.found)}</td>

        <td class="num mono">${int(a.qual)}</td>

        <td class="num mono">${a.cost?usd(a.cpl,3):"—"}</td>
        <td class="num mono"><b>${won}</b></td></tr>`;}).join("")}
    </tbody></table></div></div>
    <div class="bd" style="border-top:1px solid var(--border)">
      <div class="note info"><b>Lee esta tabla antes que cualquier otra.</b> DENUE no cuesta nada por consulta
      y trae correo en ${pct(P.adapters[0].yield,0)} de los registros. Places encontró más empresas que nadie
      y firmó cero, porque quien autoriza la nómina no publica su correo en una ficha de negocio. Apollo es la
      más cara y es la única que devuelve una persona con puesto. La mezcla correcta depende del giro, y el

    </div></div>

        <div class="bd flush"><div class="scroll"><table class="dt">
        <thead><tr><th>Fecha</th><th>Fuente</th><th class="num">Consultas</th><th class="num">Candidatos</th>
          <th class="num">Ya conocidos</th><th class="num">Nuevos</th><th class="num">Costo</th></tr></thead>

          <td><span class="tag">${esc(r.src)}</span></td>

          <td class="num mono">${int(r.cand)}</td>
          <td class="num mono muted">${int(r.dup)} <span class="tiny">(${pct(r.dup/r.cand*100,0)})</span></td>
          <td class="num mono"><b>${int(r.created)}</b></td>
          <td class="num mono">${r.cost?usd(r.cost,3):"—"}</td></tr>`).join("")}
        </tbody>
        <tfoot><tr style="border-top:1px solid var(--border-strong)">
          <td class="mono">Total 90 días</td><td></td>
          <td class="num mono">${int(P.runs.reduce((a,r)=>a+r.queries,0))}</td>
          <td class="num mono">${int(P.runs.reduce((a,r)=>a+r.cand,0))}</td>

        <div class="timeline">
          <div class="tl"><div class="when">1</div><div class="what">Se cuenta antes de gastar: DENUE dice cuántos hay sin cobrar la consulta</div></div>
          <div class="tl"><div class="when">2</div><div class="what">Identidad por RFC cuando existe, si no por razón social normalizada y domicilio</div></div>
          <div class="tl"><div class="when">3</div><div class="what">Se compara contra la cartera actual: un cliente de Vencom nunca vuelve a entrar como prospecto</div></div>
          <div class="tl"><div class="when">4</div><div class="what">Se compara contra lo ya hallado por las otras dos fuentes</div></div>

      </div></div>
    </div>

function pCola(head){
  /* La elegibilidad NO es binaria. Filtrar de golpe a quien hoy no cotiza bien
     deja la lista vacía; el que está dispuesto a corregir es un cliente futuro. */
  const ELEG_TAG = {califica:"", convertible:"warn", no_califica:"bad"};
  const P = P_();
  let ls = prosLeads().slice();
  const f = filt.lead;
  if(f==="alto") ls = ls.filter(l=>l.fit>=80);
  else if(f==="medio") ls = ls.filter(l=>l.fit>=62 && l.fit<80);
  else if(f==="bajo") ls = ls.filter(l=>l.fit<62);
  else if(f==="contactadas") ls = ls.filter(l=>l.contactedDay!==null);
  else if(f==="respondieron") ls = ls.filter(l=>l.replyDay!==null);
  ls.sort((a,b)=>b.fit-a.fit);
  return `
  <p class="lede">Cada renglón trae <b>por qué está aquí</b>. El ajuste no es un número de caja negra:
  se compone de giro, tamaño de plantilla, estado y si existe una persona a quien escribirle.</p>
  ${head}
  <div class="split64" style="margin-bottom:4px">
    <div class="card"><div class="hd"><h3>Cómo se reparte el ajuste</h3>
      <span class="sub">el piso de entrega es 62</span></div><div class="bd">
      ${(()=>{const b=[[31,50,"31–50"],[50,62,"50–61"],[62,70,"62–69"],[70,80,"70–79"],[80,90,"80–89"],[90,98,"90+"]];
        return hbars(b.map(([lo,hi,l])=>({l, v:prosLeads().filter(x=>x.fit>=lo&&x.fit<hi).length,
          t:int(prosLeads().filter(x=>x.fit>=lo&&x.fit<hi).length),
          c: lo>=62 ? "var(--c1)" : "var(--border-strong)"})));})()}
      <div class="chartnote">Gris es lo que <b>no se contacta</b>. Subir el piso reduce el volumen y sube
      la tasa de respuesta; bajarlo hace lo contrario. Es una perilla, no una opinión.</div>
    </div></div>
    <div class="card"><div class="hd"><h3>Qué tan contactables son</h3></div><div class="bd">
      ${splitBar([
        {l:"Persona con puesto", v:prosLeads().filter(x=>x.hasPerson).length, c:"var(--success)"},
        {l:"Sólo correo", v:prosLeads().filter(x=>x.hasEmail&&!x.hasPerson).length, c:"var(--c1)"},
        {l:"Sólo teléfono", v:prosLeads().filter(x=>!x.hasEmail&&x.hasPhone).length, c:"var(--warning)"},
        {l:"Sin dato", v:prosLeads().filter(x=>!x.hasEmail&&!x.hasPhone).length, c:"var(--border-strong)"},
      ])}
      <div class="chartnote">Encontrar la empresa es la parte fácil. Encontrar a quién escribirle es
      la que separa a una fuente de otra.</div>
    </div></div>
  </div>
  ${(() => { const E = P_().elegibilidad || [];
    return `<div class="card"><div class="hd"><h3>Elegibilidad para FPL®</h3>
      <span class="sub">criterio ajustable, no un portón</span></div><div class="bd">
      ${splitBar(E.map((e,i)=>({l:e.l, v:e.n, c: e.k==="califica"?PAL[0]:e.k==="convertible"?PAL[1]:"var(--border-strong)"})))}
      <div class="chartnote">${E.map(e=>`<b>${esc(e.l)}</b>: ${esc(e.d)}.`).join(" ")}
      <br>Poner el filtro en «sólo califica» deja la lista casi vacía. Los <b>convertibles</b> son los que
      hoy no cotizan sobre el sueldo real y están dispuestos a corregirlo — ésos son clientes del año que
      entra, no basura.</div>
    </div></div>`;
  })()}
  ${chips("lead",[["todas","Todas"],["alto","Ajuste alto"],["medio","Medio"],["bajo","Bajo el piso"],["contactadas","Contactadas"],["respondieron","Respondieron"]])}
  <div class="card"><div class="bd flush"><div class="scroll"><table class="dt">
    <thead><tr><th>Empresa</th><th>Giro (SCIAN)</th><th>Estado</th><th class="num">Plantilla</th>
      <th class="num">Ajuste</th><th>Contacto</th><th>Fuente</th><th>Estado</th></tr></thead>
    <tbody>${cut(ls, 12).rows.map(l=>`
      <tr class="clk ${sel&&sel.t==="lead"&&sel.id===l.id?"sel":""}" data-lead="${l.id}">
        <td>${esc(l.n)}</td>
        <td class="tiny muted">${esc(l.scianN)}<br><span class="mono">${esc(l.scian)}</span></td>
        <td class="tiny">${esc(l.state)}</td>
        <td class="num mono">${int(l.emp)}</td>
        <td class="num mono" style="color:${l.fit>=80?"var(--success)":l.fit>=62?"var(--ink)":"var(--ink-muted)"}">${l.fit}</td>
        <td>${l.hasPerson?`<span class="tag ok">persona</span>`:l.hasEmail?`<span class="tag ok">correo</span>`
             :l.hasPhone?`<span class="tag warn">teléfono</span>`:`<span class="tag bad">sin dato</span>`}</td>
        <td><span class="tag">${esc(l.src)}</span></td>
        <td>${l.intent?`<span class="tag ${INTENT_C[l.intent]}">${esc(INTENT_L[l.intent])}</span>`
             :l.contactedDay!==null?`<span class="tag">en secuencia</span>`
             :l.delivered?`<span class="tag info">en cola</span>`:`<span class="tag">bajo el piso</span>`}</td></tr>`).join("")}
    </tbody></table></div>${moreBtn(cut(ls, 12).hidden)}</div></div>`;
}

SC.reportes = () => {
  if(tab.reportes==="riesgo") return repRiesgo();
  const byTeam = {};
  D.staff.forEach(s=>{ byTeam[s.team] = byTeam[s.team]||[]; byTeam[s.team].push(s); });
  /* Contar sólo corridas, movimientos y obligaciones dejaba a la administradora
     del FPL, la coordinadora de In House y el reclutador en CERO — como si no
     hicieran nada. Su trabajo existe, sólo vivía en otras tablas. Un tablero de
     carga que enseña ceros falsos es peor que no tenerlo. */
  const load = D.staff.map(s=>{
    let n = D.runs.filter(r=>r.owner===s.id && r.stage!=="cerrada").length
          + D.movs.filter(m=>m.owner===s.id && !m.filed).length
          + D.obligations.filter(o=>o.owner===s.id && o.st!=="hecho").length;
    if(s.team === "fpl")
      n += fundBroken().length
         + D.loans.filter(l=>l.st !== "corriente").length
         + D.claims.filter(c=>c.st === "abierto" || c.st === "documentos").length;
    if(s.team === "implants")
      n += D.implants.filter(i=>i.state !== "activo").length + Math.ceil(D.implants.length/4);
    if(s.team === "talento")
      n += D.reqs.length + D.placements.filter(p=>p.state !== "activo").length;
    if(s.team === "actuaria")
      n += D.act.filter(a=>a.st !== "entregado").length;
    if(s.team === "cumplimiento")
      n += (D.policies||[]).filter(p=>p.st!=="vigente").length;
    return {l:s.n, sub:s.role, v:n};
  }).sort((a,b)=>b.v-a.v);
  const bySector = {};
  D.clients.forEach(c=>{ bySector[c.sector] = (bySector[c.sector]||0)+c.emp; });
  const cal = {};
  D.runs.forEach(r=>{ cal[r.cal] = (cal[r.cal]||0)+1; });
  return `
  <p class="lede">Dos preguntas que hoy no tienen respuesta rápida: <b>quién está saturado</b> y
  <b>dónde se concentra el riesgo</b>.</p>
  ${tabs("reportes",[["carga","Carga de trabajo"],["riesgo","Concentración y riesgo"]])}
  <div class="split7">
    <div><div class="card"><div class="hd"><h3>Pendientes abiertos por persona</h3>
      <span class="sub">todo lo que tiene abierto cada quien, de cualquier módulo</span></div>
      <div class="bd">${hbars(load)}</div></div></div>
    <div>
      <div class="card"><div class="hd"><h3>Trabajadores por sector</h3></div><div class="bd">
        ${hbars(Object.keys(bySector).sort((a,b)=>bySector[b]-bySector[a]).map(k=>({l:k,v:bySector[k],t:int(bySector[k])})))}
      </div></div>
      <div class="card"><div class="hd"><h3>Corridas por calendario</h3></div><div class="bd">
        ${hbars(Object.keys(cal).map(k=>({l:k,v:cal[k],t:int(cal[k])})))}
        <div class="tiny muted" style="margin-top:9px">Los calendarios semanales generan cuatro veces
        más corridas que los mensuales con la misma plantilla. Ahí está el pico de fin de mes.</div>
      </div></div>
    </div>
  </div>`;
};
function repRiesgo(){
  const top3 = D.clients.slice().sort((a,b)=>b.emp-a.emp).slice(0,3);
  const conc = top3.reduce((a,c)=>a+c.emp,0)/F.employees*100;
  const gob = D.clients.filter(c=>c.sector==="Municipal"||c.sector==="Gobierno");
  const gobEmp = gob.reduce((a,c)=>a+c.emp,0);
  const risk = [
    {l:"Movimientos IMSS fuera de plazo", v:riskMovs().length, t:int(riskMovs().length)},
    {l:"Diferencias SUA / EMA", v:diffCount(), t:int(diffCount())},
    {l:"Obligaciones en riesgo", v:riskObl().length, t:int(riskObl().length)},
    {l:"Reglas FPL® rotas", v:fundBroken().length, t:int(fundBroken().length)},
    {l:"Diferencias de censo", v:censusDiff().length, t:int(censusDiff().length)},
    {l:"Estudios sin censo", v:actBlocked().length, t:int(actBlocked().length)},
    {l:"Implants sin relevo", v:gapImplants().length, t:int(gapImplants().length)},
    {l:"Garantías en riesgo", v:guarRisk().length, t:int(guarRisk().length)},
  ].sort((a,b)=>b.v-a.v);
  return `
  <p class="lede">Nada de esto es una opinión sobre si una estructura es correcta. Es <b>dónde hay
  trabajo sin terminar</b> y qué tan concentrada está la cartera.</p>
  ${tabs("reportes",[["carga","Carga de trabajo"],["riesgo","Concentración y riesgo"]])}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="tile"><span class="klabel">Top 3 clientes</span><span class="stat">${pct(conc,0)}</span>
      <span class="foot">de los trabajadores administrados</span></div>
    <div class="tile"><span class="klabel">Sector público</span><span class="stat">${pct(gobEmp/F.employees*100,0)}</span>
      <span class="foot">${gob.length} contratos · ciclo político</span></div>
    <div class="tile"><span class="klabel">Cliente más antiguo</span><span class="stat">${TODAY.getFullYear()-Math.min(...D.clients.map(c=>c.since))} años</span>
      <span class="foot">desde ${Math.min(...D.clients.map(c=>c.since))}</span></div>
    <div class="tile"><span class="klabel">REPSE</span><span class="stat">${D.repse.expires} d</span>
      <span class="foot">para el vencimiento del registro</span></div>
  </div>
  <div class="split7">
    <div><div class="card"><div class="hd"><h3>Trabajo abierto por tipo de riesgo</h3></div>
      <div class="bd">${hbars(risk)}</div></div></div>
    <div><div class="card"><div class="hd"><h3>Concentración de la cartera</h3></div><div class="bd">
      ${hbars(D.clients.slice().sort((a,b)=>b.emp-a.emp).map(c=>({l:c.n,v:c.emp,t:int(c.emp)})))}
      <div class="note warn" style="margin-top:11px">Perder el contrato municipal significaría
      ${pct(gobEmp/F.employees*100,0)} de la plantilla administrada de golpe, y esos contratos se renuevan
      con el ciclo de la administración, no con la satisfacción del cliente.</div>
    </div></div></div>
  </div>`;
}

const INSPDEF = {

function inspector(){
  const s = sel || INSPDEF[screen]();
  // keys and values are authored here, never user input — both may carry markup
  const kv = rows => `<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;

  if(s.t==="ib"){
    const [k,id] = String(s.id).split(":");
    return inspector.call(null, sel = {t:k==="mov"?"mov":k==="run"?"run":k==="fund"?"fund":k==="obl"?"obl":
      k==="imp"?"imp":k==="plc"?"plc":k==="loan"?"loan":k==="act"?"act":"claim", id});
  }

  if(s.t==="inc"){
    const p = D0.incorp.find(x=>x.id===s.id); if(!p) return {kick:"", ttl:"—", body:""};
    const EL = D0.etapaL, listo = incGate(p);
    return {kick:p.sector + " · " + p.ciudad, ttl:p.n, body:
      kv([["Trabajadores",int(p.emp)],
          ["Nómina anual estimada",mx(p.nomAnual)],
          ["Etapa",`<span class="tag ${INC_TAG[p.etapa]||""}">${esc(EL[p.etapa])}</span>`],
          ["Sin moverse",dias(p.espera)],
          ["Ejecutivo",esc(repN(p.rep))]]) +
      `<div class="sect">Convenio de confidencialidad</div>` +
      kv([["Enviado", p.nda.enviado!=null?fdauto(p.nda.enviado):"—"],
          ["Firmado", p.nda.firmado!=null?fdauto(p.nda.firmado)
            :"<span style='color:var(--warning)'>pendiente</span>"],
          ["Vigencia", dias(p.nda.vigencia*365).replace(/^1095 días$/,"3 años")]]) +
      `<div class="sect">Nómina ciega</div>` +
      (p.ciega
        ? kv([["Recibida", fdauto(p.ciega.recibida)],
              ["Filas", int(p.ciega.filas)],
              ["Corte", esc(p.ciega.corte)],
              ["Revisión", p.ciega.limpia ? "sin datos personales"
                : "<span style='color:var(--danger)'>rechazada</span>"]])
          + (p.ciega.problema ? `<div class="note warn" style="margin-top:10px">${esc(p.ciega.problema)}.
             El convenio obliga a avisar dentro de tres días hábiles y destruirla — recibirla y usarla
             de todos modos convierte un trámite en un problema de datos personales.</div>` : "")
        : `<div class="tiny muted">Todavía no llega.</div>`) +
      `<div class="sect">Recorrido</div>` +
      p.hitos.map(h=>`<div class="tl"><div class="when">${esc(fdauto(h.day))}</div>
        <div class="what"><b>${esc(EL[h.e])}</b></div></div>`).join("") +
      `<div class="note ${listo?"":"warn"}" style="margin-top:12px">${listo
        ? "Listo: con la nómina ciega en la mano, la proyección a dos y cinco años sale el mismo día."
        : "<b>No se puede proyectar todavía.</b> " + esc(p.bloqueo || "Falta documentación") + "."}</div>`};
  }

  if(s.t==="pol"){
    const p = (D.policies||[]).find(x=>x.id===s.id); if(!p) return {kick:"", ttl:"—", body:""};
    return {kick:cn(p.c), ttl:p.ramo, body:
      kv([["Aseguradora",esc(p.aseg)],
          ["Número de póliza",`<span class="mono">${esc(p.poliza)}</span>`],
          ["Fundamento",esc(p.base)],
          ["Asegurados",int(p.asegurados)],
          ["Suma asegurada",mx(p.suma)+" <span class='tiny'>por asegurado</span>"],
          ["Prima anual",mx(p.prima)],
          ["Estado",`<span class="tag ${POL_TAG[p.st]}">${esc(p.st)}</span>`],
          ["Vigencia",venc(p.renew)],
          ["Pago de la prima",esc(p.pago)],
          ["Certificados al cliente",p.cert?"entregados":"<span style='color:var(--danger)'>pendientes</span>"]]) +
      (p.st !== "vigente"
        ? `<div class="note warn" style="margin-top:12px">${p.st==="vencida"
            ? "La póliza <b>ya venció</b>. Cualquier siniestro ocurrido después de esa fecha queda sin cobertura, y la reclamación la recibe Vencom antes que la aseguradora."
            : "La ventana de renovación está abierta. Renovar tarde suele implicar <b>nueva suscripción</b> y periodos de espera para los asegurados."}</div>`
        : `<div class="note" style="margin-top:12px">Vigente. El sistema abre el pendiente de renovación
           <b>45 días antes</b> del vencimiento, con responsable asignado.</div>`)};
  }

  if(s.t==="worker"){
    const w = wO(s.id); if(!w) return {kick:"", ttl:"—", body:""};
    const c = cO(w.c), n = w.nom, f = w.fpl;
    const st = wFundState(f);
    return {kick:(c?c.n:"") + " · " + w.puesto, ttl:w.n, body:
      kv([["NSS",`<span class="mono">${esc(w.nss)}</span>`],
          ["Alta",fdauto(w.alta)+" <span class='tiny'>("+Math.round(-w.alta/365*10)/10+" años)</span>"],
          ["Calendario",esc(w.cal)],
          ["SBC diario",mx(w.sbc)],["Sueldo mensual",mx(w.salM)]]) +
      `<div class="sect">Nómina del periodo · ${esc(w.cal)}, ${dias(n.dias)}</div>` +
      kv([["Percepciones",mx(n.gross)],
          ["ISR retenido","−"+mx(n.isr)],
          ["IMSS obrero","−"+mx(n.imssO)],
          ["INFONAVIT", n.infona ? "−"+mx(n.infona) : "sin crédito"],
          ["Otros descuentos", n.otras ? "−"+mx(n.otras) : "—"],
          ["<b>Neto a dispersar</b>","<b>"+mx(n.net)+"</b>"]]) +
      `<div class="sect">IMSS</div>` +
      kv([["Estado",`<span class="tag ${IMSS_TAG[w.imss.est]||""}">${esc(w.imss.est)}</span>`]]
         .concat(w.imss.mov ? [["Movimiento",`<span class="mono">${esc(w.imss.mov)}</span>`],
                               ["Plazo", venc(w.imss.due)]] : [])
         .concat(w.imss.sbcNuevo ? [["SBC propuesto", mx(w.imss.sbcNuevo)]] : [])) +
      (w.imss.est !== "vigente"
        ? `<div class="note warn" style="margin-top:10px">El plazo de <b>cinco días hábiles</b> corre desde
           el hecho, no desde que Vencom se entera.</div>` : "") +
      (f ? `<div class="sect">FPL® · submayor del fondo</div>` +
        kv([["Estado",`<span class="tag ${st==="en regla"?"":"bad"}">${esc(st)}</span>`],
            ["Aportación",pct(f.rate,0)+" del sueldo"],
            ["Aportó el trabajador",mx(f.empYTD)],
            ["Aportó el patrón", (f.parity?"":"<span style='color:var(--danger)'>")+mx(f.erYTD)+(f.parity?"":"</span>")],
            ["Saldo",mx(f.bal)],
            ["Retiros del ejercicio",String(f.wd)+" de 2"],
            ["Tope de exención",mx(f.cap)+" <span class='tiny'>("+esc(f.capBy)+")</span>"]]) +
        (f.rej.length ? `<div class="sect">Intentos de retiro rechazados</div>` +
          f.rej.map(r=>`<div class="tl"><div class="when bad">${esc(fdauto(r.day))}</div>
            <div class="what"><b>${mx(r.amt)}</b><div class="tiny muted">${esc(r.why)}</div></div></div>`).join("")
          : "")
        : `<div class="sect">FPL®</div><div class="tiny muted">Sin submayor del fondo.</div>`) +
      (w.loan ? `<div class="sect">Préstamo</div>` +
        kv([["Folio",`<span class="mono">${esc(w.loan.id)}</span>`],["Saldo",mx(w.loan.out)],
            ["Amortización",mx(w.loan.per)+" por periodo"],["Estado",esc(w.loan.st)]]) : "")};
  }

  if(s.t==="client"){
    const c = cO(s.id); if(!c) return {kick:"", ttl:"—", body:""};
    const rs = D.runs.filter(r=>r.c===c.id && r.stage!=="cerrada");
    const ms = D.movs.filter(m=>m.c===c.id && !m.filed);
    const ob = D.obligations.filter(o=>o.c===c.id && o.st!=="hecho");
    const rc = D.recon.find(r=>r.c===c.id);
    return {kick:c.sector, ttl:c.n, body:
      kv([["Registro patronal",`<span class="mono">${esc(c.rp)}</span>`],
          ["Clase de riesgo",c.riskClass],["Prima RT",pct(c.primaRT,4)],
          ["Trabajadores",int(c.emp)],["Ubicación",esc(c.city)+", "+esc(c.state)],
          ["ISN",c.isn!=null?pct(c.isn,2):"—"],["Cliente desde",c.since]]) +
      `<button class="lnk" data-openficha="${esc(c.id)}" style="margin:2px 0 4px">Ver la ficha completa →</button>
       <div class="sect">Servicios contratados</div>
       ${c.svc.map(x=>`<span class="tag ${x==="fpl"?"accent":""}">${esc(x)}</span> `).join("")}
       <div class="sect">Abierto ahora</div>
       ${kv([["Corridas",int(rs.length)],["Movimientos IMSS",int(ms.length)],
             ["Obligaciones",int(ob.length)],
             ["Diferencias SUA/EMA",rc?int(rc.diffs.length):"—"]])}
       ${c.isn!==c.isnPrev?`<div class="note bad" style="margin-top:12px">La tasa de ISN de
         ${esc(c.state)} cambió de ${pct(c.isnPrev,2)} a ${pct(c.isn,2)} para 2026. ${esc(c.isnNote)}</div>`:""}`};
  }

  if(s.t==="run"){
    const r = D.runs.find(x=>x.id===s.id); if(!r) return {kick:"",ttl:"—",body:""};
    const late = r.stage==="timbrado" && r.timbreDue<=2;
    return {kick:cn(r.c)+" · "+r.cal, ttl:"Corrida "+r.id, body:
      kv([["Etapa",`<span class="tag">${esc(STAGE_L[r.stage])}</span>`],
          ["Trabajadores",int(r.emp)],["Días del periodo",r.days],
          ["Fecha de pago",fdate(r.payDay)],["Responsable",esc(sn(r.owner))]]) +
      `<div class="sect">Composición</div>` +
      kv([["Percepciones",mx(r.gross)],["ISR retenido","−"+mx(r.isr)],
          ["IMSS obrero","−"+mx(r.imssO)],["INFONAVIT","−"+mx(r.infona)],
          ["Otros descuentos","−"+mx(r.otras)],
          ["<b>Neto a dispersar</b>","<b>"+mx(r.net)+"</b>"]]) +
      `<div class="sect">Timbrado</div>` +
      kv([["Timbrados",int(r.timbrados)+" / "+int(r.emp)],
          ["Plazo",frel(r.timbreDue)]]) +
      `<div class="meter" style="margin-top:8px"><i style="width:${(r.timbrados/r.emp*100).toFixed(1)}%;background:${late?"var(--danger)":"var(--success)"}"></i></div>` +
      (r.stage==="incidencias"&&r.incAbiertas?`<div class="note warn" style="margin-top:12px">
        ${r.incAbiertas} incidencias sin capturar. Mientras no cierren, el cálculo no arranca —
        y la fecha de pago no se mueve.</div>`:"") +
      (late?`<div class="note bad" style="margin-top:12px">El CFDI de nómina debe timbrarse en la fecha de
        pago o dentro de los <b>tres días hábiles</b> siguientes. Faltan ${int(r.emp-r.timbrados)} recibos
        y el plazo ${r.timbreDue<0?"cerró":"cierra"} ${esc(frel(r.timbreDue))}.</div>`:"")};
  }

  if(s.t==="mov"){
    const m = D.movs.find(x=>x.id===s.id); if(!m) return {kick:"",ttl:"—",body:""};
    const risk = !m.filed && m.due<=2;
    return {kick:cn(m.c), ttl:m.emp, body:
      kv([["Movimiento",esc(MOV_L[m.t])],["NSS",`<span class="mono">${esc(m.nss)}</span>`],
          ["SBC",mx2(m.sbc)],["Fecha del hecho",fdate(m.ev)],
          ["Vence",m.filed?"—":fdate(m.due)],
          ["Presentado",m.filed?fdate(m.filedDay):"pendiente"],
          ["Lote IDSE",m.batch?`<span class="mono">${esc(m.batch)}</span>`:"—"],
          ["Responsable",esc(sn(m.owner))]]) +
      (risk?`<div class="note bad" style="margin-top:12px">${quedan(m.due)}. El plazo son
        <b>cinco días hábiles desde el hecho</b>; presentarlo tarde deja el SBC mal registrado y esa
        diferencia reaparece en la EMA del mes siguiente.</div>`
      : m.filed?`<div class="note" style="margin-top:12px">Presentado ${esc(frel(m.filedDay))},
        ${dias(m.filedDay-m.ev)} después del hecho.</div>`
      : `<div class="note warn" style="margin-top:12px">Dentro de plazo. Vence ${esc(frel(m.due))}.</div>`)};
  }

  if(s.t==="recon"){
    const r = D.recon.find(x=>x.c===s.id); if(!r) return {kick:"",ttl:"—",body:""};
    return {kick:"Conciliación · "+monthLabel(r.month), ttl:cn(r.c), body:
      kv([["SUA",mx(r.sua)],["EMA",mx(r.ema)],["Diferencia",mx(r.delta)],
          ["Renglones",int(r.diffs.length)]]) +
      `<div class="sect">Diferencias</div>` +
      (r.diffs.length ? r.diffs.map(d=>`<div style="padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:12px"><b>${esc(d.emp)}</b></div>
        <div class="tiny muted">${esc(d.k)}</div>
        <div class="mono tiny" style="margin-top:2px">${mx2(d.amt)}</div></div>`).join("")
        : `<p class="tiny muted">Cuadra sin diferencias.</p>`) +
      `<div class="note info" style="margin-top:12px">La EMA es la versión del IMSS de lo que se debe.
      Si no coincide con el SUA, el IMSS ya tiene una cifra distinta a la tuya — y desde 2026 el cruce
      entre SAT, IMSS e INFONAVIT es automático.</div>`};
  }

  if(s.t==="obl"){
    const o = D.obligations.find(x=>x.id===s.id); if(!o) return {kick:"",ttl:"—",body:""};
    return {kick:o.juris, ttl:o.l, body:
      kv([["Cliente",esc(o.c?cn(o.c):"Vencom")],["Vence",fdate(o.due)+" ("+frel(o.due)+")"],
          ["Estado",`<span class="tag ${o.st==="hecho"?"ok":o.st==="riesgo"?"bad":"warn"}">${esc(o.st)}</span>`],
          ["Responsable",esc(sn(o.owner))]]) +
      (o.law?`<div class="sect">Fundamento</div><p class="tiny">${esc(o.law)}</p>`:"") +
      `<div class="sect">Evidencia</div>
       <p class="tiny muted">El acuse, la línea de captura y el comprobante de pago se guardan aquí y
       quedan ligados a esta obligación. Es lo que se entrega cuando alguien pregunta, sin buscar en correos.</p>`};
  }

  if(s.t==="fund"){
    const f = D.fund.find(x=>x.id===s.id); if(!f) return {kick:"",ttl:"—",body:""};
    const over = f.empYTD > f.cap;
    return {kick:cn(f.c)+" · Fondo de ahorro", ttl:f.emp, body:
      kv([["Salario mensual",mx(f.salM)],["Aportación",pct(f.rate,0)+" cada parte"],
          ["Trabajador, año a la fecha",mx(f.empYTD)],
          ["Patrón, año a la fecha",mx(f.erYTD)],
          ["Saldo",mx(f.bal)],
          ["Retiros del año",f.wd+" de 2"]]) +
      `<div class="sect">Topes aplicables</div>` +
      kv([["13% del salario",mx2(f.cap13)],["1.3 UMA anuales",mx2(f.capUma)],
          ["<b>Rige</b>","<b>"+esc(f.capBy)+"</b>"],["Tope efectivo",mx2(f.cap)]]) +
      (f.req?`<div class="note bad" style="margin-top:12px"><b>Retiro rechazado.</b> Sería el tercero del
        año. El fondo queda fuera del SBC sólo si los retiros <b>no exceden dos al año</b>; el tercero
        integra la aportación patronal al salario base de cotización <b>de forma retroactiva</b>, con las
        cuotas de todo el ejercicio. El sistema no lo permite y deja registrado el intento.</div>
        <div class="note" style="margin-top:8px">Monto solicitado ${mx(f.reqAmt)}. Alternativa: préstamo
        personal contra el mismo saldo, que sí es descontable por nómina y no toca la exención.</div>`:"") +
      (!f.parity?`<div class="note bad" style="margin-top:12px"><b>Paridad rota</b> desde
        ${esc(fdate(f.breakDay))}. La aportación patronal va en ${pct(f.erYTD/f.empYTD*100,0)} de la del
        trabajador. La exclusión del SBC exige que sean <b>iguales</b> y con la <b>misma periodicidad</b>.
        Diferencia a regularizar: ${mx(f.empYTD-f.erYTD)}.</div>`:"") +
      (over?`<div class="note warn" style="margin-top:12px">Excedente de ${mx(f.empYTD-f.cap)} sobre el
        tope. Esa parte es <b>gravada para el trabajador y no deducible para el patrón</b>.</div>`:"") +
      (!f.req && f.parity && !over ? `<div class="note" style="margin-top:12px">En regla: paridad 1:1,
        misma periodicidad, ${f.wd} retiro(s) de 2, dentro del tope.</div>`:"")};
  }

  if(s.t==="loan"){
    const l = D.loans.find(x=>x.id===s.id); if(!l) return {kick:"",ttl:"—",body:""};
    return {kick:cn(l.c)+" · Préstamo personal", ttl:l.emp, body:
      kv([["Capital",mx(l.cap)],["Tasa",pct(l.rate,0)+" anual"],["Plazo",l.term+" periodos"],
          ["Pagadas",l.paid],["Descuento por periodo",mx(l.per)],["Saldo",mx(l.out)],
          ["Otorgado",fdate(l.openDay)]]) +
      (l.st==="baja"?`<div class="note bad" style="margin-top:12px"><b>Trabajador dado de baja
        ${esc(frel(l.bajaDay))} con saldo vivo.</b> El saldo de ${mx(l.out)} se cruza contra un finiquito
        estimado de ${mx(l.finiquito)}. ${l.out>l.finiquito
          ? "El finiquito <b>no alcanza</b>: faltan "+mx(l.out-l.finiquito)+" y hay que decidir si se cobra por otra vía o se castiga."
          : "El finiquito alcanza; queda un remanente de "+mx(l.finiquito-l.out)+" a favor del trabajador."}</div>`
      :`<div class="note" style="margin-top:12px">El descuento se inyecta en cada corrida del cliente.
        La prelación va después de pensión alimenticia y crédito INFONAVIT — si el neto no alcanza,
        el sistema abre una excepción en vez de descontar de más.</div>`)};
  }

  if(s.t==="claim"){
    const c = D.claims.find(x=>x.id===s.id); if(!c) return {kick:"",ttl:"—",body:""};
    return {kick:cn(c.c)+" · "+c.kl, ttl:c.emp, body:
      kv([["Ramo",esc(c.kl)],["Monto",mx(c.amt)],["Abierto",fdate(c.open)],
          ["Días abierto",c.days],["Estado",`<span class="tag ${c.st==="pagado"?"ok":"warn"}">${esc(c.st)}</span>`],
          ["Responsable",esc(sn(c.owner))]]) +
      (c.days>45&&c.st!=="pagado"?`<div class="note bad" style="margin-top:12px">${c.days} días abierto
        y detenido en documentos. Un siniestro estancado no lo reclama la aseguradora: lo reclama la
        familia del trabajador, al cliente, por teléfono.</div>`:"")};
  }

  if(s.t==="act"){
    const a = D.act.find(x=>x.c===s.id); if(!a) return {kick:"",ttl:"—",body:""};
    return {kick:"Estudio actuarial", ttl:cn(a.c), body:
      kv([["Tipo",esc(a.t)],["Etapa",`<span class="tag">${esc(a.st)}</span>`],
          ["Censo",a.censo?"validado":"pendiente"],
          ["Actuario",esc(sn(a.actuary))],
          ["Obligación",mx(a.obl)],["Activos del plan",mx(a.activos)],
          ["Déficit",mx(a.deficit)],["CONSAR",esc(a.consar)],["Entrega",fdate(a.due)]]) +
      (!a.censo?`<div class="note bad" style="margin-top:12px">El estudio no avanza sin censo completo:
        fechas de ingreso, salarios y beneficiarios. Se comprometió entrega para ${esc(fdate(a.due))}
        y la solicitud lleva pendiente desde hace semanas. El sistema no deja marcar "en valuación"
        mientras el censo no se valide — así el retraso queda del lado del cliente, con fecha.</div>`
      :`<div class="note info" style="margin-top:12px">El expediente guarda el texto del plan, el censo
        con el que se valuó y la valuación firmada. Es lo que pide CONSAR en la actualización anual por SIREPP.</div>`)};
  }

  if(s.t==="imp"){
    const i = D.implants.find(x=>x.id===s.id); if(!i) return {kick:"",ttl:"—",body:""};
    return {kick:cn(i.c)+" · In House", ttl:i.n, body:
      kv([["Función",esc(i.role)],["En sitio desde",fdatey(i.since)],
          ["Asistencia",pct(i.att)],
          ["Estado",i.state==="activo"?"en sitio":"ausente"],
          ["Relevo",i.backfill?esc(sn(i.backfill)):"—"]]) +
      (i.state==="ausente" && !i.backfill?`<div class="note bad" style="margin-top:12px">Sin relevo asignado.
        La función de <b>${esc(i.role)}</b> lleva ${dias(-(i.absentDay)+1)} descubierta dentro del cliente.
        Este es el hueco que hoy sólo se detecta cuando el cliente llama a quejarse.</div>`
      : i.state==="ausente"?`<div class="note warn" style="margin-top:12px">Cubierto por
        ${esc(sn(i.backfill))}. La cobertura queda registrada para el reporte mensual al cliente.</div>`
      : `<div class="note" style="margin-top:12px">Asistencia y cobertura se reportan al cliente cada mes
        con el mismo dato que usa Vencom internamente.</div>`)};
  }

  if(s.t==="req"){
    const r = D.reqs.find(x=>x.id===s.id); if(!r) return {kick:"",ttl:"—",body:""};
    const st = D.funnelStages;
    const top = r.stg[st[0]] || 1;
    return {kick:cn(r.c)+" · Requisición", ttl:r.role, body:
      kv([["Vacantes",int(r.vac)],["Abierta desde",fdate(r.open)],
          ["Días abierta",(-r.open)+" d"],["SLA comprometido",r.sla+" d"],
          ["Responsable",esc(sn(r.owner))]]) +
      `<div class="sect">Embudo</div>` +
      st.map(x=>`<div style="display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;font-size:12px;padding:2px 0">
        <div><div class="tiny">${esc(x[0].toUpperCase()+x.slice(1))}</div>
        <div class="bar"><i style="width:${(r.stg[x]/top*100).toFixed(1)}%"></i></div></div>
        <div class="mono right">${int(r.stg[x])}</div></div>`).join("") +
      (-r.open > r.sla
        ? `<div class="note bad" style="margin-top:12px">Lleva ${-r.open} días abierta contra un SLA de
           ${r.sla}. El filtro de gabinete pasa ${pct(r.stg["filtro"]/top*100,0)} de los postulados —
           el problema está en el origen, no en la entrevista.</div>`
        : `<div class="note" style="margin-top:12px">Dentro del SLA de ${r.sla} días. Cada colocación
           que salga de aquí abre su propia garantía de un mes.</div>`)};
  }

  if(s.t==="plc"){
    const p = D.placements.find(x=>x.id===s.id); if(!p) return {kick:"",ttl:"—",body:""};
    return {kick:cn(p.c)+" · Colocación", ttl:p.n, body:
      kv([["Puesto",esc(p.role)],["Colocado",fdate(p.day)],
          ["Garantía vence",fdate(p.guaranteeEnds)],
          ["Estado",esc(p.state)]]) +
      (p.state!=="activo"?`<div class="note bad" style="margin-top:12px">Renunció ${esc(frel(p.quitDay))},
        dentro de la garantía de un mes. Quedan <b>${dias(p.guaranteeEnds)}</b> para reponer la posición sin
        costo para el cliente. Después de esa fecha, reponerla es una venta nueva.</div>`
      :`<div class="note" style="margin-top:12px">Garantía de un mes vigente. El reloj corre desde la
        fecha de colocación, no desde la firma del contrato.</div>`)};
  }

  if(s.t==="lead"){
    const P = D.prospect;
    const l = P.leads.find(x=>x.id===s.id); if(!l) return {kick:"",ttl:"—",body:""};
    const h = P.handoffs.find(x=>x.lead===l.id);
    const w = P.won.find(x=>x.lead===l.id);
    return {kick:l.state+" · "+l.src, ttl:l.n, body:
      kv([["Giro",esc(l.scianN)],["SCIAN",`<span class="mono">${esc(l.scian)}</span>`],
          ["Estrato de personal",esc(l.estrato)],["Plantilla estimada",int(l.emp)],
          ["Hallada",fdate(l.found)+" ("+frel(l.found)+")"]]) +
      `<div class="sect">Por qué tiene ${l.fit} de ajuste</div>` +
      l.why.map(([k,v])=>`<div style="display:grid;grid-template-columns:78px 1fr;gap:9px;padding:4px 0;border-bottom:1px solid var(--border)">
        <span class="klabel">${esc(k)}</span><span class="tiny">${esc(v)}</span></div>`).join("") +
      `<div class="meter" style="margin-top:9px"><i style="width:${l.fit}%;background:${l.fit>=80?"var(--success)":l.fit>=62?"var(--accent)":"var(--border-strong)"}"></i></div>
       <div class="tiny muted" style="margin-top:4px">Piso de entrega: 62</div>` +
      `<div class="sect">Motivo del contacto</div><p class="tiny">${esc(l.hook)}</p>` +
      `<div class="sect">Qué pasó</div>` +
      kv([["Entregada",l.delivered?"sí":"no — bajo el piso"],
          ["Mensajes",l.touches?int(l.touches)+" de 3":"—"],
          ["Contactada",l.contactedDay!==null?fdate(l.contactedDay):"—"],
          ["Respondió",l.replyDay!==null?frel(l.replyDay):"—"],
          ["Intención",l.intent?INTENT_L[l.intent]:"—"],
          ["Ejecutivo",h?esc(repN(h.rep)):"—"],
          ["Respondió en",h?h.resp+" d":"—"]]) +
      (h && !h.sla ? `<div class="note bad" style="margin-top:12px">La entrega salió del SLA de cinco días
        hábiles: se aceptó <b>por omisión</b>. El prospecto ya había levantado la mano y esperó ${h.resp} días.</div>` : "") +
      (w ? `<div class="note" style="margin-top:12px"><b>Firmó el ${esc(fdate(w.day))}.</b>
        ${int(w.emp)} trabajadores a ${mx(w.tarifa)} por trabajador al mes = <b>${mx(w.mensual)} mensuales</b>,
        ${mx(w.anual)} anualizados. Ciclo de ${w.ciclo} días desde que la búsqueda la encontró.</div>` : "") +
      (!l.hasEmail && !l.hasPhone ? `<div class="note warn" style="margin-top:12px">Sin dato de contacto.
        Se encontró la empresa pero no a quién escribirle — es exactamente la brecha entre DENUE y Places.</div>` : "")};
  }

  if(s.t==="src"){
    const P = D.prospect;
    const a = P.adapters.find(x=>x.k===s.id); if(!a) return {kick:"",ttl:"—",body:""};
    const rs = P.runs.filter(r=>r.src===a.k);
    const won = P.won.filter(w=>w.src===a.k);
    return {kick:"Fuente de datos", ttl:a.n, body:
      kv([["Halladas, 90 días",int(a.found)],["Con dato de contacto",int(a.contact)],
          ["Rendimiento",pct(a.yield,0)],["Calificadas",int(a.qual)],
          ["Corridas",int(rs.length)],
          ["Costo",a.cost?usd(a.cost):"gratis"],
          ["Costo por calificada",a.cost?usd(a.cpl,3):"—"],
          ["<b>Clientes firmados</b>","<b>"+won.length+"</b>"],
          ["Facturación mensual",mx(won.reduce((x,w)=>x+w.mensual,0))]]) +
      `<div class="sect">Qué es</div><p class="tiny">${esc(a.note)}</p>` +
      (a.k==="denue" ? `<div class="note" style="margin-top:12px">Es el registro oficial del INEGI:
        más de cinco millones de establecimientos, sin costo por consulta, y con el filtro que le sirve a un
        despacho de nómina — <b>código SCIAN y estrato de personal ocupado</b>. Se actualiza dos veces al año.</div>`
      : a.k==="places" ? `<div class="note bad" style="margin-top:12px">Encontró más empresas que cualquier otra
        fuente y <b>firmó cero</b>. No es un fallo del mensaje: en una ficha de negocio aparece quien atiende al
        público, no quien autoriza la nómina.</div>`
      : `<div class="note warn" style="margin-top:12px">La única que devuelve <b>una persona con puesto</b>,
        y por eso convierte. Se paga por asiento y por crédito, así que el consumo hay que vigilarlo:
        aquí es la fuente más cara por calificada.</div>`)};
  }

  if(s.t==="won"){
    const P = D.prospect;
    const w = P.won.find(x=>x.lead===s.id); if(!w) return {kick:"",ttl:"—",body:""};
    const l = P.leads.find(x=>x.id===w.lead);
    const SVC = {nom:"Nómina", inh:"In House", fpl:"FPL®", act:"Actuaría", tal:"Talento"};
    return {kick:"Cliente firmado", ttl:w.n, body:
      kv([["Fuente",esc(w.src)],["Hallada",l?fdate(l.found):"—"],["Firmada",fdate(w.day)],
          ["Ciclo",w.ciclo+" días"],
          ["Trabajadores",int(w.emp)],["Tarifa",mx(w.tarifa)+" por trabajador/mes"],
          ["<b>Mensual</b>","<b>"+mx(w.mensual)+"</b>"],["Anualizado",mx(w.anual)],
          ["Ejecutivo",esc(repN(w.rep))],
          ["Base de comisión",mx(comBase(w))+" <span class='tiny'>("+esc(filt.base==="factura"?"lo facturado":"nómina administrada")+")</span>"],
          ["<b>Comisión mensual</b>","<b>"+mx(comMes(w))+"</b> <span class='tiny'>"+pct(D.prospect.comision.pct,0)+"</span>"],
          ["Acumulado",mx(comMes(w)*w.meses)+" <span class='tiny'>en "+dias(w.meses*30)+"</span>"]]) +
      `<div class="sect">Servicios contratados</div>
       ${w.servicios.map(x=>`<span class="tag ${x==="fpl"?"accent":""}">${esc(SVC[x]||x)}</span> `).join("")}` +
      `<div class="note" style="margin-top:12px">La cadena está completa: la corrida del
       ${l?esc(fdate(l.found)):"—"} la encontró, el motivo fue “${l?esc(l.hook):"—"}”, la atendió
       ${esc(repN(w.rep))} y hoy factura ${mx(w.mensual)} al mes. <b>Sin esa cadena no se puede decir qué
       fuente sirve</b> — sólo cuántos correos se mandaron.</div>`};
  }

  if(s.t==="pnote"){
    const P = D.prospect;
    if(s.id==="secuencias") return {kick:"Secuencias", ttl:"Tres mensajes y se acaba", body:
      `<p class="tiny">Un despacho no puede permitirse que su dominio quede marcado como spam: lo usa para
      mandar recibos de nómina. Por eso el tope es bajo a propósito — 3 mensajes por empresa, 1 por dominio
      cada 90 días, 80 envíos al día.</p>
      <div class="sect">Lo que el modelo no dice</div>
      <p class="tiny">Precio, fechas de arranque, opiniones fiscales y comparaciones con otro despacho.
      Si el borrador se acerca a una de esas cuatro, se detiene y espera a una persona. Hay
      ${P.boundaryHolds.length} detenidos ahora mismo.</p>
      <div class="note warn" style="margin-top:12px">Un rebote arriba de 2% arruina la entregabilidad de
      <b>todo el despacho</b>, no sólo de la campaña. El calentamiento de 14 días no es cosmético.</div>`};
    if(s.id==="cumplimiento") return {kick:"Cumplimiento", ttl:"Lo que sí tiene exposición", body:
      `<p class="tiny">La LFPDPPP de marzo de 2025 hace viable el contacto en frío en México: el consentimiento
      tácito es válido si el aviso de privacidad está disponible y la persona no se opone.</p>
      <p class="tiny">La parte con exposición real no es el envío, es <b>ARCO</b>. Ser negligente al atender
      una solicitud de acceso, rectificación, cancelación u oposición es en sí misma una infracción — por eso
      es una bandeja con acuse y reloj, no un correo que alguien revisa cuando puede.</p>
      <div class="sect">Estado</div>
      <p class="tiny">${P.ledger.arcoAtendidas} de ${P.ledger.arcoSolicitudes} solicitudes atendidas,
      ${P.ledger.arcoDiasProm} días en promedio. Aviso ${esc(P.ledger.avisoVersion)} vigente desde
      ${esc(fdatey(P.ledger.avisoDesde))}.</p>`};
    if(s.id==="fuentes") return {kick:"Fuentes", ttl:"Por qué DENUE cambia el embudo", body:
      `<p class="tiny">Selecciona una fuente en la tabla para ver su detalle.</p>
      <p class="tiny">El INEGI publica el DENUE con más de cinco millones de establecimientos, gratis, y
      devuelve teléfono, correo y sitio <b>directamente</b>. Se filtra por código SCIAN y por estrato de
      personal ocupado — giro y tamaño de plantilla, que es exactamente como se define un cliente de nómina.</p>`};
    return {kick:"Prospección", ttl:"De la operación a la venta", body:
      `<p class="tiny">Vencom ya sabe qué hace bueno a un cliente: giro, tamaño de plantilla, estado,
      complejidad del calendario. Eso es un perfil, y un perfil se puede buscar.</p>
      <p class="tiny">Los ${P.won.length} clientes firmados en 90 días suman ${mx(wonValue())} anualizados

  if(s.t==="rnote"){

      `<p class="tiny">Una cartera de ${F.clients} clientes donde los tres más grandes son
      ${pct(D.clients.slice().sort((a,b)=>b.emp-a.emp).slice(0,3).reduce((a,c)=>a+c.emp,0)/F.employees*100,0)}
      de la plantilla administrada tiene un riesgo de concentración que no se ve en el estado de resultados.</p>
      <p class="tiny">Los contratos municipales y de gobierno se renuevan con el ciclo de la administración.
      Vale la pena que ese porcentaje esté a la vista todo el tiempo, no una vez al año.</p>`};
    return {kick:"Reportes", ttl:"Carga real, no percibida", body:
      `<p class="tiny">El pico de fin de mes se explica solo: los calendarios semanales generan cuatro
      veces más corridas que los mensuales con la misma plantilla, y todos caen en la misma semana.</p>
      <p class="tiny">Con la carga a la vista se puede mover un cliente de analista antes del cierre,
      en vez de descubrirlo el día 30.</p>`};
  }

  if(s.t==="anote"){
    const map = {
      /* El encabezado y el texto se derivan de la MISMA tabla. Cuando estaban
         escritos a mano, el panel decía "cinco cambios" y la pantalla enseñaba
         tres, porque dos de los estados no estaban cargados. */
      isn: ["ISN", isnChanged().length + " de " + D.params.isn.length + " regímenes cambiaron para 2026",
        `<p class="tiny">El impuesto sobre nóminas es estatal: tasa propia, calendario propio y forma
        propia. Movieron su tasa para 2026 — ${listOf(isnChanged().map(x=>esc(x.edo)))}.</p>
        <p class="tiny">Guardar la tasa con su fecha de vigencia es lo que permite recalcular un periodo
        anterior sin volver a capturar nada.</p>`],
      ceav: ["CEAV", "La cuota que sube todos los años",
        `<p class="tiny">La reforma de pensiones de 2020 lleva la cuota patronal de cesantía y vejez
        de forma escalonada hasta <b>11.875% en 2030</b> para los salarios más altos.</p>
        <p class="tiny">Es la presión de costo más concreta que tiene hoy cualquier patrón en México,
        y el punto de partida natural de una conversación comercial.</p>`],
      topes: ["Topes", "Todo cuelga de la UMA",
        `<p class="tiny">Fondo de ahorro, vales, aguinaldo, prima vacacional y PTU tienen su exención
        definida en UMA. Si la UMA es un parámetro, cambia un renglón en febrero; si está escrita en el
        código, es un proyecto.</p>
        <p class="tiny">El fondo de ahorro además tiene <b>dos topes simultáneos</b> —13% del salario y
        1.3 UMA anuales— y rige el menor, por trabajador.</p>`],
      ley: ["Jornada", "48 a 40 horas, por escalones",
        `<p class="tiny">La reforma constitucional se publicó el 3 de marzo de 2026: 2026 es año de
        preparación con 48 horas, y baja a 46, 44, 42 y 40 hasta 2030.</p>
        <p class="tiny">Para los clientes con planta operativa esto es un rediseño de turnos con
        años de anticipación, no un ajuste de nómina. Es una conversación de asesoría, que es
        justo lo que Vencom vende.</p>`],
    };
    const m = map[s.id] || map.isn;
    return {kick:m[0], ttl:m[1], body:m[2]};
  }

  return {kick:"", ttl:"—", body:""};
}

let tourN = -1;               /* -1 = apagado */

const tourOn = () => tourN >= 0;
const TOURS = isPros ? TOUR_P : TOUR;
window.__TOURLEN__ = TOURS.length;

function tourGoto(step){
  const a = step.at || {};
  if(a.rango) rango = a.rango;
  if(a.tab) Object.assign(tab, a.tab);
  if(a.ftab) ftab = a.ftab;
  if(a.client){ cliFocus = a.client; sel = {t:"client", id:a.client}; }
  if(a.screen) screen = a.screen;
  if(!a.client && a.ib == null && a.worker == null && a.inc == null) sel = null;
  showAll = {};
  paintRail(); paintCtx(); paintBody();
  /* algunos pasos necesitan que ya exista la tabla para elegir un renglón */
  if(a.ib != null){
    const el = document.querySelectorAll(".wbody [data-ib]")[a.ib];
    if(el){ const [k,id] = el.dataset.ib.split(":");
      sel = {t:({mov:"mov",run:"run",fund:"fund",obl:"obl",imp:"imp",plc:"plc",
                 loan:"loan",act:"act",claim:"claim"})[k] || "mov", id}; }
  }
  if(a.inc != null){
    const el = document.querySelectorAll(".wbody tr[data-inc]")[a.inc];
    if(el) sel = {t:"inc", id: el.dataset.inc};
  }
  if(a.worker != null){
    const el = document.querySelectorAll(".wbody tr[data-worker]")[a.worker];
    if(el) sel = {t:"worker", id:el.dataset.worker};
  }
  paintBody(); paintInsp(); paintCtx();
}

function tourStart(n){
  tourN = typeof n === "number" ? n : 0;
  document.body.classList.add("touring");
  tourRender();
}
function tourEnd(){
  tourN = -1;
  document.body.classList.remove("touring");
  const l = $("#tourlayer"); if(l) l.remove();
  paint();
}
function tourStep(d){
  const n = tourN + d;
  if(n < 0) return;
  if(n >= TOURS.length) return tourEnd();
  tourN = n; tourRender();
}

function tourRender(){
  const step = TOURS[tourN];
  /* expuesto para la verificación: qué paso es y qué objetivo dice buscar */
  window.__TOURN__ = tourN; window.__TOURTARGET__ = step.target || null;
  tourGoto(step);
  let layer = $("#tourlayer");
  if(!layer){
    layer = document.createElement("div");
    layer.id = "tourlayer";
    document.body.appendChild(layer);
  }
  const el = step.target ? $(step.target) : null;
  if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest", inline:"nearest"});

  const r = el ? el.getBoundingClientRect() : null;
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  const useHole = !!(r && r.width > 4 && r.height > 4 && r.bottom > 0 && r.top < vh);
  const P = 6;
  const hole = useHole ? {
    x: Math.max(2, r.left - P), y: Math.max(2, r.top - P),
    w: Math.min(vw - 4, r.width + P*2), h: Math.min(vh - 4, r.height + P*2)
  } : null;

  const narrow = vw <= 760;
  const CW = Math.min(400, vw - 28);
  let cx = 0, cy = 0, ch = 240;
  if(!narrow && hole){
    /* debajo del foco si cabe; si no, encima; si el foco es muy alto, a un lado */
    const below = vh - (hole.y + hole.h) - 18;
    const above = hole.y - 18;
    if(hole.h > vh * 0.6){
      cx = hole.x > vw / 2 ? Math.max(14, hole.x - CW - 16) : Math.min(vw - CW - 14, hole.x + hole.w + 16);
      cy = Math.max(14, Math.min(vh - ch - 14, hole.y + 10));
    } else if(below >= 170){
      cx = Math.max(14, Math.min(vw - CW - 14, hole.x + hole.w/2 - CW/2));
      cy = hole.y + hole.h + 14;
    } else if(above >= 170){
      cx = Math.max(14, Math.min(vw - CW - 14, hole.x + hole.w/2 - CW/2));
      cy = Math.max(14, hole.y - ch - 14);
    } else {
      cx = Math.max(14, Math.min(vw - CW - 14, hole.x + hole.w/2 - CW/2));
      cy = Math.max(14, vh - ch - 20);
    }
  } else if(!narrow){
    cx = vw/2 - CW/2; cy = Math.max(20, vh/2 - ch/2);
  }

  const dots = TOURS.map((_,i)=>`<span class="d ${i===tourN?"on":i<tourN?"was":""}"></span>`).join("");
  layer.innerHTML = `
    <div class="tourback ${useHole?"":"solid"}"></div>
    ${useHole?`<div class="tourhole" style="left:${hole.x}px;top:${hole.y}px;width:${hole.w}px;height:${hole.h}px"></div>`:""}
    <div class="tourcard ${narrow?"sheet":""}" id="tourcard" role="dialog" aria-modal="true" aria-label="Recorrido guiado"
         ${narrow?"":`style="left:${Math.round(cx)}px;top:${Math.round(cy)}px;width:${CW}px"`}>
      <div class="th">
        <span class="n">Paso ${tourN+1} de ${TOURS.length}</span>
        <button class="tx" data-tour="end" aria-label="Salir del recorrido">Salir</button>
      </div>
      <h4>${step.t}</h4>
      <p>${step.b}</p>
      ${step.say?`<p class="say">“${esc(step.say)}”</p>`:""}
      <div class="tf">
        <div class="dots">${dots}</div>
        <button class="pill" data-tour="prev" ${tourN===0?"disabled":""}>Atrás</button>
        <button class="pill on" data-tour="next">${tourN===TOURS.length-1?"Terminar":"Siguiente"}</button>
      </div>
    </div>`;

  /* La altura de la tarjeta no se puede adivinar: depende del texto del paso.
     Se coloca a ojo y DESPUÉS se mide y se corrige, que es la única forma de
     garantizar que ningún paso deje los botones fuera de la pantalla. */
  if(!narrow){
    const card = $("#tourcard");
    if(card){
      const h = card.getBoundingClientRect().height;
      let top = parseFloat(card.style.top) || 0;
      if(h > vh - 24){ card.style.maxHeight = (vh - 24) + "px"; card.style.overflowY = "auto"; top = 12; }
      else if(top + h > vh - 12){
        /* si abajo no cabe, se intenta encima del foco antes de pegarla al borde */
        const arriba = hole ? hole.y - h - 14 : -1;
        top = arriba >= 12 ? arriba : Math.max(12, vh - h - 12);
      }
      if(top < 12) top = 12;
      card.style.top = Math.round(top) + "px";
    }
  }
}

document.addEventListener("keydown", e=>{
  if(!tourOn()) return;
  if(e.key === "Escape"){ e.preventDefault(); tourEnd(); }
  else if(e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); tourStep(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); tourStep(-1); }
});
window.addEventListener("resize", ()=>{ if(tourOn()) tourRender(); });

/* ══════════════════════════ render ══════════════════════════ */
const BADGE = {hoy:true, imss:true, fpl:true, obligaciones:true};
/* segunda línea del tooltip: dice de quién es cada pantalla */
const RAILNOTE = {cartera:"sus clientes, uno por uno", talento:"su propia gente",
                  ajustes:"tasas y topes vigentes", prospeccion:"la opera Telaia · sólo lectura"};

function paintRail(){
  $("#rail").innerHTML = `
    <div class="mark" title="Grupo Vencom">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-label="Grupo Vencom">
        <path d="M4 7.5 10.2 21 16.4 7.5" stroke="#FFFFFF" stroke-width="3.1"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26 10.4a6.6 6.6 0 1 0 0 8.2" stroke="#00BFD8" stroke-width="3.1"
              stroke-linecap="round" fill="none"/>
      </svg></div>
    ${navKeys().map(k=>`${NAVGROUP[k]?`<div class="rsep" role="separator" aria-label="${esc(NAVGROUP[k])}"></div>`:""}<button class="rbtn ${screen===k?"on":""}" data-nav="${k}" aria-label="${esc(NAV[k])}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>
      ${BADGE[k]?'<span class="dot"></span>':""}<span class="tip">${esc(NAV[k])}${RAILNOTE[k]?`<span class="sub">${esc(RAILNOTE[k])}</span>`:""}</span></button>`).join("")}
    <div class="spacer"></div>
    <button class="rbtn ${panelOff?"":"on2"}" id="inspbtn" aria-pressed="${panelOff?"false":"true"}" aria-label="Panel de detalle">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M15 3v18"/><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
      <span class="tip">${panelOff?"Mostrar panel de detalle":"Ocultar panel de detalle"}</span></button>`;
}
/* El recorte de cartera se aplica en la fuente, no en cada pantalla: si un
   perfil no tiene un cliente, ese cliente no aparece en ninguna vista. */
function roleClients(list){
  const c = R().cli;
  return c ? list.filter(x => c.indexOf(x.id || x.c) >= 0) : list;
}
function applyRole(){
  const c = R().cli;
  if(!c){ D = D0; F = D0.facts; return; }
  const keep = x => c.indexOf(x.c) >= 0;
  const crm = {}; c.forEach(id => { if(D0.crm[id]) crm[id] = D0.crm[id]; });
  const cls = D0.clients.filter(x => c.indexOf(x.id) >= 0);
  D = Object.assign({}, D0, {
    clients: cls, crm: crm,
    runs: D0.runs.filter(keep), movs: D0.movs.filter(keep),
    recon: (D0.recon||[]).filter(keep), obligations: D0.obligations.filter(o=>!o.c || keep(o)),
    fund: D0.fund.filter(keep), loans: D0.loans.filter(keep), claims: D0.claims.filter(keep),
    census: (D0.census||[]).filter(keep), act: D0.act.filter(keep),
    implants: D0.implants.filter(keep), reqs: D0.reqs.filter(keep),
    placements: D0.placements.filter(keep), workers: (D0.workers||[]).filter(keep),
    policies: (D0.policies||[]).filter(keep), proy: (D0.proy||[]).filter(keep),
    caja: (D0.caja||[]).filter(keep), reaseguro: (D0.reaseguro||[]).filter(keep),
  });
  F = Object.assign({}, D0.facts, {
    clients: cls.length,
    employees: cls.reduce((a,x)=>a+x.emp, 0),
    states: new Set(cls.map(x=>x.state)).size,
    calendars: cls.reduce((a,x)=>a+x.cal.length, 0),
  });
}

function paintCtx(){
  const ins = INSTR[screen]();
  $("#ctx").innerHTML = `
    <div class="crumb"><span class="tenant">${esc(D.tenant.short)}</span><span class="scr">${esc(NAV[screen])}</span></div>
    <div class="instr">${ins.map(([k,v,c])=>`<div class="ins ${c||""}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`).join("")}</div>
    ${isPros ? "" : `<div class="rolepick">
      <span class="rl">Perfil</span>
      <select class="rsel" data-pick="role" aria-label="Cambiar de perfil">
        ${Object.keys(ROLES).map(k=>`<option value="${k}" ${role===k?"selected":""}>${esc(ROLES[k].n)} — ${esc(ROLES[k].role)}</option>`).join("")}
      </select></div>`}
    <button class="tourbtn" data-tour="start" aria-label="Abrir el recorrido guiado">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3Z"/></svg>
      Recorrido</button>`;
}
function roleBanner(){
  if(role === "dueno") return "";
  const r = R();
  return `<div class="rolebar"><span class="badge">${esc(r.role)}</span>
    <div><b>${esc(r.n)}</b> — ${esc(r.nota)}</div></div>`;
}
function paintBody(){ window.__TRUNC__ = 0; const el = $("#body");
  el.innerHTML = roleBanner() + SC[screen](); el.scrollTop = 0; }
function paintInsp(){
  const i = inspector();
  $("#insp").innerHTML = `
    <div class="insphd">
      <button class="inspx" id="inspclose" aria-label="Cerrar panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="kick">${esc(i.kick)}</div><div class="ttl">${esc(i.ttl)}</div></div>
    <div class="inspbody">${i.body}</div>
    <div class="inspft"><span class="fdot"></span>Datos de ejemplo · clientes ficticios<span style="margin-left:auto;opacity:.75">prototipo · Telaia</span></div>`;
}
function paint(){ paintRail(); paintCtx(); paintBody(); paintInsp(); }

const isNarrow = () => window.innerWidth <= 1080;
let panelOff = false;          // desktop only: the panel is collapsed

function go(k){ if(screen===k) return; screen = k; sel = null; paint(); closeDrawer(); }
function select(t,id){ if(!id) return; sel = {t:t, id:id};
  if(t === "client") cliFocus = id;
  if(!isNarrow()) setPanel(true);          // selecting always brings the panel back
  paintBody(); paintInsp(); paintCtx(); openDrawer(); }
function openDrawer(){ if(isNarrow()){ $("#insp").classList.add("open"); $("#back").classList.add("on"); } }
function closeDrawer(){ $("#insp").classList.remove("open"); $("#back").classList.remove("on"); }
function setPanel(on){ panelOff = !on; document.querySelector(".wall").classList.toggle("nopanel", panelOff); paintRail(); }
/* one button, two behaviours: a drawer on narrow screens, a collapse on wide ones */
function togglePanel(){ if(isNarrow()){
    const open = $("#insp").classList.contains("open");
    return open ? closeDrawer() : openDrawer();
  } setPanel(panelOff); }

document.addEventListener("click", e=>{
  const tb2 = e.target.closest("[data-tour]");
  if(tb2){
    const v = tb2.dataset.tour;
    if(v === "end") return tourEnd();
    if(v === "start") return tourStart(0);
    return tourStep(v === "next" ? 1 : -1);
  }
  /* con el recorrido abierto, el resto de la interfaz no responde: el paso manda */
  if(tourOn()) return;
  const nav = e.target.closest("[data-nav]"); if(nav) return go(nav.dataset.nav);
  if(e.target.closest("#inspbtn")) return togglePanel();
  if(e.target.closest("#inspclose")) return isNarrow() ? closeDrawer() : setPanel(false);
  if(e.target.closest("#back")) return closeDrawer();
  const tb = e.target.closest("[data-tab]");
  if(tb){ tab[tb.dataset.tab] = tb.dataset.v; sel = null; showAll = {}; paintBody(); paintCtx(); paintInsp(); return; }
  if(e.target.closest("[data-more]")){ showAll[moreKey()] = true; paintBody(); return; }
  const of = e.target.closest("[data-openficha]");
  if(of){ cliFocus = of.dataset.openficha; sel = {t:"client", id: of.dataset.openficha}; tab.cartera = "ficha";
          screen = "cartera"; paint(); closeDrawer(); return; }
  const gt = e.target.closest("[data-goto]");
  if(gt){ return go(gt.dataset.goto); }
  const lb = e.target.closest('[data-act="leader"]');
  if(lb){ verTodos = !verTodos; paintBody(); return; }
  const an = e.target.closest('[data-act="addnote"]');
  if(an){ return addNote(); }
  const ft = e.target.closest("[data-ft]");
  if(ft){ ftab = ft.dataset.ft; showAll = {}; paintBody(); paintCtx(); return; }
  const rg = e.target.closest("[data-r]");
  if(rg){ rango = rg.dataset.r; sel = null; showAll = {}; paintBody(); paintCtx(); paintInsp(); return; }
  const fl = e.target.closest("[data-f]");
  if(fl){ filt[fl.dataset.f] = fl.dataset.v; sel = null; showAll = {}; paintBody(); paintCtx(); paintInsp(); return; }
  const ib = e.target.closest("[data-ib]");
  if(ib){ const [k,id] = ib.dataset.ib.split(":");
    const map = {mov:"mov",run:"run",fund:"fund",obl:"obl",imp:"imp",plc:"plc",loan:"loan",act:"act",claim:"claim"};
    return select(map[k]||"mov", id); }
  const pairs = [["client","client"],["run","run"],["mov","mov"],["recon","recon"],["obl","obl"],
                 ["fund","fund"],["loan","loan"],["claim","claim"],["act","act"],["imp","imp"],
                 ["req","req"],["plc","plc"],["lead","lead"],["src","src"],["won","won"],
                 ["worker","worker"],["pol","pol"],["inc","inc"]];
  for(const [attr,type] of pairs){
    const el = e.target.closest("[data-"+attr+"]");
    if(el) return select(type, el.dataset[attr]);
  }
});
document.addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target && e.target.id === "nin"){ e.preventDefault(); addNote(); }
});
document.addEventListener("change", e=>{
  const rp = e.target.closest('[data-pick="role"]');
  if(rp){
    role = rp.value; applyRole();
    /* si el perfil nuevo no tiene la pantalla abierta, hay que moverse a una que sí */
    if(navKeys().indexOf(screen) < 0) screen = navKeys()[0];
    cliFocus = R().cli ? R().cli[0] : null;
    sel = null; showAll = {}; ftab = "resumen";
    /* el portal abre directo en el expediente: es lo único que el cliente tiene */
    if(R().portal) tab.cartera = "ficha";
    paint(); return;
  }
  const pk = e.target.closest('[data-pick="client"]');
  if(pk){ cliFocus = pk.value; sel = {t:"client", id: pk.value};
          paintBody(); paintInsp(); paintCtx(); }
});
/* Una nota que no se guarda no demuestra nada. Vive en memoria, como el resto
   del prototipo, y se pierde al recargar — eso está dicho en el pie del panel. */
function addNote(){
  const el = $("#nin"); if(!el) return;
  const t = el.value.trim(); if(!t) return;
  const m = CRM(fichaId()); if(!m) return;
  m.notas.unshift({day:0, by:"S-1", t:t});
  el.value = "";
  paintBody(); paintCtx();
  const again = $("#nin"); if(again) again.focus();
}

window.addEventListener("resize", ()=>{
  if(!isNarrow()) closeDrawer();
  else if(panelOff) setPanel(true);   // a collapsed desktop panel must not vanish on a phone
});

/* autocomprobación: cada pantalla debe renderizar, cada instrumento debe dar
   un valor, y ningún panel por defecto debe quedar vacío. */
(function selfCheck(){
  const problems = [];
  const s0 = screen, t0 = JSON.parse(JSON.stringify(tab)), f0 = JSON.parse(JSON.stringify(filt));
  for(const k of ALLKEYS){
    screen = k; sel = null;
    try{
      const h = SC[k]();
      if(!h || h.length < 200) problems.push("pantalla corta: "+k);
      const ins = INSTR[k]();
      ins.forEach(([lab,val])=>{
        if(!lab) problems.push("instrumento sin etiqueta en "+k);
        if(val===undefined || val===null || val==="" || String(val).indexOf("NaN")>=0)
          problems.push("instrumento sin valor: "+k+" / "+lab);
      });
      const d = INSPDEF[k]();
      if(!d || !d.id || String(d.id).indexOf("undefined")>=0) problems.push("panel por defecto vacío: "+k);
      const insp = inspector.call(null, null);
      if(!insp.ttl || insp.ttl==="—") problems.push("panel sin título: "+k);
    }catch(err){ problems.push("error en "+k+": "+err.message); }
  }
  screen = s0; tab = t0; filt = f0; sel = null;
  window.__SELFCHECK__ = problems.length ? problems : "pass";
  if(problems.length) console.error("Autocomprobación falló", problems);
})();

paint();

/* Una invitación, no un secuestro: el recorrido NO arranca solo. Quien llega
   por su cuenta ve la franja; quien va a presentar la cierra y no vuelve a
   aparecer. Con ?tour=1 en la liga sí arranca en el primer paso —- útil cuando
   la liga se manda para que alguien la recorra sin nadie al lado. */
(function(){
  if(/[?&]tour=1/.test(location.search)){ tourStart(0); return; }
  const inv = document.createElement("div");
  inv.className = "tourinvite";
  inv.innerHTML = `<span><b>¿Primera vez aquí?</b> Hay un recorrido guiado de ${TOURS.length} pasos
      que enseña todo el sistema en orden.</span>
    <button class="pill on" data-tour="start">Empezar el recorrido</button>
    <button class="tinyx" aria-label="Cerrar">✕</button>`;
  document.body.appendChild(inv);
  const kill = () => inv.remove();
  inv.querySelector(".tinyx").addEventListener("click", kill);
  inv.querySelector("[data-tour]").addEventListener("click", kill);
})();
})();

</script>
