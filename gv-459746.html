:root{

  --ink:#211D18; --ink-2:#514A41; --ink-muted:#71695F;
  --accent:#AB5C2C; --accent-hover:#90491D; --accent-subtle:#FFF3EB;
  --success:#3F6B48; --warning:#8A5A08; --danger:#A32E22; --info:#1F5F8B;
  --tenant:#852B5D; --tenant-deep:#54193A; --tenant-tint:#F2E8EC;
  --c1:#B54E12; --c2:#136FD6; --c3:#A47D17; --c4:#B71AB1; --c5:#1D9972; --c6:#7D39F7;

}

a{color:var(--accent);text-decoration:none}

/* ── shell: rail | main | inspector ── */
.wall{display:grid;grid-template-columns:54px 1fr 340px;height:100vh;height:100dvh;overflow:hidden}

.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;overflow:visible;z-index:40}
.rail .mark{width:32px;height:32px;margin-bottom:12px;flex:none;display:grid;place-items:center}
.rail .mark svg{display:block}
.rbtn{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center;border:0;background:transparent;color:#8B8378;border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
.rbtn:hover{background:#2C2924;color:#E5DFD5}
.rbtn.on{background:var(--accent);color:#fff}
.rbtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#D2452F;border:1.5px solid var(--rail)}
.rbtn .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:var(--rail-2);color:#EFE9DF;padding:5px 9px;border-radius:6px;white-space:nowrap;font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--sh-md);z-index:60}
.rbtn:hover .tip{opacity:1}
.rail .spacer{flex:1}

.wmain{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--canvas)}

/* context bar — instrument cluster, replaces per-screen stat rows */
.ctxbar{flex:none;border-bottom:1px solid var(--border);background:var(--surface);padding:0 18px;display:flex;align-items:center;gap:22px;min-height:56px;overflow-x:auto;overflow-y:hidden}
.crumb{display:flex;align-items:baseline;gap:8px;flex:none}
.crumb .tenant{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenant);background:var(--tenant-tint);padding:3px 7px;border-radius:4px}
.crumb .scr{font-family:var(--f-ui);font-weight:600;font-size:14px}
.instr{display:flex;gap:20px;flex:none;margin-left:auto;align-items:baseline}
.ins{display:flex;flex-direction:column;gap:1px;flex:none}
.ins .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.ins .v{font-family:var(--f-disp);font-weight:400;font-size:19px;line-height:1.05;letter-spacing:-.01em}
.ins .v small{font-family:var(--f-ui);font-size:11px;color:var(--ink-muted);margin-left:3px}
.ins.neg .v{color:var(--danger)}
.ins.pos .v{color:var(--success)}

.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px}
.lede{font-size:13px;color:var(--ink-2);max-width:78ch;margin:0 0 16px}
.lede b{font-weight:600;color:var(--ink)}

/* inspector */
.insp{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.insphd{flex:none;padding:12px 16px;border-bottom:1px solid var(--border)}
.insphd .kick{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.insphd .ttl{font-family:var(--f-disp);font-size:18px;line-height:1.2;margin-top:3px}
.inspbody{flex:1;overflow-y:auto;padding:14px 16px}
.inspft{flex:none;border-top:1px solid var(--border);padding:9px 14px;background:var(--sunken);font-size:10.5px;color:var(--ink-muted);display:flex;gap:7px;align-items:center}
.inspft .fdot{width:7px;height:7px;border-radius:50%;background:var(--tenant);flex:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:0;box-shadow:var(--sh-sm);margin-bottom:14px}
.card>.hd{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h3{font-family:var(--f-ui);font-weight:600;font-size:12.5px;letter-spacing:.01em}
.card>.hd .sub{font-size:11px;color:var(--ink-muted)}
.card>.bd{padding:14px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split7{display:grid;grid-template-columns:7fr 5fr;gap:14px}
.split64{display:grid;grid-template-columns:6fr 4fr;gap:14px}
.grid>*,.split7>*,.split64>*{min-width:0}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);padding:4px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;flex:none;transition:.12s}
.pill:hover{border-color:var(--ink-muted)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#F5F1EA}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:.12s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--ink);background:var(--sunken)}
.btn.sm{padding:3px 10px;font-size:11px}
.chiprow{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>*{flex:none;white-space:nowrap}

.tag{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:#E7F0E8;color:var(--success)}
.tag.warn{background:#F8EFDC;color:var(--warning)}
.tag.bad{background:#F7E4E1;color:var(--danger)}
.tag.info{background:#E2EDF5;color:var(--info)}
.tag.accent{background:var(--accent-subtle);color:var(--accent)}
.tag.tenant{background:var(--tenant-tint);color:var(--tenant)}

.scroll{overflow-x:auto}
table.dt{font-size:12px}
table.dt th{text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--border-strong);background:var(--surface);position:sticky;top:0;z-index:2;white-space:nowrap}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tbody tr:hover{background:var(--sunken)}
table.dt tbody tr.sel{background:var(--accent-subtle);box-shadow:inset 2px 0 0 var(--accent)}
table.dt tbody tr.clk{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:11px}
.muted{color:var(--ink-muted)}
.tiny{font-size:11px}
.stat{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1;letter-spacing:-.015em}
.stat.sm{font-size:22px}
.klabel{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted)}

.tile{border:1px solid var(--border);background:var(--surface);padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.tile .stat{margin-top:1px}
.tile .foot{font-size:11px;color:var(--ink-muted)}

.bar{height:7px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.meter{display:flex;height:9px;overflow:hidden;background:var(--sunken)}
.meter>i{display:block;height:100%}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;align-items:baseline}
.kv dt{color:var(--ink-muted);white-space:nowrap}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

.note{border-left:2px solid var(--accent);background:var(--accent-subtle);padding:9px 12px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.note.warn{border-color:var(--warning);background:#FBF4E6}
.note.bad{border-color:var(--danger);background:#FBEDEB}
.note.info{border-color:var(--info);background:#EAF2F8}
.note b{color:var(--ink)}

.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.fstep .fbar{height:20px;background:var(--sunken);position:relative}
.fstep .fbar>i{display:block;height:100%}
.fstep .fnum{text-align:right;font-family:var(--f-mono);font-size:11.5px}
.fstep .fnum em{font-style:normal;color:var(--ink-muted);margin-left:5px}

.timeline{position:relative;padding-left:16px}
.timeline:before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--border-strong)}
.tl{position:relative;padding:0 0 12px}
.tl:before{content:"";position:absolute;left:-15px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--border-strong)}
.tl .when{font-family:var(--f-mono);font-size:10px;color:var(--ink-muted)}
.tl .what{font-size:12px}

.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto}
.chain .cn{flex:1;min-width:118px;border:1px solid var(--border);border-right:0;padding:9px 11px;background:var(--surface)}
.chain .cn:last-child{border-right:1px solid var(--border)}
.chain .cn.dim{background:var(--sunken);color:var(--ink-muted)}
.chain .cn .klabel{margin-bottom:3px}
.chain .cn .v{font-family:var(--f-disp);font-size:16px}
.chain .cn .s{font-size:10.5px;color:var(--ink-muted)}

input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text],select{font-family:var(--f-ui);font-size:12px;padding:5px 8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:0;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field{margin-bottom:11px}
.field label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.field .fl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.field .fv{font-family:var(--f-disp);font-size:15px}
.field .fh{font-size:10.5px;color:var(--ink-muted);margin-top:3px;line-height:1.35}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
svg .gl{stroke:var(--border);stroke-width:1}
svg text{font-family:var(--f-mono);font-size:9px;fill:var(--ink-muted)}
svg text.vl{font-family:var(--f-ui);font-size:10px;fill:var(--ink-2)}

.escal{border:1px solid var(--border);border-left:2px solid var(--warning);background:var(--surface);padding:10px 12px;margin-bottom:9px}
.escal .q{font-family:var(--f-disp);font-size:14px;line-height:1.35;font-style:italic;color:var(--ink-2);margin:6px 0 8px}
.escal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.avatar{width:22px;height:22px;border-radius:50%;background:var(--sunken);border:1px solid var(--border-strong);display:inline-grid;place-items:center;font-size:9px;font-family:var(--f-mono);color:var(--ink-2);flex:none}
.repcell{display:flex;align-items:center;gap:7px}
.sect{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sect:first-child{margin-top:0}
.hr{height:1px;background:var(--border);margin:12px 0}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hide{display:none!important}
.railtoggle{display:none}
.drawerback{display:none}

/* ── Vencom: additions on top of the Telaia primitives. No media queries here —
   every responsive rule lives in the responsive layer, injected last. ── */

.escal{cursor:pointer;transition:border-color .12s,background .12s}
.escal:hover{border-left-color:var(--accent);background:var(--accent-subtle)}
.escal .row{gap:9px}

/* many-column operational tables: keep them legible rather than squashed */
table.dt th,table.dt td{padding:7px 9px}
table.dt td .tag{vertical-align:1px}

.chain .cn .v{letter-spacing:-.01em}
.tile .stat.sm{font-size:20px}

/* the pill row that carries tabs sits tight under the lede */
.chiprow+.card,.chiprow+.grid,.chiprow+.split7,.chiprow+.chain{margin-top:0}

.kv dd b{font-weight:600}
.inspbody .note{margin-bottom:0}
.inspbody .note+.note{margin-top:8px}
.inspbody .sect:first-child{margin-top:0}

.funnel .fstep .fbar>i{transition:width .22s ease}
.bar>i{transition:width .22s ease}

/* ── detail panel: collapsible on wide screens, dismissible on narrow ones ── */
.wall.nopanel{grid-template-columns:54px 1fr}
.wall.nopanel .insp{display:none}
.rbtn.on2{color:#E5DFD5;background:#2C2924}
.insphd{position:relative;padding-right:38px}
.inspx{position:absolute;top:9px;right:10px;width:24px;height:24px;display:grid;place-items:center;
  border:0;background:transparent;color:var(--ink-muted);cursor:pointer;border-radius:4px;transition:.12s}
.inspx:hover{background:var(--sunken);color:var(--ink)}

/* the Vencom mark needs a touch more room than the Telaia interlace did */
.rail .mark{width:34px;height:34px;margin-bottom:14px}
.inspft{gap:8px}

/* ── formas: chrome recesivo, marcas delgadas, aire ── */
.chartnote{font-size:11.5px;color:var(--ink-muted);margin-top:9px;padding-top:8px;
  border-top:1px solid var(--border)}
.chartnote b{color:var(--ink)}

.dvg{display:flex;flex-direction:column;gap:5px}
.dvgrow{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:12px}
.dvgl{overflow:hidden;text-overflow:ellipsis}
.dvgt{position:relative;height:16px;background:var(--sunken);border-radius:2px}
.dvgz{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border-strong)}
.dvgb{position:absolute;top:2px;bottom:2px;display:block}
.dvgv{text-align:right;font-size:11.5px}

.pipe{display:flex;gap:2px;align-items:stretch}
.pipe .pipeseg{min-width:0;padding:11px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:2px;overflow:hidden}
.pipe .pipeseg.dim{background:var(--sunken);color:var(--ink-muted)}
.pipe .pipev{font-family:var(--f-disp);font-weight:600;font-size:21px;line-height:1.1;margin-top:2px}
.pipe .pipes{font-size:10.5px;color:var(--ink-muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mtr{margin-bottom:11px}
.mtrt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}

/* ── densidad: más aire, tipografía un punto mayor ── */
body{font-size:14px}
.wbody{padding:22px 24px}
.card{margin-bottom:18px}
.card>.bd{padding:16px}
.card>.hd{padding:13px 16px}
.grid{gap:18px}
.split7,.split64{gap:18px}
table.dt{font-size:12.5px}
table.dt th,table.dt td{padding:9px 11px}
.lede{font-size:13.5px;margin-bottom:20px;max-width:86ch}
.tile{padding:14px 15px}

/* ── una tabla larga se corta y se ofrece completa ── */
.moretog{display:flex;align-items:center;gap:9px;padding:10px 16px;border-top:1px solid var(--border);
  background:var(--sunken);font-size:12px;color:var(--ink-2);cursor:pointer;width:100%;border:0;
  border-top:1px solid var(--border);text-align:left}
.moretog:hover{background:var(--accent-subtle);color:var(--accent)}
.moretog .mono{color:var(--ink-muted)}
.dvgrow.on{background:var(--accent-subtle);box-shadow:inset 2px 0 0 var(--accent)}
.dvgrow[data-recon]:hover{background:var(--sunken)}
.dvgrow{padding:2px 6px;margin:0 -6px;border-radius:2px}

/* ── barra de vigencia: dónde estamos dentro de los tres años ── */
.lifebar{position:relative;padding-top:4px}
.lifetrack{position:relative;height:12px;background:var(--sunken);border-radius:2px;overflow:hidden}
.lifedone{position:absolute;left:0;top:0;bottom:0;background:var(--c1);opacity:.85}
.lifewin{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,
  var(--warning) 0 2px,transparent 2px 6px);opacity:.55}
.lifenow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.lifelbl{position:relative;height:30px;margin-top:7px;font-size:10.5px;color:var(--ink-2)}
.lifelbl span{position:absolute;white-space:nowrap;font-family:var(--f-mono);line-height:1.35}
.lifelbl i{font-style:normal;color:var(--ink-muted)}

/* separador de grupo en el riel: hilo horizontal en escritorio */
.rail .rsep{width:20px;height:1px;background:rgba(255,255,255,.16);margin:7px 0;flex:none}
.rbtn .tip .sub{display:block;font-size:10px;opacity:.72;margin-top:2px}

/* selector de rango del tablero */
.rangebar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;
  padding-bottom:11px;border-bottom:1px solid var(--border)}
.rangebar .rl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-muted);margin-right:3px}
.rangebar .rn{font-size:11px;color:var(--ink-muted);margin-left:auto}
@media (max-width:700px){ .rangebar .rn{margin-left:0;width:100%} }

/* ── ficha CRM del cliente ── */
.crmpick{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.crmpick .rl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-muted)}
.csel{font-family:var(--f-ui);font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);padding:7px 10px;max-width:min(420px,100%);cursor:pointer}
.fichahd{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;
  padding-bottom:14px;border-bottom:1px solid var(--border-strong);margin-bottom:2px}
.fichahd>*{min-width:0}
.fichahd .kick{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
.fichahd .fname{font-family:var(--f-disp);font-weight:600;font-size:26px;letter-spacing:-.015em;margin:5px 0 8px}
.fichahd .svcs{display:flex;gap:5px;flex-wrap:wrap}
.fichahd .pagost{text-align:right}
.fichahd .pagost .amt{font-family:var(--f-disp);font-weight:600;font-size:21px;margin-top:7px;letter-spacing:-.015em}
.fichahd .pagost .amt.bad{color:var(--danger)}
.cluster2{display:flex;gap:28px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.cluster2 .ins{display:flex;flex-direction:column;gap:2px}
.cluster2 .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.cluster2 .v{font-family:var(--f-disp);font-weight:600;font-size:19px;line-height:1;letter-spacing:-.015em}
.opline{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--border)}
.opline .v{font-family:var(--f-disp);font-weight:600;font-size:17px}
.opline .l{font-size:12.5px;color:var(--ink-2)}
.opline.z .v{color:var(--ink-muted)}
.lnk{background:0;border:0;padding:0;font-family:var(--f-ui);font-size:11.5px;color:var(--accent);cursor:pointer}
.lnk:hover{text-decoration:underline}
.notebox{display:flex;gap:7px;margin-bottom:12px}
.notebox .nin{flex:1;min-width:0;font-family:var(--f-ui);font-size:12.5px;color:var(--ink);
  background:var(--sunken);border:1px solid var(--border-strong);padding:7px 10px}
.noteit{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--ink-2)}
@media (max-width:820px){
  .fichahd{grid-template-columns:1fr}
  .fichahd .pagost{text-align:left}
  .cluster2{gap:18px}
}

/* aviso de sólo lectura en prospección */
.ronly{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;
  background:var(--accent-subtle);border-left:2px solid var(--accent);
  padding:12px 15px;margin:0 0 14px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.ronly>*{min-width:0}
.ronly b{color:var(--ink)}
.ronly .badge{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;white-space:nowrap}
@media (max-width:620px){ .ronly{grid-template-columns:1fr;gap:8px} }

/* ══════════════════════════════════════════════════════════════════════════
   GRUPO VENCOM — brand layer.
   Every value here was read off vencom.com.mx as it renders, not guessed:
     logo SVG      #002856 navy · #00A6CE · #0080BB · #1F2E3F slate
     UI accent     #00BFD8 (buttons, pill-shaped, uppercase + tracked)
     headings      #393939 · body #626262 · canvas #F9FAFC
     typeface      Raleway, throughout
   This block overrides the Telaia tokens wholesale. Load it AFTER base.css.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* surfaces — cool, not linen */
  --canvas:#F4F7FA; --surface:#FFFFFF; --sunken:#EBF0F6;
  --border:#DCE4EC; --border-strong:#C0CDD9;

  /* ink — their slate, not espresso */
  --ink:#1F2E3F; --ink-2:#4A5A6B; --ink-muted:#6E7C8C;

  /* accent — #00BFD8 is their signature but fails text contrast on white,
     so the cyan does the FILLS and the logo blue does anything with words in it */
  --accent:#0080BB; --accent-hover:#00659A; --accent-subtle:#E4F4FB;
  --cyan:#00BFD8; --cyan-deep:#00A6CE; --navy:#002856;

  /* status — kept reserved, never a series colour */
  --success:#1B7A4B; --warning:#8A5A08; --danger:#C0342A; --info:#0080BB;

  /* tenant chip — their navy */
  --tenant:#002856; --tenant-deep:#001B3A; --tenant-tint:#E2EDF7;

  /* chart palette — REBUILT for this brand and validated with the dataviz
     validator against surface #F9FAFC: lightness band, chroma floor, adjacent
     CVD separation (worst ΔE 14.3 deutan), normal-vision floor, 3:1 contrast.
     Fixed order, never cycled. Do not reorder — the pairs were checked adjacent. */
  --c1:#0080BB; --c2:#C2571C; --c3:#7A3BC4; --c4:#12A08F; --c5:#8A6A12; --c6:#96157A;

  /* the rail is the single most visible brand surface */
  --rail:#002856; --rail-2:#0A3A6B;

  /* cool shadows on cool paper */
  --sh-sm:0 1px 2px rgba(15,40,70,.07),0 1px 3px rgba(15,40,70,.06);
  --sh-md:0 2px 6px rgba(15,40,70,.08),0 8px 20px rgba(15,40,70,.07);

  /* Raleway throughout, as they use it */
  --f-disp:"Raleway",-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Raleway",-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* Raleway is a geometric sans, not a serif — the display rules have to change.
   Their headings are 700 and their micro-labels are uppercase and tracked. */
h1,h2,h3,h4{font-weight:600}
.stat{font-weight:600;letter-spacing:-.02em}
.ins .v{font-weight:600;letter-spacing:-.015em}
.insphd .ttl{font-weight:600;letter-spacing:-.01em}
.chain .cn .v{font-weight:600}
.crumb .tenant{font-weight:600}

/* their buttons: pill, uppercase, tracked, cyan */
.btn{background:var(--cyan);border-color:var(--cyan);color:#04333B;font-weight:600;
     text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.btn:hover{background:var(--cyan-deep);border-color:var(--cyan-deep);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--border-strong);
     text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.btn.ghost:hover{border-color:var(--accent);background:var(--accent-subtle);color:var(--accent)}

/* the rail sits on navy, so the active state needs the cyan to read */
.rbtn{color:#7FA3C2}
.rbtn.on{background:var(--cyan);color:#02303A}
.rbtn:hover{background:#0A3A6B;color:#DCEEF6}
.rbtn.on2{background:#0A3A6B;color:#DCEEF6}
.rbtn .tip{background:#00325F;color:#E8F2F9}
.rbtn .dot{border-color:var(--rail);background:var(--cyan)}

.tag.accent{background:var(--accent-subtle);color:var(--accent)}
.tag.tenant{background:var(--tenant-tint);color:var(--tenant)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#EAF3FA}
table.dt tbody tr.sel{background:var(--accent-subtle);box-shadow:inset 2px 0 0 var(--accent)}
.note{border-left-color:var(--accent);background:var(--accent-subtle)}
.note.warn{border-color:var(--warning);background:#FBF3E4}
.note.bad{border-color:var(--danger);background:#FCECEA}
.note.info{border-color:var(--info);background:#E4F1F9}
.tag.ok{background:#E3F2E9;color:var(--success)}
.tag.warn{background:#FAF0DC;color:var(--warning)}
.tag.bad{background:#FBE7E5;color:var(--danger)}
.tag.info{background:#E2EFF8;color:var(--info)}
.bar>i{background:var(--accent)}
.inspft .fdot{background:var(--cyan)}
.timeline .tl:before{background:var(--accent)}
.escal{border-left-color:var(--warning)}
.escal:hover{border-left-color:var(--accent);background:var(--accent-subtle)}
.tl:before{box-shadow:0 0 0 1.5px var(--border-strong)}

/* ── responsive layer — INJECTED LAST, owns every media query in this file ──
   Rules learned the hard way (feedback_responsive_html_demos):
   1. media queries add no specificity → they must come after everything else
   2. grid/flex children need min-width:0 or a wide table opens the page
   3. sidebar → drawer, never a stacked list
   4. backdrop-filter/transform create containing blocks for position:fixed  */

@media (max-width:1240px){
  .wall{grid-template-columns:54px 1fr 300px}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1080px){
  .wall{grid-template-columns:54px 1fr}
  .rail{z-index:80}   /* above .drawerback (65): the rail stays tappable with the drawer open */
  .insp{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:70;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 28px rgba(45,35,25,.14);backdrop-filter:none}
  .insp.open{transform:translateX(0)}
  .drawerback{display:block;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(33,29,24,.34);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawerback.on{opacity:1;pointer-events:auto}
  .railtoggle{display:inline-flex}
  .split7,.split64{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  body{font-size:13px}
  .wall{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;height:52px;width:100%;padding:0 8px;gap:0;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:var(--rail);backdrop-filter:none;
    z-index:80}   /* above the drawer backdrop: navigation must work in ONE tap */
  .rail::-webkit-scrollbar{display:none}
  .rail .mark{margin:0 8px 0 0;width:26px;height:26px}
  .rail .spacer{display:none}
  .rbtn{width:36px;height:36px}
  .rbtn .tip{display:none}
  /* en horizontal el separador se pone de pie */
  .rail .rsep{width:1px;height:18px;margin:0 6px}
  .ctxbar{min-height:auto;padding:9px 12px;flex-wrap:wrap;gap:10px 16px;overflow-x:visible}
  .instr{margin-left:0;width:100%;gap:0;display:grid;grid-template-columns:repeat(2,1fr);row-gap:8px}
  .ins .v{font-size:17px}
  .wbody{padding:12px}
  .g2,.g3,.g4{grid-template-columns:repeat(2,1fr)}
  .g3>*:nth-child(3):last-child,.g5>*:nth-child(5):last-child{grid-column:1/-1}
  .fstep{grid-template-columns:104px 1fr 76px;gap:7px;font-size:11.5px}
  .fstep .fnum{font-size:10.5px}
  .stat{font-size:25px}
  .card>.bd{padding:11px}
  .chain{display:grid;grid-template-columns:repeat(2,1fr)}
  .chain .cn{border-right:1px solid var(--border)}
  /* dense tables scroll, but the label column stays pinned */
  .scroll table.dt{min-width:880px}
  .scroll table.dt th:first-child,.scroll table.dt td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  .scroll table.dt tbody tr:hover td:first-child{background:var(--sunken)}
  .scroll table.dt th:first-child:after,.scroll table.dt td:first-child:after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:var(--border)}
}
@media (max-width:430px){
  .g2,.g3,.g4{grid-template-columns:repeat(2,1fr)}
  .instr{grid-template-columns:repeat(2,1fr)}
  .lede{font-size:12.5px}
  .insp{width:94vw}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

</style>
</head>

</div>

<script>
/* Vencom Operaciones — simulación de demostración.
   Todo lo que aparece en pantalla se calcula al cargar a partir de los hechos
   en __DATA__. No hay totales escritos a mano. Español de México, tuteo. */
(function(){
"use strict";
const D = window.__DATA__;
const $ = s => document.querySelector(s);
const P = D.params;

/* ── tiempo: los desfases en días se resuelven al cargar, la demo no caduca ── */
const MON = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const TODAY = new Date(); TODAY.setHours(9,0,0,0);
const dt = o => new Date(TODAY.getTime() + o*864e5);
const fdate = o => { const d = dt(o); return d.getDate()+" "+MON[d.getMonth()]; };
const fdatey = o => { const d = dt(o); return d.getDate()+" "+MON[d.getMonth()]+" "+String(d.getFullYear()).slice(2); };
function frel(o){
  if(o===0) return "hoy";
  if(o===1) return "mañana";
  if(o===-1) return "ayer";
  if(o>0) return "en "+o+" d";
  if(o>-7) return "hace "+(-o)+" d";
  if(o>-31) return "hace "+Math.round(-o/7)+" sem";
  return "hace "+Math.round(-o/30.44)+" meses";
}
function monthLabel(m){ const d = new Date(TODAY.getFullYear(), TODAY.getMonth()+m, 1);
  return MON[d.getMonth()]+" "+d.getFullYear(); }

/* ── números ── */
const mx = (n,dp=0) => (n<0?"−":"")+"$"+Math.abs(n).toLocaleString("es-MX",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const mx2 = n => mx(n,2);
const usd = (n,dp=2) => "US$"+n.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const int = n => Math.round(n).toLocaleString("es-MX");
const pct = (n,dp=1) => n.toFixed(dp)+"%";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cn = id => (D.clients.find(c=>c.id===id)||{n:"—"}).n;
const cO = id => D.clients.find(c=>c.id===id) || null;
const sn = id => (D.staff.find(s=>s.id===id)||{n:"—"}).n;
const sN = sn;
const sR = id => (D.staff.find(s=>s.id===id)||{role:"—"}).role;
const ini = n => String(n).split(" ").slice(0,2).map(w=>w[0]).join("");

/* un plazo se dice distinto según ya haya pasado o no */
function venc(d, v="Vence", p="Venció"){ return (d<0 ? p : v) + " " + frel(d); }
const dias = n => n === 1 ? "1 día" : n + " días";
function quedan(d){
  if(d < 0) return "El plazo venció hace " + dias(-d);
  if(d === 0) return "El plazo vence hoy";
  return d === 1 ? "Queda 1 día" : "Quedan " + d + " días";
}

/* ── gráficas. Paleta en orden FIJO — validada para daltonismo, no reordenar ── */
const PAL = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

function hbars(rows){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return rows.map((r,i)=>`<div style="display:grid;grid-template-columns:170px 1fr 96px;gap:9px;align-items:center;font-size:12px;padding:3px 0">
    <div class="nowrap" style="overflow:hidden;text-overflow:ellipsis" title="${esc(r.l)}">${esc(r.l)}</div>
    <div class="bar"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c||PAL[i%6]}"></i></div>
    <div class="mono right">${esc(r.t!=null?r.t:int(r.v))}</div></div>`).join("");
}
function groupBars(cats, series){
  const H = 140, n = cats.length, k = series.length;
  const max = Math.max(1, ...series.flatMap(s=>s.v));
  const gw = 100/n;
  let s = `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
  for(let g=0; g<=4; g++){ const y = H - H*g/4; s += `<line class="gl" x1="0" y1="${y}" x2="100" y2="${y}" vector-effect="non-scaling-stroke"/>`; }
  cats.forEach((c,i)=>series.forEach((se,j)=>{
    const h = Math.max(0.8, se.v[i]/max*(H-8));
    const bw = gw*0.72/k, x = i*gw + gw*0.14 + j*bw;
    s += `<rect x="${x}" y="${H-h}" width="${bw*0.86}" height="${h}" fill="${PAL[j]}"/>`;
  }));
  s += `</svg><div style="display:grid;grid-template-columns:repeat(${n},1fr);margin-top:5px">`;
  cats.forEach(c=> s += `<div style="text-align:center" class="mono">${esc(c)}</div>`);
  s += `</div><div class="legend">`;
  series.forEach((se,j)=> s += `<span><i style="background:${PAL[j]}"></i>${esc(se.n)}</span>`);
  return s + `</div>`;
}
function stepline(rows){   /* rows: {l, v, n} */
  const H = 132, n = rows.length, max = Math.max(1, ...rows.map(r=>r.v));
  let path = "";
  rows.forEach((p,i)=>{ const x = n>1 ? i/(n-1)*100 : 50, y = H - p.v/max*(H-14) - 7;
    path += (i?"L":"M") + x.toFixed(2) + " " + y.toFixed(2) + " "; });
  let s = `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`;
  for(let g=0; g<=3; g++){ const y = H - (H-7)*g/3 - 7; s += `<line class="gl" x1="0" y1="${y}" x2="100" y2="${y}" vector-effect="non-scaling-stroke"/>`; }
  s += `<path d="${path}" fill="none" stroke="var(--c1)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  rows.forEach((p,i)=>{ const x = n>1 ? i/(n-1)*100 : 50, y = H - p.v/max*(H-14) - 7;
    s += `<circle cx="${x}" cy="${y}" r="1.7" fill="var(--c1)" vector-effect="non-scaling-stroke"/>`; });
  s += `</svg><div style="display:grid;grid-template-columns:repeat(${n},1fr);margin-top:4px" class="mono">`;
  rows.forEach(r=> s += `<span style="text-align:center">${esc(r.l)}</span>`);
  return s + `</div>`;
}



/* Una tabla larga oculta lo importante. Se muestran las primeras N filas y se
   ofrece el resto; el estado vive por pantalla y pestaña. */
let showAll = {};
const moreKey = () => screen + ":" + (tab[screen] || "") + ":" + (filt[screen] || "");
function cut(rows, n){
  const k = moreKey();
  const r = showAll[k] ? {rows, hidden:0} : {rows: rows.slice(0, n), hidden: Math.max(0, rows.length-n)};
  // se expone para que la verificación compruebe que nada queda escondido sin salida
  window.__TRUNC__ = (window.__TRUNC__ || 0) + r.hidden;
  return r;
}
function moreBtn(hidden){
  if(!hidden) return "";
  return `<button class="moretog" data-more="1">
    <span>Ver las ${int(hidden)} filas restantes</span>
    <span class="mono" style="margin-left:auto">${int(hidden)}</span></button>`;
}

/* ═══════════════════ formas ═══════════════════
   Specs fijos: barras <=24px, punta redondeada de 4px en el extremo de dato y
   cuadrada en la base, separación de 2px en color de superficie entre marcas
   contiguas, rejilla de un pelo. Nada decorativo. */

/* Cuándo cae la presión. Una columna por día; el rojo es el plazo vencido o
   a punto de vencer. Responde "¿qué se me viene encima?" sin leer la tabla. */
function dayBars(items, opts){
  const o = Object.assign({lo:-4, hi:15, riskAt:2, label:"asuntos", h:118}, opts||{});
  const inWin = items.filter(x=>x.d >= o.lo && x.d <= o.hi);
  const beyond = items.length - inWin.length;
  const days = [];
  for(let d=o.lo; d<=o.hi; d++) days.push(d);
  const counts = days.map(d=>inWin.filter(x=>x.d===d).length);
  const max = Math.max(1, ...counts);
  const n = days.length, bw = 100/n;
  const H = o.h, pad = 16;
  let s = `<svg viewBox="0 0 100 ${H+pad}" preserveAspectRatio="none" style="width:100%;height:${H+pad}px;display:block" role="img">`;
  // la zona de riesgo se pinta antes que nada, como fondo
  const riskW = (days.filter(d=>d<=o.riskAt).length)/n*100;
  s += `<rect x="0" y="0" width="${riskW}" height="${H}" fill="var(--danger)" opacity=".055"/>`;
  for(let g=0; g<=3; g++){ const y = H - H*g/3;
    s += `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>`; }
  days.forEach((d,i)=>{
    const c = counts[i]; if(!c) return;
    const hgt = Math.max(3, c/max*(H-10));
    // 2px de superficie entre columnas contiguas: se resta del ancho
    const w = Math.min(bw*0.66, 3.2);
    const x = i*bw + (bw-w)/2;
    const fill = d < 0 ? "var(--danger)" : d <= o.riskAt ? "var(--warning)" : "var(--c1)";
    s += `<rect x="${x.toFixed(2)}" y="${(H-hgt).toFixed(2)}" width="${w.toFixed(2)}" height="${hgt.toFixed(2)}"
           fill="${fill}" rx="1.2" ry="1.2"/>`;
  });
  s += `<line x1="${((0-o.lo)/n*100).toFixed(2)}" y1="0" x2="${((0-o.lo)/n*100).toFixed(2)}" y2="${H}"
         stroke="var(--ink)" stroke-width="1" stroke-dasharray="0" vector-effect="non-scaling-stroke" opacity=".45"/>`;
  s += `</svg>`;
  // eje: los hitos van en su posición real, no repartidos a ojo
  const at = d => ((d - o.lo) + 0.5) / n * 100;
  const ticks = [[o.lo + 0.5, "vencido", 1], [0, "hoy", 0], [7, "+1 sem", 0], [14, "+2 sem", 0]]
    .filter(t => t[0] >= o.lo && t[0] <= o.hi);
  s += `<div style="position:relative;height:15px;margin-top:3px">` + ticks.map(([d, l, danger]) =>
    `<span class="mono tiny" style="position:absolute;left:${at(d).toFixed(2)}%;transform:translateX(-50%);
      white-space:nowrap;color:${danger?"var(--danger)":"var(--ink-muted)"}">${esc(l)}</span>`).join("") + `</div>`;
  const late = inWin.filter(x=>x.d < 0).length;
  const soon = inWin.filter(x=>x.d >= 0 && x.d <= o.riskAt).length;
  const bits = [];
  if(late) bits.push(`<b style="color:var(--danger)">${int(late)} vencido${late>1?"s":""}</b>`);
  if(soon) bits.push(`<b style="color:var(--warning)">${int(soon)}</b> en ${o.riskAt} días o menos`);
  s += `<div class="chartnote">${bits.length ? bits.join(" · ")
    : `Nada vence en los próximos ${o.riskAt} días`} · ${int(inWin.length)} ${esc(o.label)} en esta ventana`
    + (beyond ? ` · ${int(beyond)} más allá de dos semanas` : "");
  return s + `</div>`;
}

/* Parte-de-un-todo, de un vistazo. Máximo 6 segmentos, 2px de aire entre ellos. */
function splitBar(segs, opts){
  const o = Object.assign({h:26}, opts||{});
  const tot = segs.reduce((a,s)=>a+s.v,0) || 1;
  let s = `<div style="display:flex;height:${o.h}px;gap:2px;overflow:hidden">`;
  segs.forEach(g=>{ if(!g.v) return;
    s += `<div title="${esc(g.l)}: ${int(g.v)}" style="width:${(g.v/tot*100).toFixed(2)}%;background:${g.c};
      border-radius:2px;min-width:3px"></div>`; });
  s += `</div><div class="legend" style="margin-top:9px">`;
  segs.forEach(g=>{ if(!g.v) return;
    s += `<span><i style="background:${g.c};border-radius:2px"></i>${esc(g.l)}
      <b style="margin-left:4px">${int(g.v)}</b></span>`; });
  return s + `</div>`;
}

/* Diferencia contra una base: polos cálido/frío, cero neutro en el centro. */
function divergeBars(rows){
  const max = Math.max(1, ...rows.map(r=>Math.abs(r.v)));
  return `<div class="dvg">` + rows.map(r=>{
    const w = Math.abs(r.v)/max*50;
    const neg = r.v < 0;
    return `<div class="dvgrow ${r.on?"on":""}" ${r.attr||""} ${r.attr?'style="cursor:pointer"':""}>
      <div class="dvgl nowrap" title="${esc(r.l)}">${esc(r.l)}</div>
      <div class="dvgt">
        <span class="dvgz"></span>
        <span class="dvgb" style="${neg?`right:50%`:`left:50%`};width:${w.toFixed(2)}%;
          background:${neg?"var(--c2)":"var(--c1)"};
          border-radius:${neg?"3px 1px 1px 3px":"1px 3px 3px 1px"}"></span>
      </div>
      <div class="dvgv mono">${r.t}</div></div>`;
  }).join("") + `</div>`;
}

/* Una etapa por columna, ancho proporcional a lo que carga. */
function pipeline(stages){
  const tot = stages.reduce((a,s)=>a+Math.max(s.v,0),0) || 1;
  return `<div class="pipe">` + stages.map((st,i)=>{
    const share = Math.max(6, st.v/tot*100);
    return `<div class="pipeseg ${st.v?"":"dim"}" style="flex:${share.toFixed(2)} 1 0"
        title="${esc(st.l)}: ${int(st.v)}">
      <div class="klabel">${esc(st.l)}</div>
      <div class="pipev">${int(st.v)}</div>
      <div class="pipes">${esc(st.s||"")}</div>
    </div>`;
  }).join("") + `</div>`;
}

/* Un valor contra su límite. Nunca un pastel de dos rebanadas. */
function meterOf(v, cap, lbl, disp){
  const raw = v/Math.max(1,cap)*100;         // el real, aunque pase de 100
  const p = Math.min(100, raw);
  const over = raw > 100.5;
  const full = raw >= 99.5 && !over;
  return `<div class="mtr">
    <div class="mtrt"><span>${esc(lbl||"")}</span>
      <span class="mono" style="color:${over?"var(--danger)":full?"var(--warning)":"var(--ink-2)"}">
        ${esc(disp != null ? disp : pct(raw,0))}</span></div>
    <div class="meter" style="position:relative">
      <i style="width:${p.toFixed(1)}%;background:${over?"var(--danger)":full?"var(--warning)":"var(--c1)"}"></i>
      ${over?`<span style="position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--danger)"></span>`:""}
    </div>
  </div>`;
}

/* Un submayor tiene UN estado, no varios. Prioridad: bloqueado > sin paridad >
   sobre el tope > en regla. Sin esto, un mismo registro se contaba dos veces. */
function fundState(f){
  if(f.req) return "bloqueado";
  if(!f.parity) return "sin-paridad";
  if(f.empYTD > f.cap) return "sobre-tope";
  return "ok";
}

function filtClients(){
  const f = filt.cartera;
  if(f==="todos") return D.clients;
  return D.clients.filter(c=>c.svc.indexOf(f)>=0);
}
function filtRuns(){
  const f = filt.nomina;
  if(f==="todas") return D.runs;
  if(f==="abiertas") return openRuns();
  return D.runs.filter(r=>r.stage===f);
}
function filtMovs(){
  const f = filt.movs;
  if(f==="todos") return D.movs;
  if(f==="abiertos") return openMovs();
  if(f==="riesgo") return riskMovs();
  return D.movs.filter(m=>m.t===f);
}

    {l:"Obligaciones",      v:openObl().filter(o=>inR(o.due)).length,    c:PAL[2]},
  ];
  const urgent = ib.filter(x=>x.urg<=2), later = ib.filter(x=>x.urg>2 && inR(x.urg));
  const fuera = ib.filter(x=>x.urg>2 && !inR(x.urg)).length;
  const cli = cut(D.clients.slice().sort((a,b)=>b.emp-a.emp), 7);
  const card = x => `<div class="escal" data-ib="${esc(x.k)}:${esc(x.id)}">
      <div class="row">
        <span class="tag ${x.urg<0?"bad":x.urg<=1?"bad":x.urg<=4?"warn":""}">${x.urg<0?"vencido":x.urg===0?"hoy":"en "+x.urg+" d"}</span>
        <b style="font-size:13px">${esc(x.t)}</b></div>
      <div class="q" style="font-size:13px;margin:6px 0 6px">${esc(x.w)}</div>
      <div class="tiny muted">${esc(x.s)}</div>
    </div>`;
  return `
  <p class="lede">Lo que <b>ya no puede esperar a nadie más</b>, en el rango que elijas. Cada renglón lleva
  su plazo legal y el responsable dentro de Vencom; ninguno se cierra solo.</p>

  <div class="split64" style="margin-bottom:4px">
    <div class="card"><div class="hd"><h3>El periodo</h3>

      <div class="bd">${dayBars(work, {label:"pendientes", riskAt:2, lo:-4, hi:Math.max(7, rD())})}</div></div>
    <div class="card"><div class="hd"><h3>De qué es</h3></div><div class="bd">
      ${splitBar(byKind)}
      <div class="chartnote">Tres relojes distintos —por evento, por periodo y por calendario fiscal—
      que hoy nadie ve desde el mismo lugar. Esa es la falla, y no es de las personas.</div>
    </div></div>
  </div>

  <div class="split7">
    <div>
      <div class="card"><div class="hd">
        <h3>Requiere a una persona</h3>
        <span class="sub">${urgent.length} urgentes · ${ib.length} en total</span>
      </div><div class="bd">
        ${urgent.map(card).join("")}
        ${later.length?`<div class="sect">Después de esta semana</div>
          ${later.slice(0,4).map(x=>`<div class="clk" data-ib="${esc(x.k)}:${esc(x.id)}"
              style="cursor:pointer;display:grid;grid-template-columns:58px 1fr;gap:11px;align-items:baseline;
                     padding:8px 0;border-bottom:1px solid var(--border)">
            <span class="mono tiny muted">en ${x.urg} d</span>
            <span><b style="font-size:12.5px">${esc(x.t)}</b>
              <div class="tiny muted">${esc(x.s)}</div></span></div>`).join("")}
          ${later.length>4?`<div class="tiny muted" style="margin-top:9px">y ${later.length-4} más
            dentro del rango, en las pantallas de cada módulo.</div>`:""}`:""}
        ${fuera?`<div class="tiny muted" style="margin-top:9px">${fuera} asunto${fuera===1?"":"s"} más
          allá de ${RANGES[rango][0].toLowerCase()} — amplía el rango para verlos.</div>`:""}
      </div></div>
    </div>

    <div>
      <div class="card"><div class="hd"><h3>Corridas de nómina abiertas</h3>
        <span class="sub">${openRuns().filter(r=>inR(r.payDay)).length} en el rango</span></div>
        <div class="bd flush"><div class="scroll"><table class="dt">
          <thead><tr><th>Cliente</th><th>Etapa</th><th class="num">Paga</th></tr></thead>
          <tbody>${openRuns().filter(r=>inR(r.payDay)).sort((a,b)=>a.payDay-b.payDay).slice(0,7).map(r=>`
            <tr class="clk ${sel&&sel.t==="run"&&sel.id===r.id?"sel":""}" data-run="${r.id}">
              <td>${esc(cn(r.c))}<div class="tiny muted">${esc(r.cal)}</div></td>
              <td><span class="tag ${r.stage==="timbrado"?"warn":r.stage==="incidencias"?"info":""}">${esc(STAGE_L[r.stage])}</span></td>
              <td class="num mono">${esc(frel(r.payDay))}</td></tr>`).join("")}
          </tbody></table></div></div></div>

      <div class="card"><div class="hd"><h3>Vencimientos próximos</h3></div>
        <div class="bd">
          ${openObl().filter(o=>inR(o.due)).slice(0,6).map(o=>`
            <div style="display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:baseline;
                        padding:8px 0;border-bottom:1px solid var(--border)">
            <span class="mono tiny" style="${o.due<=3?"color:var(--danger)":"color:var(--ink-muted)"}">${esc(fdate(o.due))}</span>
            <span style="font-size:12.5px">${esc(o.l)}
              <div class="tiny muted">${esc(o.c?cn(o.c):"Vencom")}</div></span>
            <span class="tag">${esc(o.juris)}</span></div>`).join("")}
        </div></div>
    </div>
  </div>

  <div class="card"><div class="hd"><h3>La cartera</h3>
    <span class="sub">${F.clients} clientes · ${int(F.employees)} trabajadores · ${F.states} estados</span></div>
    <div class="bd flush"><div class="scroll"><table class="dt">
      <thead><tr><th>Cliente</th><th>Sector</th><th>Estado</th><th class="num">Trabajadores</th>

      <tbody>${cli.rows.map(c=>`
        <tr class="clk ${sel&&sel.t==="client"&&sel.id===c.id?"sel":""}" data-client="${c.id}">

          <td class="tiny">${esc(c.state)}</td>
          <td class="num mono">${int(c.emp)}</td>
          <td class="num mono">${c.isn!=null?pct(c.isn,2):"—"}</td>
          <td>${c.svc.map(x=>`<span class="tag ${x==="fpl"?"accent":""}">${esc(x)}</span>`).join(" ")}</td></tr>`).join("")}
      </tbody></table></div>${moreBtn(cli.hidden)}</div></div>`;
};

/* ── CARTERA · CRM ──
   Dos vistas del mismo objeto: la cartera completa (para decidir) y la ficha
   de un cliente (para atenderlo). La ficha es de donde cuelga todo lo demás:
   contrato, quién responde, qué se le facturó y qué trae abierto en operación. */
const CRM = id => (D.crm && D.crm[id]) || null;
const SVCL = {nom:"Administración de nómina", inh:"In House", fpl:"FPL®",
              act:"Estudios actuariales", tal:"Reclutamiento"};
const PAGO_L = {"al corriente":["Al corriente","ok"], vencido:["Pago vencido","bad"]};
const plur = (n, s1, s2) => int(n) + " " + (n === 1 ? s1 : s2);
/* el cliente en foco: el seleccionado, si es un cliente; si no, el más grande */
function fichaId(){
  if(sel && sel.t === "client" && CRM(sel.id)) return sel.id;
  return D.clients.slice().sort((a,b)=>b.emp-a.emp)[0].id;
}

SC.cartera = () => tab.cartera === "ficha" ? carteraFicha() : carteraLista();

function carteraFicha(){
  const id = fichaId(), c = cO(id), m = CRM(id);
  if(!c || !m) return `<p class="lede">Sin ficha para este cliente.</p>`;
  const st = PAGO_L[m.pago] || PAGO_L["al corriente"];
  const rs = D.runs.filter(r=>r.c===id && r.stage!=="cerrada");
  const ms = D.movs.filter(x=>x.c===id && !x.filed);
  const ob = D.obligations.filter(o=>o.c===id && o.st!=="hecho");
  const fd = D.fund.filter(f=>f.c===id && fundState(f)!=="ok");
  const abiertas = m.facturas.filter(f=>f.st!=="pagada");
  const picker = `<div class="chiprow crmpick">
    <span class="rl">Cliente</span>
    <select class="csel" data-pick="client">
      ${D.clients.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(x=>
        `<option value="${x.id}" ${x.id===id?"selected":""}>${esc(x.n)}</option>`).join("")}
    </select></div>`;
  const openRow = (n, l1, l2, k) => `<div class="opline ${n?"":"z"}">
      <span class="v">${int(n)}</span><span class="l">${esc(n===1?l1:l2)}</span>
      ${n?`<button class="lnk" data-goto="${k}">ver en ${esc(NAV[k])} →</button>`:`<span class="tiny muted">nada abierto</span>`}</div>`;
  return `
  <p class="lede">La ficha de un cliente es <b>el expediente comercial</b>, no otra vista de la operación:
  en qué términos está, quién responde por él, qué se le facturó y qué trae abierto ahora mismo.</p>
  ${tabs("cartera",[["cartera","Cartera completa"],["ficha","Ficha del cliente"]])}
  ${picker}

  <div class="fichahd">
    <div>
      <div class="kick">${esc(c.sector)} · ${esc(c.city)}, ${esc(c.state)}</div>
      <h2 class="fname">${esc(c.n)}</h2>
      <div class="svcs">${c.svc.map(x=>`<span class="tag ${x==="fpl"?"accent":""}">${esc(SVCL[x]||x)}</span>`).join(" ")}</div>
    </div>
    <div class="pagost"><span class="tag ${st[1]==="ok"?"":st[1]==="bad"?"bad":"info"}">${esc(st[0])}</span>
      ${m.vencido?`<div class="amt bad">${mx(m.vencido)}</div><div class="tiny muted">vencido</div>`
        :m.porCobrar?`<div class="amt">${mx(m.porCobrar)}</div><div class="tiny muted">por cobrar</div>`
        :`<div class="tiny muted">sin saldo</div>`}</div>
  </div>

  <div class="cluster2">
    <div class="ins"><span class="k">Trabajadores</span><span class="v">${int(c.emp)}</span></div>
    <div class="ins"><span class="k">Cliente desde</span><span class="v">${c.since}</span></div>
    <div class="ins"><span class="k">Facturación mensual</span><span class="v">${mx(m.mensual)}</span></div>
    <div class="ins"><span class="k">Tarifa por trabajador</span><span class="v">${mx(m.tarifa)}</span></div>
    <div class="ins"><span class="k">Renovación</span><span class="v">${frel(m.renew)}</span></div>
  </div>

  <div class="split7">
    <div>
      <div class="card"><div class="hd"><h3>Contrato</h3></div><div class="bd">
        <dl class="kv">
          <dt>Número</dt><dd><span class="mono">${esc(m.contrato)}</span></dd>
          <dt>Modalidad</dt><dd>${esc(m.modalidad)}</dd>
          <dt>Vigente desde</dt><dd>${c.since} <span class="tiny muted">(${TODAY.getFullYear()-c.since} años)</span></dd>
          <dt>Próxima renovación</dt><dd>${venc(m.renew, "Renueva", "Renovó")}</dd>
          <dt>Registro patronal</dt><dd><span class="mono">${esc(c.rp)}</span></dd>
          <dt>Prima de riesgo</dt><dd>${pct(c.primaRT,4)} · clase ${esc(c.riskClass)}</dd>
          <dt>ISN aplicable</dt><dd>${c.isn!=null?pct(c.isn,2):"—"}${c.isn!==c.isnPrev?` <span class="tag bad">subió de ${pct(c.isnPrev,2)}</span>`:""}</dd>
          <dt>Calendarios</dt><dd>${c.cal.map(esc).join(" · ")}</dd>
        </dl></div></div>

      <div class="card"><div class="hd"><h3>Movimientos del plan</h3>
        <span class="sub">altas y bajas de servicio, con fecha</span></div><div class="bd">
        ${m.plan.map(p=>`<div class="tl"><div class="when ${p.t==="baja"?"bad":""}">${esc(fdate(p.day))}</div>
          <div class="what"><b>${p.t==="alta"?"Alta":"Baja"} · ${esc(SVCL[p.svc]||p.svc)}</b>
          <div class="tiny muted">${esc(p.note)}</div></div></div>`).join("")}
      </div></div>

      <div class="card"><div class="hd"><h3>Notas</h3>
        <span class="sub">${plur(m.notas.length,"nota","notas")} en el expediente</span></div><div class="bd">
        <div class="notebox">
          <input class="nin" id="nin" type="text" maxlength="160"
                 placeholder="Escribe una nota y presiona Agregar" aria-label="Nueva nota">
          <button class="pill" data-act="addnote">Agregar</button></div>
        ${m.notas.map(n=>`<div class="noteit"><div class="tiny muted">${esc(fdate(n.day))} · ${esc(sN(n.by))}</div>
          <div>${esc(n.t)}</div></div>`).join("")}
      </div></div>
    </div>

    <div>
      <div class="card"><div class="hd"><h3>Quién responde</h3></div><div class="bd">
        <div class="sect">En ${esc(c.n)}</div>
        <dl class="kv">
          <dt>Contacto</dt><dd><b>${esc(m.contacto.n)}</b><div class="tiny muted">${esc(m.contacto.role)}</div></dd>
          <dt>Correo</dt><dd><span class="mono tiny">${esc(m.contacto.mail)}</span></dd>
          <dt>Teléfono</dt><dd><span class="mono tiny">${esc(m.contacto.tel)}</span></dd>
        </dl>
        <div class="sect">En Vencom</div>
        <dl class="kv"><dt>Ejecutivo de cuenta</dt><dd><b>${esc(sN(m.ejecutivo))}</b>
          <div class="tiny muted">${esc(sR(m.ejecutivo))}</div></dd></dl>
      </div></div>

      <div class="card"><div class="hd"><h3>Última nómina procesada</h3></div><div class="bd">
        ${m.ultima ? `<dl class="kv">
          <dt>Fecha de pago</dt><dd>${esc(fdate(m.ultima.day))} <span class="tiny muted">(${esc(frel(m.ultima.day))})</span></dd>
          <dt>Calendario</dt><dd>${esc(m.ultima.cal)}</dd>
          <dt>Trabajadores</dt><dd>${int(m.ultima.emp)}</dd>
          <dt>Percepciones</dt><dd>${mx(m.ultima.gross)}</dd>
        </dl><button class="lnk" data-run="${esc(m.ultima.id)}">abrir la corrida ${esc(m.ultima.id)} →</button>`
        : `<div class="tiny muted">Sin corridas cerradas todavía.</div>`}
      </div></div>

      <div class="card"><div class="hd"><h3>Facturación y cobranza</h3>
        <span class="sub">${abiertas.length?plur(abiertas.length,"abierta","abiertas"):"sin saldo"}</span></div>
        <div class="bd flush"><div class="scroll"><table class="dt">
          <thead><tr><th>Factura</th><th>Emitida</th><th>Vence</th><th class="num">Importe</th><th>Estado</th></tr></thead>
          <tbody>${m.facturas.map(f=>`<tr>
            <td class="mono tiny">${esc(f.no)}</td>

            <td class="num mono">${mx(f.amt)}</td>
            <td><span class="tag ${f.st==="vencida"?"bad":f.st==="abierta"?"info":""}">${esc(f.st)}</span></td></tr>`).join("")}

      <div class="card"><div class="hd"><h3>Abierto en operación</h3>

        ${openRow(rs.length, "corrida de nómina en curso", "corridas de nómina en curso", "nomina")}
        ${openRow(ms.length, "movimiento IMSS sin presentar", "movimientos IMSS sin presentar", "imss")}
        ${openRow(ob.length, "obligación abierta", "obligaciones abiertas", "obligaciones")}
        ${openRow(fd.length, "submayor del fondo fuera de regla", "submayores del fondo fuera de regla", "fpl")}
      </div></div>
    </div>
  </div>`;
}

function carteraLista(){
  const cs = filtClients();
  const c = cut(cs.slice().sort((a,b)=>b.emp-a.emp), 8);
  const top3 = cs.slice().sort((a,b)=>b.emp-a.emp).slice(0,3);
  const conc = cs.length ? top3.reduce((a,x)=>a+x.emp,0)/cs.reduce((a,x)=>a+x.emp,0)*100 : 0;
  const bySec = {};
  cs.forEach(x=>{ bySec[x.sector] = (bySec[x.sector]||0)+x.emp; });
  const cobro = cs.map(x=>({c:x, m:CRM(x.id)})).filter(x=>x.m);
  const venc = cobro.filter(x=>x.m.pago==="vencido");
  const porCobrar = cobro.reduce((a,x)=>a+x.m.porCobrar, 0);
  return `
  <p class="lede">Un cliente no es un renglón: es un <b>contrato</b>, un registro patronal, una prima de
  riesgo y un estado con su propia tasa de ISN. Abre la <b>ficha</b> para ver a uno completo.</p>
  ${tabs("cartera",[["cartera","Cartera completa"],["ficha","Ficha del cliente"]])}
  ${chips("cartera", [["todos","Todos"],["nom","Nómina"],["inh","In House"],["fpl","FPL®"],["act","Actuaría"],["tal","Talento"]])}
  <div class="split64" style="margin-bottom:4px">
    <div class="card"><div class="hd"><h3>Trabajadores por cliente</h3>
      <span class="sub">en color, los tres más grandes</span></div><div class="bd">
      ${hbars(cs.slice().sort((a,b)=>b.emp-a.emp).map((x,i)=>({l:x.n, v:x.emp, t:int(x.emp),
        c: i<3 ? "var(--c1)" : "var(--border-strong)"})))}
      <div class="chartnote">Los tres más grandes son <b>${pct(conc,0)}</b> de la plantilla administrada.
      Esa concentración no aparece en el estado de resultados.</div>
    </div></div>
    <div class="card"><div class="hd"><h3>Por sector</h3></div><div class="bd">
      ${hbars(Object.keys(bySec).sort((a,b)=>bySec[b]-bySec[a]).slice(0,7)
        .map(k=>({l:k, v:bySec[k], t:int(bySec[k]), c:"var(--c1)"})))}
    </div></div>
  </div>
  <div class="card"><div class="bd flush"><div class="scroll"><table class="dt">
    <thead><tr><th>Cliente</th><th>Registro patronal</th><th class="num">Prima RT</th>
      <th class="num">Trabajadores</th><th>Calendarios</th><th class="num">ISN</th><th class="num">Desde</th></tr></thead>
    <tbody>${c.rows.map(x=>`
      <tr class="clk ${sel&&sel.t==="client"&&sel.id===x.id?"sel":""}" data-client="${x.id}">
        <td>${esc(x.n)}<div class="tiny muted">${esc(x.city)}, ${esc(x.state)}</div></td>
        <td class="mono tiny">${esc(x.rp)}</td>
        <td class="num mono">${pct(x.primaRT,4)}</td>
        <td class="num mono">${int(x.emp)}</td>
        <td class="tiny">${x.cal.map(y=>esc(y)).join(" · ")}</td>
        <td class="num mono" ${x.isn!==x.isnPrev?'style="color:var(--danger)"':""}>${x.isn!=null?pct(x.isn,2):"—"}${x.isn!==x.isnPrev?" ▲":""}</td>
        <td class="num mono">${x.since}</td></tr>`).join("")}
    </tbody></table></div>${moreBtn(c.hidden)}</div></div>
  <div class="note info">Las tasas con <b>▲</b> cambiaron para 2026. El sistema guarda la tasa con su fecha
  de vigencia, así que una corrida de diciembre se sigue calculando con la tasa de diciembre.</div>

  <div class="card"><div class="hd"><h3>Cobranza</h3>
    <span class="sub">${mx(porCobrar)} por cobrar · ${venc.length} con saldo vencido</span></div><div class="bd">
    ${hbars(cobro.filter(x=>x.m.porCobrar>0).sort((a,b)=>b.m.porCobrar-a.m.porCobrar).slice(0,8)
      .map(x=>({l:x.c.n, v:x.m.porCobrar, t:mx(x.m.porCobrar),
                c: x.m.pago==="vencido" ? "var(--danger)" : "var(--c1)"})))}
    <div class="chartnote">En rojo, lo que ya venció. La cobranza no es un tema de contabilidad aparte:
    un cliente que no paga sigue generando obligaciones con plazo legal a nombre de Vencom.</div>
  </div></div>`;
}

/* ── NÓMINA ── */
SC.nomina = () => {
  if(tab.nomina === "flujo") return nominaFlujo();
  const rs = filtRuns().slice().sort((a,b)=>a.payDay-b.payDay || a.c.localeCompare(b.c));
  const open = openRuns();
  const strip = dayBars(open.map(r=>({d:r.payDay})), {lo:-2, hi:16, riskAt:1, label:"corridas"});
  const byCal = ["semanal","catorcenal","quincenal","mensual"].map((k,i)=>({
    l:k, v:open.filter(r=>r.cal===k).length, c:PAL[i]}));
  const c = cut(rs, 12);
  return `
  <p class="lede">Catorce clientes con <b>${F.calendars} calendarios distintos</b> — semanal, catorcenal,
  quincenal y mensual — chocan cada fin de mes. Esta es la única vista donde eso se ve completo.</p>
  ${tabs("nomina",[["corridas","Corridas"],["flujo","Flujo del periodo"]])}

      ${splitBar(byCal)}

      mensuales con la misma plantilla. Ahí está el pico de fin de mes.</div>

  ${chips("nomina",[["todas","Todas"],["abiertas","Abiertas"],["incidencias","Incidencias"],["calculo","Cálculo"],["revision","Revisión"],["timbrado","Timbrado"],["cerrada","Cerradas"]])}
  <div class="card"><div class="bd flush"><div class="scroll"><table class="dt">

      <th class="num">Neto</th><th class="num">Timbrados</th><th class="num">Paga</th></tr></thead>
    <tbody>${c.rows.map(r=>{

};

function imssRecon(){
  const rs = D.recon.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const withDiff = rs.filter(r=>r.diffs.length);
  const dv = withDiff.map(r=>({l:cn(r.c), v:r.delta, t:mx(r.delta),
    attr:`data-recon="${r.c}"`, on: sel && sel.t==="recon" && sel.id===r.c}));
  return `
  <p class="lede">La comparación de tres vías —lo timbrado, lo que dice el SUA y lo que el IMSS emite
  en la EMA— es <b>el disparador clásico de auditoría</b>. Aquí es una cola de diferencias, no una hoja de cálculo.</p>
  ${tabs("imss",[["movs","Movimientos afiliatorios"],["recon","Conciliación SUA ↔ EMA"]])}
  <div class="grid g3" style="margin-bottom:18px">
    <div class="tile"><span class="klabel">Clientes conciliados</span><span class="stat">${int(D.recon.length)}</span>
      <span class="foot">cierre de ${monthLabel(-1)}</span></div>
    <div class="tile"><span class="klabel">Diferencias abiertas</span><span class="stat">${int(diffCount())}</span>
      <span class="foot">en ${withDiff.length} de ${D.recon.length} clientes</span></div>
    <div class="tile"><span class="klabel">Valor en disputa</span><span class="stat sm">${mx(diffValue())}</span>
      <span class="foot">suma en valor absoluto</span></div>
  </div>
  <div class="split64">
    <div class="card"><div class="hd"><h3>Diferencia contra la EMA</h3>
      <span class="sub">a la derecha, el IMSS cobra de más</span></div><div class="bd">
      ${dv.length?divergeBars(dv):`<p class="tiny muted">Todo cuadra.</p>`}
      <div class="chartnote">La EMA es la versión del IMSS de lo que se debe. Una diferencia a la derecha
      es dinero que el IMSS ya está cobrando y que nadie ha explicado.</div>
    </div></div>
    <div class="card"><div class="hd"><h3>Por qué no cuadra</h3></div><div class="bd">
      ${(()=>{const k={};withDiff.forEach(r=>r.diffs.forEach(d=>{k[d.k]=(k[d.k]||0)+1;}));
        return hbars(Object.entries(k).sort((a,b)=>b[1]-a[1])

      no las ${int(diffCount())} diferencias una por una.</div>
    </div></div>
  </div>`;
}

/* ── FPL® ── */
SC.fpl = () => {
  if(tab.fpl==="prestamos") return fplLoans();

  let fs = D.fund.slice().sort((a,b)=>(b.req?1:0)-(a.req?1:0) || (a.parity?1:0)-(b.parity?1:0));
  if(filt.fondo==="rotas") fs = fs.filter(f=>fundState(f) !== "ok");
  const blocked = fundBlocked(), brk = parityBrk(), over = overCap();
  const ok = D.fund.length - blocked.length - brk.length - over.filter(f=>f.parity&&!f.req).length;
  const cnt = st => D.fund.filter(f=>fundState(f)===st).length;
  const segs = [
    {l:"En regla", v:cnt("ok"), c:"var(--success)"},
    {l:"Sin paridad 1:1", v:cnt("sin-paridad"), c:"var(--c2)"},
    {l:"Sobre el tope", v:cnt("sobre-tope"), c:"var(--warning)"},
    {l:"Retiro bloqueado", v:cnt("bloqueado"), c:"var(--danger)"},
  ];
  const c = cut(fs, 10);

  <p class="lede">El fondo de ahorro sólo queda fuera del SBC si la aportación patronal es <b>igual</b> a la
  del trabajador, con <b>la misma periodicidad</b>, y si los retiros <b>no pasan de dos al año</b>.
  Romper cualquiera de las tres integra el fondo de forma retroactiva.</p>

        ? `<b>${int(fundBroken().length)}</b> de ${int(D.fund.length)} tienen una regla rota.

    </div></div>
    <div class="card"><div class="hd"><h3>El caso que cuesta dinero</h3></div><div class="bd">
      ${blocked.length?(()=>{const f=blocked[0];return `
        <div class="klabel">Retiro rechazado</div>
        <div style="font-family:var(--f-disp);font-weight:600;font-size:19px;margin:2px 0 3px">${esc(f.emp)}</div>
        <div class="tiny muted" style="margin-bottom:12px">${esc(cn(f.c))} · sería el tercer retiro del año</div>
        ${meterOf(f.wd, 2, "Retiros del año", f.wd+" de 2 permitidos")}
        ${meterOf(f.empYTD, f.cap, "Aportación contra el tope ("+esc(f.capBy)+")",
                  pct(f.empYTD/f.cap*100,0)+(f.empYTD>f.cap?" — excedida":""))}
        <div class="note bad" style="margin-top:4px">Un tercer retiro integra la aportación patronal al SBC
        <b>de forma retroactiva</b>, con las cuotas de todo el ejercicio.</div>`;})():""}
    </div></div>
  </div>

  ${chips("fondo",[["todos","Todos"],["rotas","Sólo con regla rota"]])}
  <div class="card"><div class="bd flush"><div class="scroll"><table class="dt">
    <thead><tr><th>Trabajador</th><th>Cliente</th><th class="num">Acum. trabajador</th>
      <th class="num">Acum. patrón</th><th class="num">Retiros</th><th>Regla</th></tr></thead>
    <tbody>${c.rows.map(f=>`
      <tr class="clk ${sel&&sel.t==="fund"&&sel.id===f.id?"sel":""}" data-fund="${f.id}">

        <td class="tiny muted">${esc(cn(f.c))}</td>
        <td class="num mono">${mx(f.empYTD)}</td>
        <td class="num mono" ${!f.parity?'style="color:var(--danger)"':""}>${mx(f.erYTD)}</td>

        <td>${f.req?`<span class="tag bad">retiro bloqueado</span>`

             :`<span class="tag ok">en regla</span>`}</td></tr>`).join("")}
    </tbody></table></div>${moreBtn(c.hidden)}</div></div>`;

/* ── PROSPECCIÓN — el módulo completo ── */
const PTABS = [["embudo","Embudo"],["fuentes","Fuentes"],["cola","Cola"],
               ["secuencias","Secuencias"],["respuestas","Respuestas"],
               ["entregas","Entregas"],["valor","Valor"],["cumplimiento","Cumplimiento"]];
const P_ = () => D.prospect;
const repN = id => (P_().reps.find(r=>r.id===id)||{n:"—"}).n;
const repI = id => (P_().reps.find(r=>r.id===id)||{ini:"—"}).ini;
const prosCost = () => Object.values(P_().costs).reduce((a,b)=>a+b,0);
const wonValue = () => P_().won.reduce((a,w)=>a+w.anual,0);
const prosLeads = () => P_().leads;
const contactedL = () => prosLeads().filter(l=>l.contactedDay!==null);
const repliedL = () => prosLeads().filter(l=>l.replyDay!==null);
const deliveredL = () => prosLeads().filter(l=>l.delivered);
const slaMiss = () => P_().handoffs.filter(h=>!h.sla);
const INTENT_L = {"interesado":"Interesado","pide-precio":"Pide precio","pide-junta":"Pide junta",
                  "pregunta":"Pregunta","más-tarde":"Más tarde","no-interesado":"No le interesa"};
const INTENT_C = {"interesado":"ok","pide-precio":"warn","pide-junta":"warn",
                  "pregunta":"info","más-tarde":"","no-interesado":"bad"};

/* Prospección no la opera Vencom: la opera Telaia y Vencom la revisa.
   Eso no es un detalle de permisos, es el modelo comercial — por eso el aviso
   va en TODAS las pestañas y no sólo en la primera. */
const PROS_BANNER = `<div class="ronly">
    <span class="badge">Sólo lectura</span>
    <div><b>Este módulo lo opera Telaia, no Vencom.</b> Aquí queda registrado todo lo que hace el
    motor de prospección —qué empresas encontró, a quién escribió, qué contestaron y qué se entregó
    al equipo comercial— para que Vencom lo revise y lo audite cuando quiera.
    Vencom no ejecuta búsquedas ni envía correos desde esta pantalla.</div>
  </div>`;

SC.prospeccion = () => {
  const t = tab.prospeccion;
  const head = `${PROS_BANNER}${tabs("prospeccion", PTABS)}`;
  if(t==="fuentes")      return pFuentes(head);
  if(t==="cola")         return pCola(head);
  if(t==="secuencias")   return pSecuencias(head);
  if(t==="respuestas")   return pRespuestas(head);
  if(t==="entregas")     return pEntregas(head);
  if(t==="valor")        return pValor(head);
  if(t==="cumplimiento") return pCumplimiento(head);
  return pEmbudo(head);
};

function pEmbudo(head){
  const P = P_(), f = P.funnel, top = f.encontrados;
  const rows = [["Empresas halladas",f.encontrados],["Con dato de contacto",f.contactables],
    ["Calificadas por ajuste",f.calificados],["Contactadas",f.contactados],
    ["Respondieron",f.respondieron],["Entregadas a un ejecutivo",f.entregados],
    ["Reuniones",f.reuniones],["Propuestas",f.propuestas],["Clientes firmados",f.ganados]];
  return `
  <p class="lede">Telaia opera un motor que <b>trae clientes nuevos para Vencom</b>: busca empresas que se
  parecen a las que Vencom ya administra bien, se queda con las que tienen contacto real, y escribe con un
  motivo concreto — la cuota que sube, la tasa que cambió, el registro que vence. Lo que ves aquí es
  <b>el registro de ese trabajo</b>, abierto para que Vencom lo revise.</p>
  ${head}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="tile"><span class="klabel">Clientes firmados</span><span class="stat">${P.won.length}</span>
      <span class="foot">en los últimos 90 días</span></div>
    <div class="tile"><span class="klabel">Valor anualizado</span><span class="stat sm">${mx(wonValue())}</span>

    <div class="tile"><span class="klabel">Costo de datos y modelo</span><span class="stat sm">${usd(prosCost())}</span>
      <span class="foot">90 días, las tres fuentes</span></div>
    <div class="tile"><span class="klabel">Costo por cliente firmado</span><span class="stat sm">${usd(prosCost()/P.won.length)}</span>

  <div class="split7">
    <div><div class="card"><div class="hd"><h3>De la búsqueda al contrato</h3>
      <span class="sub">90 días</span></div><div class="bd">
      <div class="funnel">${rows.map(([l,v],i)=>`
        <div class="fstep"><div>${esc(l)}</div>

      <div class="card"><div class="hd"><h3>Lo que abre la conversación</h3></div><div class="bd">
        ${hbars(Object.entries(prosLeads().reduce((a,l)=>{a[l.hook]=(a[l.hook]||0)+1;return a;},{}))

        le pega a esa empresa por su estado, su tamaño y su giro.</div>

      <div class="card"><div class="hd"><h3>Dónde está atorado</h3></div><div class="bd">

function pCola(head){
