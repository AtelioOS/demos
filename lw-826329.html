<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Liberty Wine Merchants · Telaia demo</title>
<meta name="description" content="Telaia operating-system demo for Liberty Wine Merchants — imports, shipments, LDB, stock across five shops, web orders, allocations, the vault, events, finance and people.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* Liberty Wine Merchants on Telaia — brand measured from libertywinemerchants.com (Nov 9 2026):
   canvas #FAF8F3 · sage #E8EDE6 · burgundy #7B102A · forest #244234 · cream #FFF8ED · display Goudy (→ Sorts Mill Goudy) · UI Lato */
:root{
  --canvas:#FAF8F3;--surface:#FFFFFF;--sunken:#F4F1EA;--sage:#E8EDE6;--cream:#FFF8ED;
  --border:#E4DED2;--border2:#D3CBBC;
  --ink:#1F2B24;--ink2:#3E4A43;--muted:#6F7069;
  --forest:#244234;--forest2:#1A3327;--wine:#7B102A;--wine2:#5E0B20;--wine-soft:#F5E6E8;
  --gold:#A27A2E;--ok:#2F6B47;--warn:#8A5A08;--danger:#A32E22;--info:#2B5F86;
  --ok-bg:#E6F0E9;--warn-bg:#FAF0DA;--danger-bg:#F8E4E1;--info-bg:#E3EDF5;
  --c-red:#7B102A;--c-white:#C9B458;--c-rose:#D98A93;--c-spark:#B9A15B;--c-fort:#6B3F2A;--c-spirit:#8A6A3D;--c-beer:#B57A2A;--c-sake:#8DA3A0;--c-other:#9A9A92;
  --disp:'Sorts Mill Goudy','Goudy Old Style',Georgia,serif;--sans:'Lato',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:10px;--sh:0 1px 2px rgba(36,66,52,.06),0 6px 18px rgba(36,66,52,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--wine)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100svh}
/* rail */
.side{background:var(--forest);color:#E9EFE9;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.lock{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.lock .w{font-family:var(--disp);font-size:27px;letter-spacing:.06em;line-height:1;color:#FFF8ED}
.lock .w2{font-family:var(--disp);font-size:13.5px;letter-spacing:.08em;margin-top:2px;color:#FFF8ED}
.lock .w3{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:3px}
.lock .on{margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
nav#nav{flex:1;overflow:auto;padding:10px 8px 16px}
.area{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:#DCE5DD;font-size:14px;font-weight:700}
.area:hover{background:rgba(255,255,255,.06)}
.area.on{background:rgba(255,248,237,.12);color:#fff}
.area svg{width:17px;height:17px;flex:none;opacity:.85}
.area .bdg{margin-left:auto}
.subs{margin:2px 0 8px 27px;border-left:1px solid rgba(255,255,255,.14);padding-left:6px}
.sub{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:6px;font-size:13px;color:#C9D4CB}
.sub:hover{background:rgba(255,255,255,.06);color:#fff}
.sub.on{color:#fff;background:rgba(123,16,42,.55)}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--wine);color:#fff;font-size:11px;font-weight:700}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;opacity:.7}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(250,248,243,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 22px;min-height:56px}
.shopsw{display:flex;gap:2px;background:var(--sunken);border:1px solid var(--border);border-radius:9px;padding:3px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.shopsw::-webkit-scrollbar{display:none}
.shopsw button{white-space:nowrap;flex:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.shopsw button.on{background:var(--forest);color:#fff}
.top .sp{flex:1}
.jump{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--surface);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:13px;white-space:nowrap;flex:none}
.jump kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px}
.tourbtn{flex:none;white-space:nowrap;background:var(--wine);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.mlock{display:none}
/* page */
.page{padding:18px 24px 40px;max-width:1360px;width:100%}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:400;font-size:31px;letter-spacing:.005em;margin:2px 0 4px;color:var(--forest)}
.lede{color:var(--ink2);margin:0 0 13px;max-width:900px;font-size:14.5px}
.lede b{color:var(--wine)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--forest);border-bottom-color:var(--wine)}
/* blocks */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh);min-width:0}
.kpi .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--disp);font-size:27px;line-height:1.15;color:var(--forest);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .s .up{color:var(--ok);font-weight:700}.kpi .s .dn{color:var(--danger);font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;min-width:0}
.card>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.card>.hd h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--forest);font-weight:900}
.card>.hd .r{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card>.bd{padding:12px 14px}
.card>.bd.np{padding:0}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:start}
.split.ev{grid-template-columns:1fr 1fr}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.split>*,.split3>*,.kpis>*{min-width:0}
.note{font-size:12px;color:var(--muted)}
.ill{font-size:11px;color:var(--muted);font-style:italic}
/* tables */
.scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:8px 11px;border-bottom:1px solid var(--border);background:var(--sunken);white-space:nowrap}
.dt td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
.dt tr:last-child td{border-bottom:0}
.dt tr.cl{cursor:pointer}.dt tr.cl:hover td{background:var(--cream)}
.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt .t1{font-weight:700;color:var(--ink)}.dt .t2{font-size:12px;color:var(--muted)}
.moretog{display:block;width:100%;padding:9px;font-size:12.5px;font-weight:700;color:var(--wine);border-top:1px solid var(--border)}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--sunken);color:var(--ink2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--danger-bg);color:var(--danger)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.wine{background:var(--wine-soft);color:var(--wine)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
/* charts */
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .lb small{display:block;color:var(--muted);font-size:11px}
.hb .tr{height:14px;background:var(--sunken);border-radius:3px;position:relative;overflow:hidden}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hb .vl{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.hb .cl{cursor:pointer}
.cols{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;height:100%;justify-content:flex-end}
.cols .b{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.cols .x{font-size:10px;color:var(--muted);white-space:nowrap}
.cols .stk{width:100%;display:flex;flex-direction:column-reverse}
.sbar{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.pipe{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:6px}
.pipe .st{background:var(--sunken);border-radius:8px;padding:9px 8px 8px;border:1px solid var(--border);min-width:0;cursor:pointer}
.pipe .st.hot{border-color:var(--wine);background:var(--wine-soft)}
.pipe .st .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .st .v{font-family:var(--disp);font-size:26px;color:var(--forest);line-height:1.1}
.pipe .st .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:10px;background:var(--sunken);border-radius:5px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--forest);border-radius:5px}
.meter i.hot{background:var(--wine)}
.track{display:flex;gap:0;margin:6px 0 4px}
.track .s{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--muted);padding-top:18px}
.track .s:before{content:'';position:absolute;top:5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--border2);z-index:1}
.track .s:after{content:'';position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--border2)}
.track .s:first-child:after{display:none}
.track .s.done:before,.track .s.done:after{background:var(--forest)}
.track .s.cur:before{background:var(--wine);box-shadow:0 0 0 4px var(--wine-soft)}
.track .s.cur{color:var(--wine);font-weight:700}
/* queue */
.q{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.q:last-child{border-bottom:0}.q:hover{background:var(--cream)}
.q .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:900}
.q .ic.bad{background:var(--danger-bg);color:var(--danger)}.q .ic.warn{background:var(--warn-bg);color:var(--warn)}.q .ic.info{background:var(--info-bg);color:var(--info)}
.q .t{font-weight:700}.q .d{font-size:12.5px;color:var(--muted)}
.q .go{margin-left:auto;font-size:12px;color:var(--wine);font-weight:700;white-space:nowrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-weight:700;font-size:13px;border:1px solid var(--border2);background:var(--surface);white-space:nowrap}
.btn.pri{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.wine{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--surface)}
.chips button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
input.inp,select.inp{font:inherit;padding:7px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);color:var(--ink);min-width:0}
.calc{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13.5px}
.calc .tot{font-weight:900;border-top:1px solid var(--border);padding-top:5px}
.wf{display:flex;align-items:stretch;gap:4px;height:200px}
.wf .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.wf .b{width:100%;border-radius:3px}
.wf .x{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2;height:38px;overflow:hidden}
.wf .x b{color:var(--ink);font-size:11px}
/* inspector */
.insp{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(31,43,36,.14);z-index:70;transform:translateX(104%);transition:transform .22s ease;display:flex;flex-direction:column}
.insp.open{transform:none}
.insp .ih{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.insp .ih h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:0;color:var(--forest);line-height:1.15}
.insp .ih .k{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.insp .ib{padding:14px 16px;overflow:auto;flex:1}
#inspclose{margin-left:auto;font-size:22px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13.5px;margin-bottom:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900;margin:14px 0 6px}
.scrim{position:fixed;inset:0;background:rgba(31,43,36,.25);z-index:60;display:none}
.scrim.open{display:block}
/* toast + palette */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;z-index:120;max-width:min(560px,92vw);box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translateX(-50%)}
.pal{position:fixed;inset:0;z-index:110;background:rgba(31,43,36,.35);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.open{display:flex}
.pal .box{width:min(620px,94vw);background:var(--surface);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:14px 16px;font:inherit;font-size:16px;outline:none}
.pal .res{max-height:52vh;overflow:auto}
.pal .it{display:flex;gap:10px;padding:9px 16px;cursor:pointer;align-items:center}
.pal .it.on,.pal .it:hover{background:var(--cream)}
.pal .it small{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
/* bottom bar */
.bbar{display:none}
/* masthead */
.mast{background:var(--forest);color:#FFF8ED;border-radius:12px;padding:16px 18px;margin-bottom:12px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.mast .g{font-family:var(--disp);font-size:25px;line-height:1.15}
.mast .g em{font-style:normal;color:#F1DFD9}
.mast .s{font-size:13px;opacity:.82;margin-top:3px}
.mast .bot{margin-left:auto;display:flex;gap:6px;align-items:flex-end;height:58px;flex:none}
.mast .bot i{display:block;width:12px;border-radius:5px 5px 2px 2px;opacity:.9}
.invite{display:flex;align-items:center;gap:12px;background:var(--cream);border:1px solid #EADFCB;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13.5px}
.invite .x{margin-left:auto;color:var(--muted);font-size:18px}
/* tour */
.tourL{position:fixed;inset:0;z-index:100;pointer-events:none}
.tourhole{position:absolute;border-radius:10px;box-shadow:0 0 0 9999px rgba(20,32,26,.55);outline:2px solid #F1DFD9;transition:all .25s ease}
.tourhole.none{left:50%;top:40%;width:0;height:0}
.tourcard{position:absolute;pointer-events:auto;background:var(--surface);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:14px 16px;width:min(390px,92vw)}
.tourcard .n{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.tourcard h4{font-family:var(--disp);font-weight:400;font-size:21px;margin:2px 0 4px;color:var(--forest)}
.tourcard p{margin:0 0 8px;font-size:13.5px}
.tourcard .say{font-size:12.5px;background:var(--cream);border-left:3px solid var(--wine);padding:6px 9px;border-radius:4px;margin-bottom:10px}
body.touring .page{pointer-events:none}
.disclaim{font-size:11.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--border);padding-top:10px}

/* ---- responsive layer: injected LAST ---- */
.grid>*,.split>*,.split3>*,.kpis>*{min-width:0}
@media (max-width:1180px){
  .kpis.k5{grid-template-columns:repeat(3,1fr)}
  .split3{grid-template-columns:1fr 1fr}
  .jump span.lbl{display:none}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mlock{display:block;font-family:var(--disp);font-size:19px;letter-spacing:.06em;color:var(--forest);flex:none;line-height:1}
  .mlock small{display:block;font-size:9.5px;letter-spacing:.14em;font-family:var(--sans);text-transform:uppercase;color:var(--muted)}
  .top{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .top .sp{display:none}
  .shopsw{order:5;flex:1 1 100%}
  .split,.split.ev,.split3{grid-template-columns:1fr}
  .page{padding:14px 14px 96px}
  .bbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--forest);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
  .bbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:#C9D4CB;font-size:10px;font-weight:700;position:relative;padding:4px 0;min-width:0}
  .bbar button svg{width:19px;height:19px}
  .bbar button.on{color:#fff}
  .bbar .bdg{position:absolute;top:0;left:55%;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .pipe{grid-template-columns:repeat(4,1fr)}
  .toast{bottom:80px}
}
@media (max-width:760px){
  h1{font-size:25px}
  .kpis,.kpis.k5{grid-template-columns:1fr 1fr;gap:8px}
  .kpis>*:nth-child(odd):last-child{grid-column:1/-1}
  .kpi .v{font-size:22px}
  .scroll table.dt{min-width:620px}
  .scroll .dt th:first-child,.scroll .dt td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  .scroll .dt th:first-child{background:var(--sunken)}
  .scroll .dt td:first-child:after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--border)}
  .hb{grid-template-columns:minmax(80px,120px) 1fr auto}
  .pipe{grid-template-columns:repeat(3,1fr)}
  .mast .bot{display:none}

<script>/* Liberty Wine Merchants · Telaia operating-system demo */
const DATA = window.__DATA__;
const TODAY = new Date(DATA.today + 'T12:00:00');

const SKU = Object.fromEntries(SKUS.map(s => [s.id, s]));
const STORE = Object.fromEntries(STORES.map(s => [s.id, s]));

const COLL = Object.fromEntries(DATA.coll.map(c => [c.id, c]));
const S = { area: 'home', mod: 'today', tab: null, shop: 'ALL', more: {}, chip: {}, invite: true };
window.__TRUNC__ = {};

/* ---------- utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString('en-CA', { minimumFractionDigits: d, maximumFractionDigits: d });
const $m = (n, d = 0) => (n < 0 ? '−$' : '$') + fmt(Math.abs(n), d);
const $k = n => Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : Math.abs(n) >= 1e4 ? '$' + (n / 1e3).toFixed(1) + 'k' : $m(n);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const dOf = s => new Date(s + 'T12:00:00');
const days = s => Math.round((dOf(s) - TODAY) / 864e5);
const dfmt = s => dOf(s).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
const rel = s => { const d = days(s); return d === 0 ? 'today' : d === 1 ? 'tomorrow' : d === -1 ? 'yesterday' : d > 0 ? `in ${d} d` : `${-d} d ago`; };
const sum = a => a.reduce((x, y) => x + y, 0);
const shopIds = () => S.shop === 'ALL' ? STORES.map(s => s.id) : [S.shop];
const shopName = () => S.shop === 'ALL' ? 'all five shops' : STORE[S.shop].name;
const KCOL = { 'Red': 'var(--c-red)', 'White': 'var(--c-white)', 'Rosé': 'var(--c-rose)', 'Sparkling': 'var(--c-spark)', 'Fortified & sweet': 'var(--c-fort)', 'Spirits': 'var(--c-spirit)', 'Beer & cider': 'var(--c-beer)', 'Sake': 'var(--c-sake)', 'Other': 'var(--c-other)' };
const SCOL = { PG: '#244234', LN: '#7B102A', FV: '#A27A2E', GI: '#2B5F86', CD: '#B5653A' };

/* ---------- derived numbers ---------- */
const stockOf = (s, ids = shopIds()) => sum(ids.map(i => s.stock[i] || 0));
const wkOf = (s, ids = shopIds()) => s.wk[ids[0]].map((_, w) => sum(ids.map(i => s.wk[i][w])));
const avg4 = (s, ids = shopIds()) => sum(wkOf(s, ids).slice(-4)) / 4;
const cover = (s, ids = shopIds()) => { const a = avg4(s, ids); return a > 0 ? stockOf(s, ids) / a : 99; };
const weekSales = (w, ids = shopIds(), f = () => true) => sum(SKUS.filter(f).map(s => sum(ids.map(i => s.wk[i][w])) * s.pr));
const weekGM = (w, ids = shopIds()) => sum(SKUS.map(s => sum(ids.map(i => s.wk[i][w])) * (s.pr - s.cost)));
const inTransit = id => sum(DATA.ship.filter(x => x.stage < 6).flatMap(x => x.lines).filter(l => l.sku === id).map(l => l.cases * 12));
const margin = s => (s.pr - s.cost) / s.pr;
const WEEKS = (() => { const a = []; for (let w = 12; w >= 0; w--) { const d = new Date(TODAY); d.setDate(d.getDate() - 7 * w - 1); a.push(d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })); } return a; })();

function transfers() {
  const out = [];
  for (const s of SKUS) {
    for (const to of STORES) {
      const a = avg4(s, [to.id]); const st = s.stock[to.id];
      if (a < 2 || st / a >= 1.2) continue;
      const need = Math.ceil(a * 2.5 - st);
      const donors = STORES.filter(f => f.id !== to.id).map(f => ({ f, a: avg4(s, [f.id]), st: s.stock[f.id] }))
        .filter(d => d.st - need >= Math.max(4, d.a * 3)).sort((x, y) => (y.st / (y.a || .1)) - (x.st / (x.a || .1)));

    const covAtArrival = a ? (st + tr) / a - lead : 99;

    return { s, a, st, tr, lead, covAtArrival, cases };

function queue() {

  const lateOn = DATA.online.filter(o => o.late && !['Delivered', 'Picked up'].includes(o.status));
  if (lateOn.length) q.push({ sev: 'bad', t: `${lateOn.length} web orders older than a day and not out the door`, d: lateOn.map(o => `${o.id} · ${o.status} · ${STORE[o.store].name}`).join(' · '), go: () => openOrder(lateOn[0].id), area: 'sell', key: 'web' });

  if (alloc.length) q.push({ sev: 'info', t: `${alloc.length} allocation offers expire within 3 days`, d: alloc.slice(0, 3).map(a => `${COLL[a.cust].name} · ${a.n}`).join(' · '), go: () => nav('sell', 'clients'), area: 'sell', key: 'alloc' });

  const spec = DATA.spec.filter(x => x.status === 'Requested' && days(x.d) < -28);
  if (spec.length) q.push({ sev: 'info', t: `Spec order waiting on an LDB quote for ${-days(spec[0].d)} days`, d: `${spec[0].cust} · ${spec[0].cases} cs ${spec[0].n}`, go: () => nav('sell', 'trade'), area: 'sell', key: 'spec' });
  const vu = vaultUsed() / DATA.vault.capacity; const unpaid = DATA.vault.clients.filter(c => !c.paid);
  if (vu > .8 || unpaid.length) q.push({ sev: 'warn', t: `Vault ${Math.round(vu * 100)} % full · ${unpaid.length} storage accounts unpaid`, d: `${$m(sum(unpaid.map(c => c.cases12 * DATA.vault.rate12 * 3)))} outstanding (3-month billing)`, go: () => nav('cellar', 'vault'), area: 'cellar', key: 'vault' });
  const sir = DATA.staff.filter(p => days(p.sir) <= 30 && (S.shop === 'ALL' || p.store === S.shop));
  if (sir.length) q.push({ sev: sir.some(p => days(p.sir) < 0) ? 'bad' : 'warn', t: `${sir.length} Serving It Right certificate${sir.length > 1 ? 's' : ''} expired or expiring`, d: sir.map(p => `${p.name} (${p.store === 'HO' ? 'Head office' : STORE[p.store].name}) ${days(p.sir) < 0 ? 'expired ' + rel(p.sir) : 'expires ' + rel(p.sir)}`).join(' · '), go: () => nav('run', 'people'), area: 'run', key: 'sir' });

  return q;
}

/* ---------- chart primitives ---------- */
function hbars(rows, o = {}) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="hb">${rows.map(r => `<div class="lb${r.act ? ' cl' : ''}" ${r.act || ''} title="${esc(r.l)}">${esc(r.l)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div><div class="tr"><div class="fl" style="width:${Math.max(1.5, r.v / max * 100)}%;background:${r.c || 'var(--forest)'}"></div></div><div class="vl">${r.f || fmt(r.v)}</div>`).join('')}</div>`;
}
function cols(vals, o = {}) {
  const max = Math.max(...vals.map(v => Array.isArray(v) ? sum(v) : v), 1);
  return `<div class="cols" style="height:${o.h || 118}px">${vals.map((v, i) => {
    const parts = Array.isArray(v) ? v : [v];
    return `<div class="c" title="${esc((o.x || [])[i] || '')}: ${o.fmt ? o.fmt(sum(parts)) : fmt(sum(parts))}"><div class="stk" style="height:${sum(parts) / max * 100}%">${parts.map((p, j) => `<div class="b" style="height:${sum(parts) ? p / sum(parts) * 100 : 0}%;background:${(o.c || [])[j] || (i === vals.length - 1 && o.hl ? 'var(--wine)' : 'var(--forest)')}"></div>`).join('')}</div><div class="x">${esc((o.x || [])[i] ?? '')}</div></div>`;
  }).join('')}</div>`;
}
function splitBar(segs) {
  const t = sum(segs.map(s => s.v)) || 1;
  return `<div class="sbar">${segs.map(s => `<div title="${esc(s.l)}" style="flex:${s.v / t};background:${s.c}"></div>`).join('')}</div><div class="leg">${segs.map(s => `<span><i class="dot" style="background:${s.c}"></i>${esc(s.l)} · ${s.f || fmt(s.v)}</span>`).join('')}</div>`;
}
function meter(v, cap) { const p = v / cap * 100; return `<div class="meter"><i class="${p > 85 ? 'hot' : ''}" style="width:${Math.min(100, p)}%"></i></div>`; }
function line(vals, o = {}) {
  if (!vals.length) return '<div class="note">No logger data yet.</div>';
  const w = 420, h = 120, mn = Math.min(...vals, o.min ?? 0), mx = Math.max(...vals, o.max ?? 1);
  const X = i => 30 + i / (vals.length - 1) * (w - 40), Y = v => 10 + (mx - v) / (mx - mn || 1) * (h - 30);
  const band = o.band ? `<rect x="30" y="${Y(o.band[1])}" width="${w - 40}" height="${Y(o.band[0]) - Y(o.band[1])}" fill="#E6F0E9"/>` : '';
  const zero = mn < 0 ? `<line x1="30" x2="${w - 10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#A32E22" stroke-dasharray="3 3"/><text x="2" y="${Y(0) + 4}" font-size="10" fill="#A32E22">0°</text>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${band}${zero}<polyline fill="none" stroke="#244234" stroke-width="2" points="${vals.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>${vals.map((v, i) => v < 0 ? `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#7B102A"/>` : '').join('')}<text x="2" y="${Y(mx) + 4}" font-size="10" fill="#6F7069">${mx}°</text><text x="30" y="${h - 2}" font-size="10" fill="#6F7069">${esc(o.x0 || '')}</text><text x="${w - 10}" y="${h - 2}" font-size="10" fill="#6F7069" text-anchor="end">${esc(o.x1 || '')}</text></svg>`;
}
function pipe(stages, hot = -1, act = '') { return `<div class="pipe" style="--n:${Math.min(stages.length, 7)}">${stages.map((s, i) => `<div class="st${i === hot || s.hot ? ' hot' : ''}" ${act ? `data-act="${act}" data-i="${i}"` : ''}><div class="l">${esc(s.l)}</div><div class="v">${s.v}</div><div class="s">${esc(s.s || '')}</div></div>`).join('')}</div>`; }
function table(key, cols, rows, n = 10) {
  const hidden = Math.max(0, rows.length - n); const show = S.more[key] ? rows : rows.slice(0, n);
  window.__TRUNC__[key] = S.more[key] ? 0 : hidden;
  return `<div class="scroll"><table class="dt"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${show.map(r => `<tr class="${r._act ? 'cl' : ''}" ${r._act || ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="note">Nothing here.</td></tr>`}</tbody></table></div>${hidden && !S.more[key] ? `<button class="moretog" data-act="more" data-k="${key}">Show all ${rows.length} (${hidden} more)</button>` : ''}`;
}
const card = (t, body, o = {}) => `<div class="card" ${o.id ? `id="${o.id}"` : ''}><div class="hd"><h3>${t}</h3>${o.r ? `<div class="r">${o.r}</div>` : ''}</div><div class="bd${o.np ? ' np' : ''}">${body}</div></div>`;
const kpi = (l, v, s = '') => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const trend = (a, b) => { if (!b) return ''; const p = Math.round((a - b) / b * 100); return `<span class="${p >= 0 ? 'up' : 'dn'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)} %</span>`; };
const pill = (t, c = '') => `<span class="pill ${c}">${esc(t)}</span>`;

const ACT = (fn, arg) => `data-act="${fn}" data-a="${esc(arg)}"`;

  ${card('All shipments', table('ships', [{ h: 'Shipment', f: x => `<span class="mono">${x.id}</span><div class="t2">${esc(x.mode)}</div>` }, { h: 'Producers', f: x => `<div class="t1">${esc(x.prods.map(p => PRODMAP[p].name).join(' · '))}</div><div class="t2">${esc(x.route)}</div>` }, { h: 'Stage', f: x => pill(STAGES[x.stage], x.hold ? 'bad' : x.stage === 6 ? 'ok' : 'info') }, { h: 'ETA', f: x => `${dfmt(x.eta)}<div class="t2">${rel(x.eta)}</div>` }, { h: 'Cases', n: 1, f: x => x.cases }, { h: 'FOB (CAD)', n: 1, f: x => $m(x.fobCad) }], DATA.ship.slice().sort((a, b) => a.stage - b.stage || days(a.eta) - days(b.eta)).map(x => ({ ...x, _act: ACT('ship', x.id) })), 10), { np: true, id: 'shiptable' })}`;

function landed(s, o) {
  const p = PRODMAP[s.prod], cur = p ? p.cur : 'EUR', fx = DATA.fx[cur];
  const fobCase = o.fob ?? Math.round(s.cost * 12 / 2.05 / fx * 100) / 100;
  const fob = fobCase * fx / 12, freight = (o.freight ?? 11.5) / 12, excise = .75 * .75, duty = (p && p.cty === 'South Africa') ? .02 : 0, ldbMark = (fob + freight + excise) * (o.mark ?? .89), fees = 0.48;
  const whole = fob + freight + excise + duty + ldbMark + fees;
  return { cur, fobCase, rows: [['FOB price', fob], ['Ocean + inland freight', freight], ['Federal excise (≈ $0.75/L)', excise], [p && p.cty === 'South Africa' ? 'Customs duty (MFN, per litre)' : 'Customs duty (CETA: nil)', duty], ['LDB wholesale mark-up', ldbMark], ['LDB handling & container fees', fees]], whole, retail: s.pr };
}

  <div class="chips">${['All', 'Agency', 'Red', 'White', 'Sparkling', 'Rosé', 'Fortified & sweet', 'Spirits', 'Beer & cider'].map(s => `<button class="${f === s ? 'on' : ''}" data-act="chip" data-g="inv" data-v="${s}">${s}</button>`).join('')}</div>

  openInsp('Producer · ' + p.cty, esc(p.name), `<dl class="kv"><dt>Region</dt><dd>${esc(p.reg)}, ${esc(p.cty)}</dd><dt>Ships from</dt><dd>${esc(p.port)}</dd><dt>Terms</dt><dd>${p.terms} · ${p.cur}</dd><dt>Lead time</dt><dd>${p.lead} weeks door to shelf</dd></dl><div class="sec">Wines · 13-week bottles</div>${hbars(sk.map(s => ({ l: s.n, v: sum(wkOf(s, all)), f: fmt(sum(wkOf(s, all))) + ' btl', act: ACT('sku', s.id) })))}<div class="sec">Orders</div>${DATA.po.filter(x => x.prod === id).map(x => `<div class="note" style="cursor:pointer" ${ACT('po', x.id)}>${x.id} · ${x.status} · ${x.cur} ${fmt(x.total)}</div>`).join('')}`);
}
function openColl(id) {
  const c = COLL[id], A = DATA.alloc.filter(a => a.cust === id), v = DATA.vault.clients.find(x => x.id === id);
  openInsp(c.tier, esc(c.name), `<dl class="kv"><dt>Home shop</dt><dd>${STORE[c.store].name}</dd><dt>12-month spend</dt><dd>${$m(c.spend)}</dd><dt>Vault</dt><dd>${v ? `${v.cases12} cases · ${v.paid ? 'paid' : '<b style="color:var(--danger)">overdue</b>'}` : '—'}</dd></dl><div class="sec">Allocations</div>${A.map(a => `<div class="note">${esc(a.n)} × ${a.qty} · ${a.status}${a.ship ? ' · on ' + a.ship : ''}</div>`).join('') || '<div class="note">None.</div>'}<div class="btnrow" style="margin-top:12px"><button class="btn pri" data-act="toast" data-m="Personal note drafted to ${esc(c.name)} from the ${STORE[c.store].name} buyer.">Write to them</button></div><div class="ill" style="margin-top:10px">Fictional client.</div>`);
}
function openEvent(id) {
  const e = DATA.events.find(x => x.id === id);
  const pours = SKUS.filter(s => s.agency || s.k === 'Sparkling').slice(0, Math.min(e.pours, 14));
  openInsp('Event · ' + dfmt(e.d), esc(e.name), `<dl class="kv"><dt>Venue</dt><dd>${esc(e.venue)}</dd><dt>Tickets</dt><dd>${e.sold} / ${e.cap}</dd><dt>For</dt><dd>${esc(e.charity)}</dd>${e.raised_total ? `<dt>Raised to date</dt><dd>${$m(e.raised_total)}</dd>` : ''}</dl><div class="sec">Pour list · bottles to reserve</div>${table('pour' + id, [{ h: 'Wine', f: s => esc(s.n) }, { h: 'Bottles', n: 1, f: s => Math.ceil(e.cap / 18) }, { h: 'Best source', f: s => { const b = STORES.slice().sort((a, c) => s.stock[c.id] - s.stock[a.id])[0]; return `${b.name} (${s.stock[b.id]})`; } }], pours, 20)}<div class="btnrow" style="margin-top:12px"><button class="btn pri" data-act="toast" data-m="${pours.length} wines reserved from shop stock and tagged for ${esc(e.name)}.">Reserve stock</button></div>`);
}

/* ---------- actions ---------- */
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3200); }
const A = {
  sku: a => openSku(a), ship: a => openShip(a), po: a => openPO(a), order: a => openOrder(a), prod: a => openProd(a), coll: a => openColl(a), event: a => openEvent(a),
  shop: a => { S.shop = a; S.more = {}; closeInsp(); render(); toast('Scoped to ' + STORE[a].name + '. Everything now shows this shop only.'); },
  approve: a => { const t = transfers().find(x => x.id === a); if (!t) return; t.sku.stock[t.from] -= t.qty; t.sku.stock[t.to] += t.qty; S.moved = (S.moved || 0) + t.qty; render(); toast(`${t.qty} × ${t.sku.n} moving ${STORE[t.from].name} → ${STORE[t.to].name} on tomorrow's van.`); },
  resolve: a => { const x = DATA.ship.find(y => y.id === a); x.hold = null; closeInsp(); render(); toast(`${a} released. The allocations waiting on it are back on track.`); },
  draftpo: a => { const s = SKU[a]; let p = DATA.po.find(x => x.prod === s.prod && x.status === 'Draft'); if (!p) { p = { id: 'PO-' + (4200 + DATA.po.length), prod: s.prod, cur: PRODMAP[s.prod].cur, status: 'Draft', sent: DATA.today, lines: [], total: 0, ship: null }; DATA.po.push(p); } const r = reorders().find(x => x.s.id === a); const fob = Math.round(s.cost * 12 / 2.05 / DATA.fx[p.cur] * 100) / 100; p.lines.push({ sku: a, n: s.n, cases: r ? r.cases : 10, fob, cur: p.cur }); p.total = Math.round(sum(p.lines.map(l => l.cases * l.fob))); render(); toast(`Added to draft ${p.id} for ${PRODMAP[s.prod].name}.`); },
  sendpo: a => { const p = DATA.po.find(x => x.id === a); p.status = 'Sent'; p.sent = DATA.today; openPO(a); render(); toast(`${a} sent to ${PRODMAP[p.prod].name}.`); },
  confpo: a => { const p = DATA.po.find(x => x.id === a); p.status = 'Confirmed'; p.stale = false; openPO(a); render(); toast(`${a} confirmed.`); },
  advance: a => { const o = DATA.online.find(x => x.id === a); const st = ['New', 'Picking', 'Out for delivery', 'Delivered']; const i = st.indexOf(o.status); if (i >= 0 && i < 3) o.status = st[i + 1]; if (o.status === 'Out for delivery' || o.status === 'Delivered') o.late = false; openOrder(a); render(); toast(`${a} → ${o.status}`); }
};
function nav(area, mod, tab) { S.area = area; S.mod = mod || AREAS.find(a => a.id === area).m[0][0]; S.tab = tab || null; S.more = {}; closeInsp(); render(); window.scrollTo(0, 0); }

/* ---------- shell ---------- */
function render() {
  window.__TRUNC__ = {};
  const ar = AREAS.find(a => a.id === S.area), q = queue();
  const badge = id => q.filter(x => x.area === id).length;
  document.getElementById('nav').innerHTML = AREAS.map(a => `<button class="area ${a.id === S.area ? 'on' : ''}" data-act="area" data-v="${a.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${IC[a.id]}</svg>${a.l}${badge(a.id) ? `<span class="bdg">${badge(a.id)}</span>` : ''}</button>${a.id === S.area ? `<div class="subs">${a.m.map(([k, l]) => `<button class="sub ${k === S.mod ? 'on' : ''}" data-act="mod" data-v="${k}">${l}</button>`).join('')}</div>` : ''}`).join('');
  document.getElementById('bbar').innerHTML = AREAS.map(a => `<button class="${a.id === S.area ? 'on' : ''}" data-act="area" data-v="${a.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${IC[a.id]}</svg>${a.l}${badge(a.id) ? `<span class="bdg">${badge(a.id)}</span>` : ''}</button>`).join('');
  document.getElementById('shopsw').innerHTML = [['ALL', 'All shops'], ...STORES.map(s => [s.id, s.name])].map(([k, l]) => `<button class="${S.shop === k ? 'on' : ''}" data-act="${k === 'ALL' ? 'allshops' : 'shop'}" data-a="${k}">${l}</button>`).join('');
  const mt = ar.m.find(m => m[0] === S.mod);
  document.getElementById('page').innerHTML = `<div class="crumb">${ar.l} · ${esc(shopName())}</div><h1>${mt[1]}</h1>${ar.m.length > 1 ? `<div class="tabs" id="areatabs">${ar.m.map(([k, l]) => `<button class="${k === S.mod ? 'on' : ''}" data-act="mod" data-v="${k}">${l}</button>`).join('')}</div>` : ''}${MODS[S.mod]()}<div class="disclaim">Demo built by Telaia for Liberty Wine Merchants. Shops, products, prices and published figures are read from libertywinemerchants.com; all operational data is illustrative — see Run → Systems map.</div>`;
}
document.addEventListener('click', e => {
  if (document.body.classList.contains('touring') && !e.target.closest('.tourcard')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, a = el.dataset.a, v = el.dataset.v;
  if (A[act]) { e.stopPropagation(); return A[act](a); }
  switch (act) {
    case 'area': nav(v); break;
    case 'mod': S.mod = v; S.tab = null; S.more = {}; render(); window.scrollTo(0, 0); break;
    case 'tab': S.tab = v; S.more = {}; render(); break;
    case 'chip': S.chip[el.dataset.g] = v; S.more = {}; render(); break;
    case 'pochip': S.chip.po = ['Draft', 'Sent', 'Confirmed', 'Shipped', 'Received'][+el.dataset.i]; render(); break;
    case 'more': S.more[el.dataset.k] = 1; render(); break;
    case 'allshops': S.shop = 'ALL'; S.more = {}; render(); break;
    case 'q': { const x = queue().find(y => y.key === el.dataset.k); x && x.go(); break; }
    case 'toast': toast(el.dataset.m); break;
    case 'tour': startTour(); break;
    case 'noinvite': S.invite = false; render(); break;
    case 'jump': openPal(); break;
    case 'inspclose': closeInsp(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'costsku') { S.costSku = el.value; S.costO = {}; render(); }
  if (el.dataset.act === 'costin') { S.costO = S.costO || {}; const n = parseFloat(el.value); if (!isNaN(n)) S.costO[el.dataset.f] = n; render(); }
});

/* ---------- jump palette ---------- */
let palItems = [], palSel = 0;
function palIndex() {
  const out = [];
  AREAS.forEach(a => a.m.forEach(([k, l]) => out.push({ t: l, s: a.l, go: () => nav(a.id, k) })));
  STORES.forEach(s => out.push({ t: s.name, s: 'Shop', go: () => A.shop(s.id) }));
  DATA.ship.forEach(x => out.push({ t: x.id + ' · ' + x.prods.map(p => PRODMAP[p].name).join(', '), s: 'Shipment', go: () => { nav('import', 'shipments'); openShip(x.id); } }));
  DATA.po.forEach(p => out.push({ t: p.id + ' · ' + PRODMAP[p.prod].name, s: 'PO', go: () => { nav('import', 'orders'); openPO(p.id); } }));
  DATA.online.forEach(o => out.push({ t: o.id + ' · ' + o.cust, s: 'Web order', go: () => { nav('sell', 'online'); openOrder(o.id); } }));
  SKUS.forEach(s => out.push({ t: s.n, s: s.k, go: () => { nav('stock', 'inventory'); openSku(s.id); } }));
  DATA.coll.forEach(c => out.push({ t: c.name, s: 'Collector', go: () => { nav('sell', 'clients'); openColl(c.id); } }));
  return out;
}
function openPal() { document.getElementById('pal').classList.add('open'); const i = document.getElementById('palin'); i.value = ''; palFilter(''); setTimeout(() => i.focus(), 10); }
function closePal() { document.getElementById('pal').classList.remove('open'); }
function palFilter(q) {
  const t = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  palItems = palIndex().filter(x => !t || (x.t + ' ' + x.s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(t)).slice(0, 40); palSel = 0; palDraw();
}
function palDraw() {
  document.getElementById('palres').innerHTML = palItems.map((x, i) => `<div class="it ${i === palSel ? 'on' : ''}" data-i="${i}">${esc(x.t)}<small>${esc(x.s)}</small></div>`).join('') || '<div class="it">No match</div>';
}
document.getElementById('palin')?.addEventListener('input', e => palFilter(e.target.value));
document.getElementById('palres')?.addEventListener('click', e => { const it = e.target.closest('.it'); if (it && palItems[+it.dataset.i]) { closePal(); palItems[+it.dataset.i].go(); } });
document.getElementById('pal')?.addEventListener('click', e => { if (e.target.id === 'pal') closePal(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
  if (document.getElementById('pal').classList.contains('open')) {
    if (e.key === 'Escape') closePal();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { palSel = Math.max(0, Math.min(palItems.length - 1, palSel + (e.key === 'ArrowDown' ? 1 : -1))); palDraw(); e.preventDefault(); }
    if (e.key === 'Enter' && palItems[palSel]) { closePal(); palItems[palSel].go(); }
    return;
  }
  if (document.body.classList.contains('touring')) { if (e.key === 'ArrowRight') tourStep(T.i + 1); if (e.key === 'ArrowLeft') tourStep(T.i - 1); if (e.key === 'Escape') endTour(); return; }
  if (e.key === 'Escape') closeInsp();
});

/* ---------- guided tour: drives the real app ---------- */
const TOUR = [
  { at: { area: 'home', mod: 'today', shop: 'ALL' }, target: null, t: 'Liberty, on one system', b: 'Five shops, an import agency, a cellar vault and a calendar of charity tastings — today they live in separate tills, spreadsheets, inboxes and the LDB portal. This is all of it in one place.', say: '"Everything you\'re about to see uses your real shops and your real wines and prices from the website. The operational numbers are made up."' },
  { at: { area: 'home', mod: 'today' }, target: '#needsyou', t: 'The morning list', b: 'Nobody types this list. It\'s worked out from the data: a held container, shops about to run out, a promo priced below your floor, a late web order, an expiring Serving It Right certificate.', say: '"Each line opens the exact record. Fix it and the line disappears."' },
  { at: { area: 'home', mod: 'today' }, target: '#byshop', t: 'Every shop, side by side', b: 'Last week\'s sales by shop. Click one and the whole system narrows to that shop — what a store manager sees.', say: '"Your Granville Island manager logs in and sees Granville Island."' },
  { at: { area: 'import', mod: 'shipments' }, target: '#shippipe', t: 'From the producer\'s door to your shelf', b: 'Every container and pallet, through port, CBSA and the LDB — where wine you\'ve paid for sits until it\'s released.', say: '"How long does wine sit at the LDB today before you can sell it? This tells you per shipment."' },
  { at: { area: 'import', mod: 'shipments' }, open: () => openShip('SHP-2612'), target: '#insp', t: 'A frozen Burgundy, caught early', get b() { const n = DATA.alloc.filter(x => x.ship === 'SHP-2612').length; return `The pallet of Remoissenet came across the prairies by rail and the logger shows ${Math.min(...DATA.ship.find(x => x.id === 'SHP-2612').temp)} °C. ${n} collector allocations are waiting on it. The system says so before the LDB accepts it.`; }, say: '"You find out about the cold snap now, not when a customer opens a pushed cork."' },
  { at: { area: 'import', mod: 'shipments' }, open: () => openShip('SHP-2611'), target: '#insp', t: 'A paperwork hold', b: 'The invoice says the Tavel is a 2024; the label registration says 2025. One click drafts the email to the producer and the forwarder; another releases it when the corrected invoice lands.', say: '"Small mismatch, two weeks of a container sitting at Centerm."' },
  { at: { area: 'import', mod: 'ldb' }, target: '#costwf', t: 'Landed cost, per bottle', b: 'FOB, freight, excise, the LDB mark-up — all the way to your shelf price and margin. Change the euro price and see the margin move before you sign the order.', say: '"Rates here are placeholders — we load your actual LDB price sheet."' },
  { at: { area: 'stock', mod: 'inventory' }, target: '#invtable', t: 'One count, five shops', b: 'Every wine, every shop, in bottles and in weeks of cover. Red means a shop has less than a week left.', say: '"The same bottle, wherever it is."' },
  { at: { area: 'stock', mod: 'transfers' }, target: '#trtable', t: 'Move it before you buy it', get b() { const t = transfers()[0]; return t ? `${esc(t.sku.n)}: ${t.sku.stock[t.to]} bottles at ${STORE[t.to].name}, selling ${t.avg.toFixed(0)} a week; ${STORE[t.from].name} has ${t.sku.stock[t.from]}. Approve, and both counts change and it goes on tomorrow's van.` : 'Every shop is balanced right now.'; }, say: '"Try it — press Approve."' },
  { at: { area: 'stock', mod: 'reorder' }, target: null, t: 'Reorder on import lead times', b: 'Imports take three months. The reorder list counts what\'s already on the water and tells you what will run short before a new order could land — and adds it to a draft PO in the producer\'s currency.', say: '"No more discovering in January that the Portuguese white sold out in December."' },
  { at: { area: 'sell', mod: 'clients' }, target: '#alloctable', t: 'Allocations', b: 'Scarce wines offered to the people who\'ve earned them. The ones riding on the held Burgundy pallet are flagged, so you call them first.', say: '"Your best customers hear about a delay from you, not by asking."' },
  { at: { area: 'cellar', mod: 'vault' }, target: '#vaultcap', t: 'The vault, billed and booked', b: 'Your published rates — $3.49 a case, three-month minimum, whole-case withdrawals by appointment. Capacity, unpaid accounts and visit bookings in one place.', say: '"At this rate the vault is full in about a year — worth knowing now."' },
  { at: { area: 'grow', mod: 'events' }, target: null, t: 'Tastings that raise money', b: 'Taste BC, Tastings-in-the-Park, Fall into the Market — tickets, pour lists, and the bottles they pull from shop stock, reserved so they don\'t get sold the week before.', say: '"The pour list reserves stock automatically."' },
  { at: { area: 'run', mod: 'systems' }, target: null, t: 'Real vs illustrative', b: 'This page lists exactly what came from your website and what was invented. Connected, the system reads your tills, web store, LDB invoices and forwarders — no retyping.', say: '"What would you want it to do first?"' }
];
const T = { i: 0 };
function startTour() { closeInsp(); document.body.classList.add('touring'); document.getElementById('tourL').style.display = 'block'; window.__TOURLEN__ = TOUR.length; tourStep(0); }
function endTour() { document.body.classList.remove('touring'); document.getElementById('tourL').style.display = 'none'; closeInsp(); window.__TOURN__ = -1; }
function tourStep(i) {
  if (i < 0) return; if (i >= TOUR.length) return endTour();
  T.i = i; window.__TOURN__ = i; const st = TOUR[i];
  closeInsp();
  if (st.at.shop) S.shop = st.at.shop;
  S.area = st.at.area; S.mod = st.at.mod; S.tab = null; S.more = {}; render();
  if (st.open) st.open();
  setTimeout(() => {
    const hole = document.getElementById('tourhole'), cardEl = document.getElementById('tourcard');
    const tgt = st.target ? document.querySelector(st.target) : null;
    window.__TOURTARGET__ = st.target;
    cardEl.innerHTML = `<div class="n">STEP ${i + 1} OF ${TOUR.length}</div><h4>${st.t}</h4><p>${st.b}</p><div class="say">${esc(st.say)}</div><div class="btnrow"><button class="btn sm" id="tprev" ${i === 0 ? 'disabled' : ''}>← Back</button><button class="btn sm pri" id="tnext">${i === TOUR.length - 1 ? 'Finish' : 'Next →'}</button><button class="btn sm" id="tend" style="margin-left:auto">End tour</button></div>`;
    cardEl.querySelector('#tprev').onclick = () => tourStep(i - 1); cardEl.querySelector('#tnext').onclick = () => tourStep(i + 1); cardEl.querySelector('#tend').onclick = endTour;
    const vw = innerWidth, vh = innerHeight;
    if (tgt && st.target !== '#insp') tgt.scrollIntoView({ block: 'center' });
    setTimeout(() => {
      if (tgt) { const r = tgt.getBoundingClientRect(); const top = Math.max(4, r.top - 6), h = Math.min(r.height + 12, vh - top - 4); Object.assign(hole.style, { left: r.left - 6 + 'px', top: top + 'px', width: r.width + 12 + 'px', height: h + 'px' }); hole.className = 'tourhole'; }
      else { hole.className = 'tourhole none'; hole.removeAttribute('style'); }
      if (vw <= 760) { cardEl.style.left = ''; cardEl.style.top = ''; return; }
      const cw = cardEl.offsetWidth, ch = cardEl.offsetHeight;
      let L, Tp;
      if (!tgt) { L = (vw - cw) / 2; Tp = (vh - ch) / 2; }
      else {
        const r = tgt.getBoundingClientRect();
        if (r.height > vh * .6) { L = r.left > cw + 30 ? r.left - cw - 20 : Math.min(vw - cw - 12, r.right + 20); if (L + cw > vw || L < 0) L = 12; Tp = Math.max(12, (vh - ch) / 2); }
        else if (vh - r.bottom > ch + 20) { Tp = r.bottom + 14; L = Math.min(Math.max(12, r.left), vw - cw - 12); }
        else if (r.top > ch + 20) { Tp = r.top - ch - 14; L = Math.min(Math.max(12, r.left), vw - cw - 12); }
        else { Tp = vh - ch - 12; L = Math.min(Math.max(12, r.left), vw - cw - 12); }
      }
      cardEl.style.left = L + 'px'; cardEl.style.top = Tp + 'px';
    }, 260);
  }, 30);
}
window.addEventListener('resize', () => { if (document.body.classList.contains('touring')) tourStep(T.i); });

/* ---------- boot ---------- */
render();
if (/[?&]tour=1/.test(location.search)) startTour();
</script>
